# Minimal lockfile for the bare consumer fixture, in the shape
# scripts/ci/native-hash.sh reads: importers["."].dependencies and
# .devDependencies, each entry carrying a `version`.
lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:
  .:
    dependencies:
      react:
        specifier: 19.1.1
        version: 19.1.1
      react-native:
        specifier: 0.85.2
        version: 0.85.2
    devDependencies:
      '@react-native-community/cli':
        specifier: ^20.0.0
        version: 20.0.0
      knip:
        specifier: ^6.34.0
        version: 6.34.0
      typescript:
        specifier: ~6.0.3
        version: 6.0.3
