name: Unit
on:
  workflow_call:
    inputs:
      repository:
        description: Consumer repository to check out (defaults to the caller's repository)
        type: string
        default: ''
      ref:
        description: Consumer ref to check out (empty lets actions/checkout resolve the correct ref, including PR merge refs)
        type: string
        default: ''
      working-directory:
        description: Consumer directory relative to GITHUB_WORKSPACE
        type: string
        default: '.'
      linux-runner:
        description: Runner label for this job
        type: string
        default: 'ubuntu-latest'
      macos-runner:
        description: Runner label for macOS jobs (unused by this workflow; carried for input-set consistency across the family)
        type: string
        default: 'macos-26'
      native-cache-version:
        description: Native cache key prefix (unused by this workflow; carried for input-set consistency across the family)
        type: string
        default: 'v1'
      coverage:
        description: Run the coverage-script instead of test-script, and upload the coverage/ artifact
        type: boolean
        default: true
      test-script:
        description: Consumer package.json script to run when coverage is disabled
        type: string
        default: 'test'
      coverage-script:
        description: Consumer package.json script to run when coverage is enabled
        type: string
        default: 'test:coverage'
      scripts-test-script:
        description: Consumer package.json script that tests scripts/ itself (empty skips this step)
        type: string
        default: 'test:scripts'
      coverage-artifact-retention-days:
        description: Retention (days) for the uploaded coverage/ artifact
        type: number
        default: 30
    secrets:
      consumer-token:
        description: PAT with read access to a private consumer repository; falls back to the caller's github.token (works for a public consumer)
        required: false
permissions:
  contents: read
jobs:
  unit:
    name: Tests
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
      - name: Unit tests
        env:
          SCRIPT_NAME: ${{ inputs.coverage && inputs.coverage-script || inputs.test-script }}
        run: bash "$WORKFLOWS_DIR/scripts/checks/run-script.sh" "$SCRIPT_NAME"
      - name: Scripts tests
        if: ${{ inputs.scripts-test-script != '' }}
        env:
          SCRIPT_NAME: ${{ inputs.scripts-test-script }}
        run: bash "$WORKFLOWS_DIR/scripts/checks/run-script.sh" "$SCRIPT_NAME"
      - name: Upload coverage
        if: always() && inputs.coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: ${{ inputs.working-directory }}/coverage
          if-no-files-found: ignore
          retention-days: ${{ inputs.coverage-artifact-retention-days }}
