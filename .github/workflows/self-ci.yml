name: CI
on:
  push: { branches: [main] }
  # No filter for the release PR here: `branches-ignore` under pull_request
  # matches the PR's *base* branch, so a `release-please--**` entry matched
  # nothing (0.6.1 to 0.7.0 still carried the red run), and no filter could
  # help - GitHub creates the run before it reads this file. See
  # self-release.yml for why that run has no jobs, and for the fix.
  pull_request:
  # Started by name from self-release.yml on the release PR's branch: the one
  # event GitHub still fires for a PR opened with GITHUB_TOKEN. The Commits
  # job is gated on the pull_request event and is skipped here.
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: self-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
# Two callers rather than one job running `make check`, so a run graph names
# the gate that failed: `Checks / Code`, `Checks / Security`, ... and
# `Unit / Tests`, `Unit / Package`. That is the shape a consumer's own CI has,
# and the reason to match it is the same one - a reader should see which gate
# went red without opening a log.
#
# Local paths, not @v0: this repository's CI has to run the ref under review.
# A tag here would test the last release on every pull request.
jobs:
  # Which of the narrow gates this change can affect: Code (shellcheck,
  # actionlint), Tooling (the version checks) and Package (the dev-config
  # suite). The rest - Tests, Security, Docs, Commits - read the whole tree or
  # the whole history and run on every change. A skipped job counts as passing,
  # which is why this is a job and not a `paths` filter on the trigger.
  #
  # The base is the PR's only. A push to main and the release PR's dispatch
  # have none, so they fail open and run every gate: main's push run is the one
  # that counts, and it stays complete.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      tooling: ${{ steps.classify.outputs.tooling }}
      package: ${{ steps.classify.outputs.package }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/self/changed-gates.sh "$BASE_SHA" "$HEAD_SHA"
  # `!= 'false'`, not `== 'true'`: an output that never arrived runs the gate.
  checks:
    name: Checks
    needs: changes
    uses: ./.github/workflows/self-checks.yml
    with:
      code: ${{ needs.changes.outputs.code != 'false' }}
      tooling: ${{ needs.changes.outputs.tooling != 'false' }}
  # No `needs: checks`. A consumer gates its unit job that way to keep a red
  # run out of a twenty-minute E2E. Here every job finishes in about two
  # minutes, so serializing would buy latency and nothing else.
  unit:
    name: Unit
    needs: changes
    uses: ./.github/workflows/self-unit.yml
    with:
      package: ${{ needs.changes.outputs.package != 'false' }}
