name: CI
on:
  push: { branches: [main] }
  # No filter for the release PR here: `branches-ignore` under pull_request
  # matches the PR's *base* branch, so a `release-please--**` entry matched
  # nothing (0.6.1 to 0.7.0 still carried the red run), and no filter could
  # help - GitHub creates the run before it reads this file. See
  # self-release.yml for why that run has no jobs, and for the fix.
  pull_request:
  # Started by name from self-release.yml on the release PR's branch: the one
  # event GitHub still fires for a PR opened with GITHUB_TOKEN. The Commits
  # job is gated on the pull_request event and is skipped here.
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: self-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
# Callers rather than one job running `make check`, so a run graph names
# the gate that failed: `Checks / Code`, `Checks / Security`, ...,
# `Unit / Tests`, `Unit / Package` and `Consumer rehearsal / Section`. That is the shape a consumer's own CI has,
# and the reason to match it is the same one - a reader should see which gate
# went red without opening a log.
#
# Local paths, not @v0: this repository's CI has to run the ref under review.
# A tag here would test the last release on every pull request.
jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/self-checks.yml
  # No `needs: checks`. A consumer gates its unit job that way to keep a red
  # run out of a twenty-minute E2E, and has a docs-only classifier to consult
  # first. Here every job finishes in about two minutes and there is no
  # classifier, so serializing would buy latency and nothing else.
  unit:
    name: Unit
    uses: ./.github/workflows/self-unit.yml
  # pr-release-notes.yml run for real against the template, in a dry run: the
  # one reusable workflow a pull request here can execute (self-rehearsal.yml
  # says why). The grant is the one the called job declares, and a called
  # workflow can never hold more than its caller grants.
  rehearsal:
    name: Consumer rehearsal
    uses: ./.github/workflows/self-rehearsal.yml
    permissions:
      contents: read
      pull-requests: write
