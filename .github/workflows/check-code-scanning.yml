name: Check code scanning
# Advanced-setup CodeQL rather than GitHub's Default setup: the query suite,
# the path exclusions and the alert-suppression mechanism then live in the
# consumer's repository as reviewable files, instead of in a settings page.
#
# Informational by design. A caller must NOT make this a required check: a
# runner hiccup or a transient pack download must never block a merge. Alerts
# land under Security -> Code scanning.
on:
  workflow_call:
    inputs:
      repository:
        description: Consumer repository to check out (defaults to the caller's repository)
        type: string
        default: ''
      ref:
        description: Consumer ref to check out (empty lets actions/checkout resolve the correct ref, including PR merge refs)
        type: string
        default: ''
      working-directory:
        description: Consumer directory relative to GITHUB_WORKSPACE (unused by this workflow; CodeQL reads the whole checkout and the configuration file's paths-ignore scopes it)
        type: string
        default: '.'
      linux-runner:
        description: Runner label for every job in this workflow
        type: string
        default: 'ubuntu-latest'
      macos-runner:
        description: Runner label for macOS jobs (unused by this workflow; carried for input-set consistency across the family)
        type: string
        default: 'macos-26'
      native-cache-version:
        description: Native cache key prefix (unused by this workflow; carried for input-set consistency across the family)
        type: string
        default: 'v1'
      languages:
        description: Comma-separated CodeQL languages to analyze
        type: string
        default: 'javascript-typescript'
      configuration-file:
        description: Consumer-relative CodeQL configuration file, optional, merged over the family's defaults (paths-ignore added; name, queries and packs replaced)
        type: string
        default: './.github/codeql/codeql-config.yml'
      docs-patterns:
        description: Extra regular expression alternatives (POSIX ERE, '|'-joined) added to the built-in docs pattern for docs-only detection
        type: string
        default: ''
    secrets:
      consumer-token:
        description: PAT with read access to a private consumer repository; falls back to the caller's github.token (works for a public consumer)
        required: false
    outputs:
      docs-only:
        description: "'true' when every changed file matched the docs globs, so no analysis ran"
        value: ${{ jobs.changes.outputs.docs-only }}
permissions:
  contents: read
jobs:
  changes:
    name: Changes
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
          fetch-depth: 0
      # No setup here, exactly as in check.yml: changed-class.sh is pure git,
      # so this job reaches it through the plain .workflows checkout ($WORKFLOWS_DIR is
      # published by the setup action, which never runs in this job).
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Classify changed files
        id: classify
        env:
          # Byte-identical to check.yml's expression on purpose: the classifier
          # is the family's single source for "is this docs-only", and a second
          # spelling of the base sha is a second rule. On a `schedule` event both
          # operands are empty, the script logs "no base sha" and fails open with
          # docs-only=false - which is exactly what the weekly re-scan of an idle
          # main is for.
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          DOCS_GLOBS_EXTRA: ${{ inputs.docs-patterns }}
        run: bash ".workflows/scripts/ci/changed-class.sh" "$BASE_SHA" "$HEAD_SHA"
  code-scanning:
    name: Code scanning
    needs: [changes]
    # Nothing to analyse when no code moved. CodeQL is informational and must
    # not be a required check, so a skip here blocks nothing.
    if: ${{ needs.changes.outputs.docs-only != 'true' }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 30
    # Naming `permissions:` at all resets the unnamed scopes to none, so
    # `contents: read` is re-declared here or the checkout below loses it.
    permissions:
      contents: read
      actions: read # workflow metadata for the SARIF upload
      security-events: write # upload the SARIF results
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      # The configuration CodeQL reads is the family's defaults with the
      # consumer's own file merged over them (paths-ignore added; name,
      # queries and packs replaced), resolved by the same program the local
      # `check-code-scanning` uses, so CI and a laptop read the same text. A
      # consumer with no file is scanned on the defaults, with the suite, the
      # alert-suppression pack (what makes an inline `// codeql[rule-id]`
      # marker count) and the path exclusions every consumer wants.
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      # `.workflows` is in the defaults' paths-ignore, so the checkout above is
      # not extracted into the database whatever the consumer's own file says.
      - name: Resolve the CodeQL configuration
        env:
          CONFIGURATION_FILE: ${{ inputs.configuration-file }}
        run: bash ".workflows/scripts/ci/resolve-code-scanning-config.sh" "$CONFIGURATION_FILE" .codeql-config.yml
      # No build step: JS/TS is extracted from source, so autobuild is not used.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ inputs.languages }}
          config-file: ./.codeql-config.yml
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ inputs.languages }}
