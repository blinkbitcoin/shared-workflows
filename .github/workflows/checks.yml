name: Checks
on:
  workflow_call:
    inputs:
      repository:
        description: Consumer repository to check out (defaults to the caller's repository)
        type: string
        default: ''
      ref:
        description: Consumer ref to check out (empty lets actions/checkout resolve the correct ref, including PR merge refs)
        type: string
        default: ''
      working-directory:
        description: Consumer directory relative to GITHUB_WORKSPACE
        type: string
        default: '.'
      linux-runner:
        description: Runner label for Linux jobs
        type: string
        default: 'ubuntu-latest'
      macos-runner:
        description: Runner label for macOS jobs (unused by this workflow; carried for input-set consistency across the family)
        type: string
        default: 'macos-26'
      native-cache-version:
        description: Native cache key prefix (unused by this workflow; carried for input-set consistency across the family)
        type: string
        default: 'v1'
      typecheck:
        description: Run the consumer's typecheck script
        type: boolean
        default: true
      lint:
        description: Run the consumer's lint script
        type: boolean
        default: true
      format:
        description: Run the consumer's format:check script
        type: boolean
        default: true
      knip:
        description: Run the consumer's knip script
        type: boolean
        default: true
      spell:
        description: Run the consumer's spell script
        type: boolean
        default: true
      docs-check:
        description: Run the consumer's check:docs script (docs freshness, the AGENTS.md command table, table widths, diagram parsing)
        type: boolean
        default: true
      i18n:
        description: Run i18n:extract and assert it produced no uncommitted changes
        type: boolean
        default: false
      graphql-codegen:
        description: Run codegen and assert it produced no uncommitted changes
        type: boolean
        default: false
      expo-doctor:
        description: Run expo-doctor
        type: boolean
        default: true
      audit:
        description: Run pnpm audit --prod
        type: boolean
        default: true
      audit-level:
        description: Minimum severity that fails pnpm audit
        type: string
        default: 'high'
      audit-soft-on-pr:
        description: Let a failing audit be advisory on a pull_request (it stays blocking on push, release and dispatch)
        type: boolean
        default: true
      commitlint:
        description: Lint the PR title against Conventional Commits
        type: boolean
        default: true
      commitlint-commits:
        description: Also lint every commit in the PR against Conventional Commits (needs commitlint)
        type: boolean
        default: false
      actionlint:
        description: Lint the consumer's .github/workflows with actionlint
        type: boolean
        default: true
      shellcheck:
        description: Lint the consumer's scripts/ with shellcheck
        type: boolean
        default: true
      licenses:
        description: Run the consumer's `deps:licenses` script (dependency licence policy)
        type: boolean
        default: true
      prebuild-check:
        description: >-
          Run the consumer's `check-prebuild` script (prebuild both platforms into
          a temp dir and assert the config plugins produced what they should).
          Off by default: it is minutes, not seconds.
        type: boolean
        default: false
      bundle-secrets:
        description: >-
          Run the consumer's `check:bundle-secrets` script (export the bundle and
          assert no non-public key leaked into it). Off by default: it is minutes,
          not seconds.
        type: boolean
        default: false
      release-checks:
        description: Run the consumer's `check:release` script (Fastfile/Gemfile lint, release config validation); needs Ruby, so it is off by default
        type: boolean
        default: false
      contract-check:
        description: >-
          Report every unmet requirement of this family in one place, before the
          gates that would each die on their own. Off makes the step a no-op;
          the job still runs, because every other job needs it (see the job).
        type: boolean
        default: true
      contract-only:
        description: >-
          Run the contract check and nothing else. For a repository that is
          still being wired up: it answers "would these workflows work here?"
          in seconds, without spending runners on gates that cannot pass yet.
          A run under this flag gates nothing, so it says so - the job logs a
          warning and the summary names it. Not a setting to leave on.
        type: boolean
        default: false
      docs-only-detection:
        description: Classify the PR as docs-only so callers can skip downstream jobs
        type: boolean
        default: true
      docs-globs:
        description: Extra regex alternatives (POSIX ERE, '|'-joined) added to the built-in docs pattern for docs-only detection
        type: string
        default: ''
    secrets:
      consumer-token:
        description: PAT with read access to a private consumer repository; falls back to the caller's github.token (works for a public consumer)
        required: false
    outputs:
      docs-only:
        description: 'true when every changed file matched the docs globs (empty when docs-only-detection is disabled)'
        value: ${{ jobs.changes.outputs.docs-only }}
permissions:
  contents: read
jobs:
  changes:
    name: Changes
    if: ${{ inputs.docs-only-detection }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
          fetch-depth: 0
      # No setup here: changed-class.sh is pure git and doesn't need node/pnpm,
      # so this job skips it and reaches the script via the plain checkout path
      # (there's no $WORKFLOWS_DIR yet -- that's exported by setup, which never runs).
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Classify changed files
        id: classify
        env:
          # One classifier for every event. `pull_request.base.sha` is empty on
          # a push, so the old unconditional form classified only PRs and every
          # merge to main ran the full matrix; `github.event.before` is the
          # push's previous tip (all-zero on a branch's first push, which the
          # script treats as "cannot classify" and fails open).
          # Both operands of `&&` are non-empty, so the family's `cond && '' ||`
          # pitfall (GitHub's `&&` yields its first falsy operand) cannot bite.
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          # _EXTRA, not DOCS_GLOBS: the input is additive, so it must not
          # replace the built-in ^docs/|\.md$|... pattern.
          DOCS_GLOBS_EXTRA: ${{ inputs.docs-globs }}
        run: bash ".workflows/scripts/ci/changed-class.sh" "$BASE_SHA" "$HEAD_SHA"
  contract:
    name: Contract
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 5
    # No `if:` on the job, deliberately, even though `contract-check` can turn
    # this off. Every other job in this workflow `needs:` this one, and a job
    # whose dependency was *skipped* is skipped too - so an `if:` here would
    # make `contract-check: false` skip the entire Checks workflow, and a
    # skipped job counts as passing for a required check. The toggle gates the
    # step instead; what is left is two checkouts, which is seconds.
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      # No setup: this runs *before* the toolchain exists, which is the point.
      # A consumer with no mise config or no lockfile fails inside setup with
      # `missing command: pnpm`, several steps removed from the cause. The
      # checker is dependency-free node, so the runner image's own node runs it.
      - name: Check the consumer contract
        if: ${{ inputs.contract-check }}
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          WORKFLOWS_CONTRACT_ONLY: ${{ inputs.contract-only }}
        run: bash ".workflows/scripts/ci/contract-check.sh"
  code:
    name: Code
    needs: contract
    if: ${{ !inputs.contract-only }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
      - name: Typecheck
        if: ${{ inputs.typecheck }}
        env:
          SCRIPT_NAME: typecheck
        run: bash "$WORKFLOWS_DIR/scripts/checks/run-script.sh" "$SCRIPT_NAME"
      - name: Lint
        if: ${{ inputs.lint }}
        env:
          SCRIPT_NAME: lint
        run: bash "$WORKFLOWS_DIR/scripts/checks/run-script.sh" "$SCRIPT_NAME"
      - name: Format
        if: ${{ inputs.format }}
        env:
          SCRIPT_NAME: 'format:check'
        run: bash "$WORKFLOWS_DIR/scripts/checks/run-script.sh" "$SCRIPT_NAME"
      - name: Knip
        if: ${{ inputs.knip }}
        env:
          SCRIPT_NAME: knip
        run: bash "$WORKFLOWS_DIR/scripts/checks/run-script.sh" "$SCRIPT_NAME"
      - name: Spell
        if: ${{ inputs.spell }}
        env:
          SCRIPT_NAME: spell
        run: bash "$WORKFLOWS_DIR/scripts/checks/run-script.sh" "$SCRIPT_NAME"
      # The consumer's docs gate. It is handed the event shape rather than
      # working it out: a docs-freshness heuristic needs a diff base, and on a
      # PR that base is the target branch, not HEAD~1. PR_AUTHOR is what lets
      # the consumer exempt a bot's dependency bump from "you changed
      # architecture without touching docs".
  generated:
    name: Generated
    needs: contract
    if: ${{ !inputs.contract-only }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
      - name: i18n
        if: ${{ inputs.i18n }}
        run: bash "$WORKFLOWS_DIR/scripts/checks/run-consumer-or.sh" 'i18n:check' scripts/checks/i18n.sh
      - name: GraphQL codegen
        if: ${{ inputs.graphql-codegen }}
        run: bash "$WORKFLOWS_DIR/scripts/checks/run-consumer-or.sh" 'codegen:check' scripts/checks/codegen.sh
      # deps:check, not expo-doctor: the template's script is
      # `expo install --check && expo-doctor`. The two overlap - expo-doctor
      # validates installed versions against the SDK as well - so this closes no
      # gap on its own; it is here so one gate has one implementation.
  docs:
    name: Docs
    needs: contract
    if: ${{ !inputs.contract-only }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
      - name: Docs
        if: ${{ inputs.docs-check }}
        env:
          SCRIPT_NAME: 'check:docs'
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: bash "$WORKFLOWS_DIR/scripts/checks/run-script.sh" "$SCRIPT_NAME"
      # The consumer's own script wins when it ships one; the script in this
      # repo is the fallback. See scripts/checks/run-consumer-or.sh for why -
      # in short, a gate the consumer defines and a gate CI runs must be the
      # same gate, and for these five they were not.
  dependencies:
    name: Dependencies
    needs: contract
    if: ${{ !inputs.contract-only }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
      - name: Expo doctor
        if: ${{ inputs.expo-doctor }}
        run: bash "$WORKFLOWS_DIR/scripts/checks/run-consumer-or.sh" 'deps:check' scripts/checks/expo-doctor.sh
      # The audit is one registry request (the advisories/bulk endpoint), and
      # that endpoint is the family's known staller: esign measured 5s-102s for
      # identical payloads on a healthy day. So the step gets a bound of its
      # own, and a fetch timeout that is *larger* than the bound, so a stall is
      # ended by `timeout-minutes` with a step name in the log rather than by a
      # network layer that reports `code undefined:`.
      #
      # The fetch timeouts are step-level on purpose, and that is the whole
      # point of them: esign aebdd28 has a workflow-level 60s
      # NPM_CONFIG_FETCH_TIMEOUT - set for an installer's cold path in a
      # *different* workflow, inherited here - silently overriding this step's
      # 5-minute budget and turning main red at 61s. A workflow-level value can
      # only ever be the smaller one, so this step re-states its own.
      #
      # PNPM_CONFIG_ is the variable that does the work: measured on pnpm
      # 11.27.0 and 12.3.4, neither reads `npm_config_*` from the environment
      # (`PNPM_CONFIG_REGISTRY` moves `pnpm config get registry`, `NPM_CONFIG_
      # REGISTRY` does not), and audit.sh runs `pnpm audit`. NPM_CONFIG_ is
      # kept beside it so an inherited workflow-level npm cap cannot reach an
      # npm/npx call made from this step either.
      - name: Audit
        if: ${{ inputs.audit }}
        timeout-minutes: 5
        # Advisory on a PR, blocking everywhere else: a dead advisory endpoint
        # must not hold up review, but it must still turn main red. Callers
        # that want the audit blocking on PRs too set audit-soft-on-pr: false.
        continue-on-error: ${{ inputs.audit-soft-on-pr && github.event_name == 'pull_request' }}
        env:
          AUDIT_LEVEL: ${{ inputs.audit-level }}
          PNPM_CONFIG_FETCH_TIMEOUT: '270000'
          NPM_CONFIG_FETCH_TIMEOUT: '270000'
        # deps:audit, not audit.sh: the template's script also runs its lockfile
        # provenance check, which likewise ran in no CI job.
        run: bash "$WORKFLOWS_DIR/scripts/checks/run-consumer-or.sh" 'deps:audit' scripts/checks/audit.sh
      # Cheap, and it ran in no CI job before this: `make check-deps` includes it
      # locally, so a green local gate implied a licence check CI never made.
      - name: Licenses
        if: ${{ inputs.licenses }}
        env:
          SCRIPT_NAME: 'deps:licenses'
        run: bash "$WORKFLOWS_DIR/scripts/checks/run-script.sh" "$SCRIPT_NAME"
      # The two expensive gates, both off by default. A prebuild of both
      # platforms and a web export are minutes each, so they are opt-in for the
      # consumers that decide the coverage is worth the wall clock - on main, on
      # a release, or behind a label - rather than a cost every PR pays.
  prebuild:
    name: Prebuild
    needs: contract
    if: ${{ !inputs.contract-only }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
      - name: Prebuild check
        if: ${{ inputs.prebuild-check }}
        timeout-minutes: 20
        env:
          SCRIPT_NAME: check-prebuild
        run: bash "$WORKFLOWS_DIR/scripts/checks/run-script.sh" "$SCRIPT_NAME"
  bundle-secrets:
    name: Secrets
    needs: contract
    if: ${{ !inputs.contract-only }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 25
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
      - name: Bundle secrets
        if: ${{ inputs.bundle-secrets }}
        timeout-minutes: 15
        env:
          SCRIPT_NAME: 'check:bundle-secrets'
        run: bash "$WORKFLOWS_DIR/scripts/checks/run-script.sh" "$SCRIPT_NAME"
      # Ruby is installed here rather than through the `setup` action's `ruby`
      # input so the 12 checks above never pay for a bundle install they do not
      # use; `bundler-cache: true` makes the repeat cost near zero.
  release:
    name: Release
    needs: contract
    if: ${{ !inputs.contract-only }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
      - name: Read pinned Ruby version
        id: rb
        if: ${{ inputs.release-checks }}
        run: bash "$WORKFLOWS_DIR/scripts/ci/ruby-version.sh"
      - name: Install Ruby
        if: ${{ inputs.release-checks }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ steps.rb.outputs.version }}
          bundler-cache: true
          working-directory: ${{ inputs.working-directory }}
      - name: Release checks
        if: ${{ inputs.release-checks }}
        env:
          SCRIPT_NAME: 'check:release'
        run: bash "$WORKFLOWS_DIR/scripts/checks/run-script.sh" "$SCRIPT_NAME"
      # WORKFLOWS_ACTIONLINT / WORKFLOWS_SHELLCHECK reach the fallback only. A consumer that
      # ships check:ci owns that decision itself, which is the point of the seam.
  tooling:
    name: Tooling
    needs: contract
    if: ${{ !inputs.contract-only }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
      - name: Lint CI (actionlint / shellcheck)
        if: ${{ inputs.actionlint || inputs.shellcheck }}
        env:
          WORKFLOWS_ACTIONLINT: ${{ inputs.actionlint }}
          WORKFLOWS_SHELLCHECK: ${{ inputs.shellcheck }}
        run: bash "$WORKFLOWS_DIR/scripts/checks/run-consumer-or.sh" 'check:ci' scripts/ci/lint-ci.sh
  commits:
    name: Commits
    needs: contract
    if: ${{ !inputs.contract-only && ( inputs.commitlint && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' ) }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 5
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
          # fetch-depth: 0 so PR_COMMITS_RANGE below (base sha..head sha) can
          # resolve both endpoints when commitlint-commits is enabled.
          fetch-depth: 0
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
      - name: Commitlint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_COMMITS_RANGE: ${{ inputs.commitlint-commits && format('{0}..{1}', github.event.pull_request.base.sha, github.sha) || '' }}
        run: bash "$WORKFLOWS_DIR/scripts/checks/commitlint.sh"
