name: Self rehearsal
# pr-release-notes.yml, executed for real against the template, in a dry run.
# Called from self-ci.yml on every change, which turns these into
# `Consumer rehearsal / Release PR notes / Store Notes` and
# `Consumer rehearsal / Section`, and from self-release.yml, whose major-tag
# job waits on it: `v0` never moves to a commit whose rehearsal failed.
#
# Every other reusable workflow runs only inside a consumer (or under act, on
# a laptop), so a mistake in one ships with every gate here green. This one
# can run from a pull request, because `dry-run` with `body-file` needs no
# release PR and edits nothing: the template keeps a release-please-shaped
# body at the path below for exactly this.
#
# The trade, taken on purpose: the rehearsal reads the template's main, so a
# broken generator there turns this repository's CI red until the template is
# fixed. That is the consumer every release here is first executed by, so it
# is also the failure a release here would otherwise ship into.
#
# Local path, not @v0, for the same reason as self-ci.yml: this has to run the
# ref under review. No secrets are passed: the template's generator drafts
# without an LLM when no key is set, and a fork's pull request has none.
on:
  workflow_call:
permissions: { contents: read }
jobs:
  notes:
    name: Release PR notes
    uses: ./.github/workflows/pr-release-notes.yml
    # What the called job declares, so the rehearsal fails exactly where an
    # under-granting consumer caller would. A dry run from a body file writes
    # nothing with it; on a fork's pull request the token is read-only anyway.
    permissions:
      contents: read
      pull-requests: write
    with:
      repository: blinkbitcoin/react-native-mobile-template
      ref: main
      dry-run: true
      body-file: scripts/release/fixtures/release-body.md
  section:
    name: Section
    needs: notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - env:
          SECTION: ${{ needs.notes.outputs.section }}
        run: bash scripts/self/check-rehearsal-section.sh
