# "Store", not "Fastlane Lane": a reader of a consumer's run graph sees
# "<caller job> / <this job>", e.g. "Upload iOS / Store", and should not need
# to know fastlane's word for a named task to read it. The file keeps its name
# because consumers pin it by path.
name: Publish store
on:
  workflow_call:
    inputs:
      repository:
        description: Consumer repository to check out (defaults to the caller's repository)
        type: string
        default: ''
      ref:
        description: Consumer ref to check out (empty lets actions/checkout resolve the correct ref, including PR merge refs)
        type: string
        default: ''
      working-directory:
        description: Consumer directory relative to GITHUB_WORKSPACE
        type: string
        default: '.'
      linux-runner:
        description: Runner label for the lane job, unless macos-enabled is true
        type: string
        default: 'ubuntu-latest'
      macos-runner:
        description: Runner label for the lane job when macos-enabled is true
        type: string
        default: 'macos-26'
      native-cache-version:
        description: Native cache key prefix (unused by this workflow; carried for input-set consistency across the family)
        type: string
        default: 'v1'
      platform:
        description: Fastlane platform (ios or android)
        type: string
        required: true
      lane:
        description: 'Lane name: ios build|verify|upload_internal|promote_beta|release_production|phased|upload_symbols, android build|verify|upload_internal|promote_beta|release_production|rollout|halt'
        type: string
        required: true
      lane-arguments:
        description: Space-separated fastlane key:value arguments appended to the lane invocation (e.g. 'percentage:0.1')
        type: string
        default: ''
      dry-run:
        description: >-
          Run the lane without touching a store. Threads DRY_RUN=1
          into the environment the lane runs in, which is the consumer's own
          mechanism (fastlane/lanes/shared.rb's store_action gate, wrapping
          every deliver/pilot/supply/AppGallery call) rather than a bespoke
          branch here - the dry run walks the exact same code path a real
          run does, resolving credentials, building the lane's arguments and
          validating metadata paths, and stops short of only the store call
          itself. Same name and meaning as the template's cd-store-listing.yml
          `dry_run` dispatch input, which already forwards its own flag here
          through `environment-variables`' DRY_RUN key; this input is OR'd with
          that one (see the Fastlane lane step) so neither can disarm the other.
        type: boolean
        default: false
      macos-enabled:
        description: Run the lane job on macos-runner rather than linux-runner (an iOS lane that touches Xcode needs macOS; a store-API-only lane does not)
        type: boolean
        default: false
      environment:
        description: GitHub Environment whose secrets/approvals gate this lane (empty means no environment)
        type: string
        default: ''
      environment-variables:
        description: >-
          Non-secret environment for the lane, as a flat JSON object (configuration
          only - secrets belong in `secrets:`). Keys may be lower-case here, because
          they reach a fastlane lane whose own option names are. Keys only are logged.
        type: string
        default: '{}'
      artifacts:
        description: Artifact name or glob pattern to download before the lane runs (empty downloads nothing); all matches are merged into one directory
        type: string
        default: ''
      release-assets:
        description: Glob pattern of assets to download from the `release-tag` release into the same directory as `artifacts` (empty downloads nothing) - for a lane whose binary is not in this run, like a store with no promote endpoint on a promotion stage
        type: string
        default: ''
      release-tag:
        description: The release `release-assets` are downloaded from (required when `release-assets` is set)
        type: string
        default: ''
      version:
        description: App version passed to the lane as APP_VERSION
        type: string
        required: true
      build-number:
        description: Build number passed to the lane as APP_BUILD_NUMBER
        type: string
        required: true
      ios-bundle-id:
        description: Bundle identifier passed to the lane as IOS_BUNDLE_ID (required on both platforms - see `android-package`)
        type: string
        required: true
      ios-scheme:
        description: Xcode scheme passed to the lane as IOS_SCHEME (required on both platforms - see `android-package`)
        type: string
        required: true
      android-package:
        description: Application id passed to the lane as ANDROID_PACKAGE. All five contract variables are required on every lane - the consumer's Fastfile asserts them in `before_all`, for both platforms, and rejects empty ones
        type: string
        required: true
      fastlane-directory:
        description: >-
          The directory holding the Fastfile and the store metadata, relative to
          working-directory. fastlane only finds a directory named fastlane or
          .fastlane, so it may move (mobile/fastlane) but not be renamed
        type: string
        default: 'fastlane'
      ruby-enabled:
        description: Install Ruby via ruby/setup-ruby (leave on unless the consumer has no Gemfile)
        type: boolean
        default: true
      timeout-minutes:
        description: Job timeout; raise it for a lane that waits on App Store Connect processing
        type: number
        default: 45
    secrets:
      consumer-token:
        description: PAT with read access to a private consumer repository; falls back to the caller's github.token (works for a public consumer)
        required: false
      MATCH_PASSWORD:
        description: Passphrase for the fastlane match certificate repository
        required: false
      MATCH_GIT_URL:
        description: Git URL of the fastlane match certificate repository
        required: false
      MATCH_GIT_BASIC_AUTHORIZATION:
        description: Base64 basic-auth token used to clone the match repository
        required: false
      ASC_KEY_ID:
        description: App Store Connect API key id
        required: false
      ASC_ISSUER_ID:
        description: App Store Connect API issuer id
        required: false
      ASC_KEY_P8_BASE64:
        description: Base64-encoded App Store Connect .p8 private key
        required: false
      ANDROID_UPLOAD_KEYSTORE_BASE64:
        description: Base64-encoded upload keystore
        required: false
      ANDROID_UPLOAD_KEYSTORE_PASSWORD:
        description: Password of the upload keystore
        required: false
      ANDROID_UPLOAD_KEY_ALIAS:
        description: Alias of the signing key inside the upload keystore
        required: false
      ANDROID_UPLOAD_KEY_PASSWORD:
        description: Password of the signing key inside the upload keystore
        required: false
      PLAY_SERVICE_ACCOUNT_JSON:
        description: Google Play service account JSON (raw)
        required: false
      # Huawei AppGallery Connect API client. Both halves are secrets: the
      # client id is one half of the credential pair, and environment-variables is printed.
      HUAWEI_CLIENT_ID:
        description: AppGallery Connect API client id
        required: false
      HUAWEI_CLIENT_SECRET:
        description: AppGallery Connect API client secret
        required: false
      # App Review contact and demo-account details. These are secrets, not
      # `environment-variables` configuration: those values are printed to the log, and a
      # reviewer demo login is a real credential.
      APP_REVIEW_EMAIL:
        description: App Review contact email
        required: false
      APP_REVIEW_FIRST_NAME:
        description: App Review contact first name
        required: false
      APP_REVIEW_LAST_NAME:
        description: App Review contact last name
        required: false
      APP_REVIEW_PHONE:
        description: App Review contact phone number
        required: false
      APP_REVIEW_DEMO_USER:
        description: Demo account username handed to App Review
        required: false
      APP_REVIEW_DEMO_PASSWORD:
        description: Demo account password handed to App Review
        required: false
      APP_REVIEW_NOTES:
        description: Free-text notes for the App Review team
        required: false
permissions:
  contents: read
jobs:
  lane:
    # Fixed on purpose: the caller's job already says which operation this is
    # ("Upload iOS", "Promote Android", "Halt Android"); repeating the lane id
    # here only put fastlane vocabulary in front of the reader.
    name: Store
    runs-on: ${{ inputs.macos-enabled && inputs.macos-runner || inputs.linux-runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment: ${{ inputs.environment }}
    env:
      WORKING_DIRECTORY: ${{ inputs.working-directory }}
      WORKFLOWS_FASTLANE_DIRECTORY: ${{ inputs.fastlane-directory }}
      APP_VERSION: ${{ inputs.version }}
      APP_BUILD_NUMBER: ${{ inputs.build-number }}
      IOS_BUNDLE_ID: ${{ inputs.ios-bundle-id }}
      IOS_SCHEME: ${{ inputs.ios-scheme }}
      ANDROID_PACKAGE: ${{ inputs.android-package }}
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      # Before anything is installed or built. All five are `required: true`
      # inputs, and that is weaker than it reads: a caller passes them as
      # `${{ vars.X }}`, an unset repository variable is the empty string, and
      # an empty string satisfies `required`. The consumer's Fastfile rejects
      # empty values in before_all - but only if it has that before_all, and
      # only after prebuild and pod install have already been paid for.
      - name: Check the lane inputs
        run: bash ".workflows/scripts/release/require-inputs.sh"
      - name: Publish WORKFLOWS_DIR environment
        run: bash ".workflows/scripts/release/env-publish.sh"
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          ruby-enabled: ${{ inputs.ruby-enabled }}
      - name: Download artifacts
        if: ${{ inputs.artifacts != '' }}
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.artifacts }}
          # One flat directory: a lane is given file paths, not artifact names,
          # and merge-multiple keeps `$WORKFLOWS_ASSETS_DIR/app.ipa` stable no matter
          # which artifact carried it.
          merge-multiple: true
          path: ${{ env.WORKFLOWS_ASSETS_DIR }}
      # A lane whose binary is not in this run: a promotion stage builds nothing,
      # and download-artifact only sees the current run's artifacts. A store
      # with no promote endpoint re-uploads the bundle the release carries,
      # into the same directory, so the lane finds it the same way.
      - name: Download release assets
        if: ${{ inputs.release-assets != '' }}
        env:
          GH_TOKEN: ${{ secrets.consumer-token || github.token }}
          GH_REPO: ${{ inputs.repository || github.repository }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          RELEASE_ASSETS: ${{ inputs.release-assets }}
        run: bash "$WORKFLOWS_DIR/scripts/release/release-assets-fetch.sh" "$RELEASE_TAG" "$RELEASE_ASSETS" "$WORKFLOWS_ASSETS_DIR"
      - name: Publish environment-variables
        env:
          WORKFLOWS_ENV_JSON: ${{ inputs.environment-variables }}
        run: bash "$WORKFLOWS_DIR/scripts/release/env-json.sh"
      - name: Decode secrets
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: bash "$WORKFLOWS_DIR/scripts/release/decode-secrets.sh"
      - name: Fastlane lane
        env:
          PLATFORM: ${{ inputs.platform }}
          LANE: ${{ inputs.lane }}
          LANE_ARGS: ${{ inputs.lane-arguments }}
          # OR'd with whatever environment-variables already put in $GITHUB_ENV, never
          # replacing it: a step's own `env:` wins over an inherited
          # $GITHUB_ENV value of the same name, so writing this input's value
          # alone would silently override - and could disarm - a caller like
          # the template's cd-store-listing.yml, which forwards its own
          # dry_run dispatch input (default true) through environment-variables' DRY_RUN
          # key rather than through this input.
          DRY_RUN: ${{ (inputs.dry-run || env.DRY_RUN == '1') && '1' || '0' }}
          # The lanes read their binaries out of WORKFLOWS_OUTPUT_DIR, but this
          # workflow does not build anything: the .ipa/.aab it operates on were
          # downloaded into WORKFLOWS_ASSETS_DIR by the step above. Pointing
          # WORKFLOWS_OUTPUT_DIR at that directory is what makes `upload_internal`,
          # `promote_beta` and `release_production` find them here - without it
          # a lane looks in an empty $WORKFLOWS_OUT and reports "no binary".
          WORKFLOWS_OUTPUT_DIR: ${{ env.WORKFLOWS_ASSETS_DIR }}
          BUILD_INFO_FILE: ${{ env.WORKFLOWS_ASSETS_DIR }}/build-info.json
          STORE_NOTES_FILE: ${{ env.WORKFLOWS_ASSETS_DIR }}/store-notes.txt
          STORE_NOTES_JSON: ${{ env.WORKFLOWS_ASSETS_DIR }}/store-notes.json
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          # The lanes read the base64 key directly (app_store_connect_api_key's
          # key_content + is_key_content_base64), so passing only the decoded
          # file path is not enough - the Fastfile's ENV.fetch would raise.
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          HUAWEI_CLIENT_ID: ${{ secrets.HUAWEI_CLIENT_ID }}
          HUAWEI_CLIENT_SECRET: ${{ secrets.HUAWEI_CLIENT_SECRET }}
          APP_REVIEW_EMAIL: ${{ secrets.APP_REVIEW_EMAIL }}
          APP_REVIEW_FIRST_NAME: ${{ secrets.APP_REVIEW_FIRST_NAME }}
          APP_REVIEW_LAST_NAME: ${{ secrets.APP_REVIEW_LAST_NAME }}
          APP_REVIEW_PHONE: ${{ secrets.APP_REVIEW_PHONE }}
          APP_REVIEW_DEMO_USER: ${{ secrets.APP_REVIEW_DEMO_USER }}
          APP_REVIEW_DEMO_PASSWORD: ${{ secrets.APP_REVIEW_DEMO_PASSWORD }}
          APP_REVIEW_NOTES: ${{ secrets.APP_REVIEW_NOTES }}
        # LANE_ARGS reaches fastlane.sh through the environment, not as an
        # unquoted expansion here: the script splits it into arguments itself.
        run: bash "$WORKFLOWS_DIR/scripts/release/fastlane.sh" "$PLATFORM" "$LANE"
