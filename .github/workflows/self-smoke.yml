name: Smoke
on:
  workflow_dispatch:
    inputs:
      repository:
        description: Consumer repository to exercise
        type: string
        default: 'blinkbitcoin/react-native-mobile-template'
      ref:
        description: Consumer ref to exercise
        type: string
        default: 'main'
      ios:
        description: Also run the iOS E2E suite (10x billing)
        type: boolean
        default: false
      android:
        description: Run the Android E2E suite
        type: boolean
        default: true
      contract-only:
        description: Only check the target's contract, then stop (seconds, no runners spent on gates)
        type: boolean
        default: false
  schedule:
    # Weekly, Monday 06:17 UTC. Odd minute to avoid the top-of-hour GitHub
    # Actions cron stampede.
    - cron: '17 6 * * 1'
# `secrets: inherit` is deliberately absent: the default consumer is public,
# so the checks/unit/e2e workflows fall back to `github.token` for their
# consumer checkouts. If the smoke target ever becomes a private repository,
# add a repo secret `SMOKE_TOKEN` (a PAT with read access to that repository)
# and pass it below as `secrets: { consumer-token: ${{ secrets.SMOKE_TOKEN }} }`
# on each `uses:` call -- that secret is what the reusable workflows' optional
# `consumer-token` input exists for (see docs/consumer-guide.md).
concurrency:
  group: self-smoke
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml
    with:
      repository: ${{ inputs.repository || 'blinkbitcoin/react-native-mobile-template' }}
      ref: ${{ inputs.ref || 'main' }}
      # `github.event_name ==` rather than `inputs.contract-only` alone: on the
      # schedule trigger there is no inputs context, and the cron run must be
      # the full suite. Same reasoning as the e2e toggles below.
      contract-only: ${{ github.event_name == 'workflow_dispatch' && inputs.contract-only }}
  unit:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.contract-only }}
    name: Unit
    uses: ./.github/workflows/unit.yml
    with:
      repository: ${{ inputs.repository || 'blinkbitcoin/react-native-mobile-template' }}
      ref: ${{ inputs.ref || 'main' }}
  e2e:
    name: E2E
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.contract-only }}
    uses: ./.github/workflows/e2e.yml
    with:
      repository: ${{ inputs.repository || 'blinkbitcoin/react-native-mobile-template' }}
      ref: ${{ inputs.ref || 'main' }}
      # On the `schedule` trigger there is no `inputs` context at all, so
      # `inputs.ios`/`inputs.android` are null and *both* `null == true` and
      # `null != false` evaluate to false - the cron run would call e2e.yml with
      # both platforms off and report success without running a single flow.
      # Branch on the event instead: a scheduled run takes the dispatch defaults
      # (Android on, iOS off), a dispatch takes what the user picked.
      ios: ${{ github.event_name == 'workflow_dispatch' && inputs.ios }}
      android: ${{ github.event_name != 'workflow_dispatch' || inputs.android }}
      dev-client: true
      # A mock GraphQL API the app talks to in dev/E2E. The template ships
      # both hooks at these paths; a smoke target that does not must leave
      # these two inputs empty (a non-empty but missing path is fatal).
      e2e-setup-script: scripts/e2e/ci-mock-api-up.sh
      e2e-teardown-script: scripts/e2e/ci-mock-api-down.sh
