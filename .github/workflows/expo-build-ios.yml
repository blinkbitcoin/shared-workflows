name: Build iOS
on:
  workflow_call:
    inputs:
      repository:
        description: Consumer repository to check out (defaults to the caller's repository)
        type: string
        default: ''
      ref:
        description: Consumer ref to check out (empty lets actions/checkout resolve the correct ref, including PR merge refs)
        type: string
        default: ''
      working-directory:
        description: Consumer directory relative to GITHUB_WORKSPACE
        type: string
        default: '.'
      linux-runner:
        description: Runner label for Linux jobs (unused by this workflow; carried for input-set consistency across the family)
        type: string
        default: 'ubuntu-latest'
      macos-runner:
        description: Runner label for the build job
        type: string
        default: 'macos-26'
      native-cache-version:
        description: Native cache key prefix; bump to invalidate every native cache at once
        type: string
        default: 'v1'
      native-extra-globs:
        description: Extra space-separated consumer-relative shell globs whose file contents are folded into the native dependency hash
        type: string
        default: ''
      xcode:
        description: Xcode version to build with (empty uses the runner default); sets DEVELOPER_DIR and is folded into the Pods cache key
        type: string
        default: ''
      environment:
        description: GitHub Environment whose secrets/approvals gate this build (empty means no environment)
        type: string
        default: ''
      version:
        description: App version to stamp into the build (wire it to expo-prepare's `version` output)
        type: string
        required: true
      build-number:
        description: Build number to stamp into the build (wire it to expo-prepare's `build-number` output)
        type: string
        required: true
      stage:
        description: Release stage the lanes build for (internal/beta/production)
        type: string
        default: 'internal'
      ios-bundle-id:
        description: Bundle identifier passed to the lanes as IOS_BUNDLE_ID
        type: string
        required: true
      ios-scheme:
        description: Xcode scheme passed to the lanes as IOS_SCHEME
        type: string
        required: true
      android-package:
        description: Application id passed to the lanes as ANDROID_PACKAGE. Required even on the iOS build - the consumer's Fastfile asserts all five contract variables in `before_all`, for every lane on both platforms
        type: string
        required: true
      ios-signing:
        description: >-
          Sign the build and export an .ipa. Off produces an unsigned archive
          instead, which still compiles, still runs the verify gate and needs no
          Apple account at all - the tier a repository sits in before its
          certificates exist. Off also produces no .ipa, so nothing can be
          uploaded to a store.
        type: boolean
        default: true
      verify:
        description: Run the `ios verify` lane after `ios build`
        type: boolean
        default: true
      release-meta-artifact:
        description: Artifact produced by expo-prepare that carries build-info.json and the store notes
        type: string
        default: 'release-meta'
      ipa-artifact:
        description: Artifact name for the signed .ipa
        type: string
        default: 'ios-ipa'
      dsym-artifact:
        description: Artifact name for the dSYM bundle
        type: string
        default: 'ios-dsym'
      build-env:
        description: 'Flat JSON object of non-secret build environment variables published before prebuild, the lanes and the scripts (e.g. {"OTA_ENABLED":"true","EXPO_UPDATES_URL":"https://..."}). Keys must be UPPER_SNAKE and anything that reads as a credential is refused - this is a workflow input, so GitHub neither masks nor hides it'
        type: string
        default: '{}'
    secrets:
      consumer-token:
        description: PAT with read access to a private consumer repository; falls back to the caller's github.token (works for a public consumer)
        required: false
      MATCH_PASSWORD:
        description: Passphrase for the fastlane match certificate repository
        required: false
      MATCH_GIT_URL:
        description: Git URL of the fastlane match certificate repository
        required: false
      MATCH_GIT_BASIC_AUTHORIZATION:
        description: Base64 basic-auth token used to clone the match repository
        required: false
      ASC_KEY_ID:
        description: App Store Connect API key id
        required: false
      ASC_ISSUER_ID:
        description: App Store Connect API issuer id
        required: false
      ASC_KEY_P8_BASE64:
        description: Base64-encoded App Store Connect .p8 private key (decoded to a 0600 file by decode-secrets.sh)
        required: false
permissions:
  contents: read
jobs:
  build:
    name: Build
    runs-on: ${{ inputs.macos-runner }}
    timeout-minutes: 90
    environment: ${{ inputs.environment }}
    env:
      WORKING_DIRECTORY: ${{ inputs.working-directory }}
      WORKFLOWS_XCODE: ${{ inputs.xcode }}
      WORKFLOWS_STAGE: ${{ inputs.stage }}
      APP_VERSION: ${{ inputs.version }}
      APP_BUILD_NUMBER: ${{ inputs.build-number }}
      IOS_BUNDLE_ID: ${{ inputs.ios-bundle-id }}
      IOS_SCHEME: ${{ inputs.ios-scheme }}
      # ANDROID_PACKAGE on the iOS build is not a copy/paste slip: the
      # consumer's Fastfile runs require_env! over all five variables in
      # before_all, for every lane on both platforms, and rejects empty ones.
      ANDROID_PACKAGE: ${{ inputs.android-package }}
      # The non-empty value sits in the `&&` slot on purpose: GitHub's `&&`
      # yields its first falsy operand, so `cond && '' || X` would return X on
      # both branches and pin every build to one Xcode.
      DEVELOPER_DIR: ${{ inputs.xcode && format('/Applications/Xcode_{0}.app/Contents/Developer', inputs.xcode) || '' }}
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      # Before anything is installed or built. All five are `required: true`
      # inputs, and that is weaker than it reads: a caller passes them as
      # `${{ vars.X }}`, an unset repository variable is the empty string, and
      # an empty string satisfies `required`. The consumer's Fastfile rejects
      # empty values in before_all - but only if it has that before_all, and
      # only after prebuild and pod install have already been paid for.
      - name: Check the lane inputs
        run: bash ".workflows/scripts/release/require-inputs.sh"
      - name: Publish WORKFLOWS_DIR environment
        run: bash ".workflows/scripts/release/env-publish.sh"
      - name: Native cache keys
        id: keys
        uses: ./.workflows/.github/actions/native-key
        with:
          working-directory: ${{ inputs.working-directory }}
          native-cache-version: ${{ inputs.native-cache-version }}
          native-extra-globs: ${{ inputs.native-extra-globs }}
          xcode: ${{ inputs.xcode }}
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          # Ruby unconditionally here (unlike e2e.yml, which installs it only on
          # a cache miss): fastlane is the whole point of this job.
          ruby: 'true'
      - name: Decode secrets
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: bash "$WORKFLOWS_DIR/scripts/release/decode-secrets.sh"
      - name: Publish build-env
        env:
          WORKFLOWS_BUILD_ENV: ${{ inputs.build-env }}
        run: bash "$WORKFLOWS_DIR/scripts/release/build-env.sh"
      - name: Prebuild (ios)
        run: bash "$WORKFLOWS_DIR/scripts/native/prebuild.sh" ios
      - name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: |
            ${{ inputs.working-directory }}/ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ steps.keys.outputs.pods-key }}
          restore-keys: |
            pods-${{ runner.os }}-
      - name: Pod install
        run: bash "$WORKFLOWS_DIR/scripts/native/pods.sh"
      - name: Download release-meta
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.release-meta-artifact }}
          path: ${{ env.WORKFLOWS_RELEASE_META_DIR }}
      - name: Fastlane ios build
        env:
          BUILD_INFO_FILE: ${{ env.WORKFLOWS_RELEASE_META_DIR }}/build-info.json
          RELEASE_NOTES_STORE_FILE: ${{ env.WORKFLOWS_RELEASE_META_DIR }}/notes-store.txt
          STORE_NOTES_JSON: ${{ env.WORKFLOWS_RELEASE_META_DIR }}/store-notes.json
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          # The lanes read the base64 key directly (app_store_connect_api_key's
          # key_content + is_key_content_base64), so passing only the decoded
          # file path is not enough - the Fastfile's ENV.fetch would raise.
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          # Non-empty value in the `&&` slot: GitHub's `&&` yields its first
          # falsy operand, so `cond && '' || X` would be X on both branches.
          # fastlane.sh appends $LANE_ARGS to the lane arguments.
          LANE_ARGS: ${{ !inputs.ios-signing && 'skip_signing:true' || '' }}
        run: bash "$WORKFLOWS_DIR/scripts/release/fastlane.sh" ios build
      - name: Fastlane ios verify
        if: ${{ inputs.verify }}
        env:
          BUILD_INFO_FILE: ${{ env.WORKFLOWS_RELEASE_META_DIR }}/build-info.json
          RELEASE_NOTES_STORE_FILE: ${{ env.WORKFLOWS_RELEASE_META_DIR }}/notes-store.txt
          STORE_NOTES_JSON: ${{ env.WORKFLOWS_RELEASE_META_DIR }}/store-notes.json
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          # Non-empty value in the `&&` slot: GitHub's `&&` yields its first
          # falsy operand, so `cond && '' || X` would be X on both branches.
          # fastlane.sh appends $LANE_ARGS to the lane arguments.
          LANE_ARGS: ${{ !inputs.ios-signing && 'skip_signing:true' || '' }}
        run: bash "$WORKFLOWS_DIR/scripts/release/fastlane.sh" ios verify
      - name: Upload ios-ipa
        # `!cancelled()`, like the Android apk and mapping uploads: a failed
        # `verify` is exactly when a human needs the .ipa to reproduce it, and
        # without this the artifact dies with the runner.
        #
        # Gated on ios-signing as well: an unsigned build packages no .ipa, and
        # this step's `if-no-files-found: error` would turn that into a red step
        # on a run that did exactly what it was asked to.
        if: ${{ !cancelled() && inputs.ios-signing }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.ipa-artifact }}
          path: ${{ env.WORKFLOWS_OUTPUT_DIR }}/*.ipa
          # An .ipa is already a zip; re-compressing it costs minutes and saves
          # nothing.
          compression-level: 0
          retention-days: 30
          overwrite: true
          if-no-files-found: error
      - name: Upload ios-dsym
        # `!cancelled()`: symbols are what makes a failed build's crash reports
        # readable, so they upload even when verify failed.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.dsym-artifact }}
          path: ${{ env.WORKFLOWS_OUTPUT_DIR }}/*.dSYM.zip
          retention-days: 30
          overwrite: true
          if-no-files-found: warn
