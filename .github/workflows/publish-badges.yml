name: Badges
# Publishes a consumer's per-branch CI badges to its own `gh-pages` branch:
# `badges/<branch>/{unit,e2e,coverage}.svg`. The README embeds main's the way a
# workflow-status badge takes `?branch=main`, and every other branch gets its
# own set.
#
# The split follows the family's existing seam. SVG rendering needs a
# package.json and a test harness, which the consumer has and this repo does
# not, so the consumer owns rendering behind one named script (`render-script`,
# reached through scripts/checks/run-script.sh exactly like typecheck and lint)
# and this repo owns publishing (scripts/ci/publish-badges.sh). A closed PR's
# directory is dropped by pr-closed.yml.
on:
  workflow_call:
    inputs:
      repository:
        description: Consumer repository to check out (defaults to the caller's repository)
        type: string
        default: ''
      ref:
        description: Consumer ref to check out (empty lets actions/checkout resolve the correct ref, including PR merge refs)
        type: string
        default: ''
      working-directory:
        description: Consumer directory relative to GITHUB_WORKSPACE
        type: string
        default: '.'
      linux-runner:
        description: Runner label for this job
        type: string
        default: 'ubuntu-latest'
      macos-runner:
        description: Runner label for macOS jobs (unused by this workflow; carried for input-set consistency across the family)
        type: string
        default: 'macos-26'
      native-cache-version:
        description: Native cache key prefix (unused by this workflow; carried for input-set consistency across the family)
        type: string
        default: 'v1'
      unit-result:
        description: Result of the caller's unit job (needs.unit.result)
        type: string
        required: true
      e2e-result:
        description: Result of the caller's e2e job (needs.e2e.result)
        type: string
        required: true
      docs-only:
        description: check-code.yml's docs-only output; 'true' skips this job, because the jobs the badges describe never ran
        type: string
        default: 'false'
      unit-label:
        description: Label on the unit badge
        type: string
        default: 'Unit'
      e2e-label:
        description: Label on the e2e badge
        type: string
        default: 'E2E'
      coverage-artifact:
        description: Artifact holding the consumer's coverage/ directory (check-unit.yml uploads it as `coverage`); downloaded only when the unit job succeeded
        type: string
        default: 'coverage'
      render-script:
        description: Consumer package.json script that renders the badges into badge-dir
        type: string
        default: 'badges:render'
      badge-dir:
        description: Consumer-relative directory the render script writes, and the one publish-badges.sh copies to gh-pages
        type: string
        default: 'coverage/badge'
    secrets:
      consumer-token:
        description: PAT with read access to a private consumer repository; falls back to the caller's github.token (works for a public consumer)
        required: false
permissions:
  contents: read
jobs:
  badges:
    name: Publish
    # The caller runs this job under always() so a red Unit still gets a red
    # badge. These are the cases where publishing would be wrong or impossible,
    # re-asserted here so a caller that forgets one still cannot do damage: a
    # cancelled upstream job tells us nothing about the branch, a docs-only
    # change never ran the jobs the badges describe, and nor did a change that
    # both suites skipped, a release is not a branch, and a fork PR's token
    # cannot push to gh-pages.
    if: >-
      inputs.unit-result != 'cancelled' &&
      inputs.e2e-result != 'cancelled' &&
      inputs.docs-only != 'true' &&
      !(inputs.unit-result == 'skipped' && inputs.e2e-result == 'skipped') &&
      github.event_name != 'release' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 10
    permissions:
      # The one job in this family that writes: publish-badges.sh pushes the
      # gh-pages branch. Nothing else here needs it, which is why it is declared
      # on the job and not at the top of the file.
      contents: write
    steps:
      # persist-credentials is left at its default (true) on purpose: this is
      # the checkout whose `origin` the push below goes through.
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
      # Only when Unit succeeded: a failed Unit may have uploaded a partial
      # coverage/ (the upload is `if: always()`), and the render script writes
      # the red placeholder for that case without reading a summary at all.
      - name: Download coverage
        if: ${{ inputs.unit-result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.coverage-artifact }}
          path: ${{ inputs.working-directory }}/coverage
      - name: Render badges
        env:
          SCRIPT_NAME: ${{ inputs.render-script }}
          BADGE_OUT_DIR: ${{ inputs.badge-dir }}
          BADGE_UNIT: ${{ inputs.unit-result }}
          BADGE_E2E: ${{ inputs.e2e-result }}
          BADGE_UNIT_LABEL: ${{ inputs.unit-label }}
          BADGE_E2E_LABEL: ${{ inputs.e2e-label }}
        run: bash "$WORKFLOWS_DIR/scripts/checks/run-script.sh" "$SCRIPT_NAME"
      - name: Publish to gh-pages
        env:
          # head_ref on a PR (the branch the badge is *for*), ref_name on a push.
          BRANCH: ${{ github.head_ref || github.ref_name }}
          SHA: ${{ github.sha }}
          BADGE_DIR: ${{ inputs.badge-dir }}
          # A skipped suite's status badge is not published (see the script).
          BADGE_UNIT: ${{ inputs.unit-result }}
          BADGE_E2E: ${{ inputs.e2e-result }}
        run: bash "$WORKFLOWS_DIR/scripts/ci/publish-badges.sh"
