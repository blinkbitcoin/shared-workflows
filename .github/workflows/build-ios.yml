name: Build iOS
on:
  workflow_call:
    inputs:
      repository:
        description: Consumer repository to check out (defaults to the caller's repository)
        type: string
        default: ''
      ref:
        description: Consumer ref to check out (empty lets actions/checkout resolve the correct ref, including PR merge refs)
        type: string
        default: ''
      working-directory:
        description: Consumer directory relative to GITHUB_WORKSPACE
        type: string
        default: '.'
      linux-runner:
        description: Runner label for Linux jobs (unused by this workflow; carried for input-set consistency across the family)
        type: string
        default: 'ubuntu-latest'
      macos-runner:
        description: Runner label for the build job
        type: string
        default: 'macos-26'
      native-cache-version:
        description: Native cache key prefix; bump to invalidate every native cache at once
        type: string
        default: 'v1'
      native-stack:
        description: >-
          The app's native stack: expo (ios/ and android/ are expo prebuild
          output) or bare (ios/ and android/ are committed source). Empty, the
          default, detects it: expo when package.json depends on expo and git
          does not track ios/, bare otherwise
        type: string
        default: ''
      native-extra-globs:
        description: Extra space-separated consumer-relative shell globs whose file contents are folded into the native dependency hash
        type: string
        default: ''
      xcode-version:
        description: Xcode version to build with (empty uses the runner default); sets DEVELOPER_DIR and is folded into the Pods cache key
        type: string
        default: ''
      environment:
        description: GitHub Environment whose secrets/approvals gate this build (empty means no environment)
        type: string
        default: ''
      version:
        description: App version to stamp into the build (wire it to build-prepare's `version` output)
        type: string
        required: true
      build-number:
        description: Build number to stamp into the build (wire it to build-prepare's `build-number` output)
        type: string
        required: true
      stage:
        description: Release stage the lanes build for (internal/beta/production)
        type: string
        default: 'internal'
      ios-bundle-id:
        description: Bundle identifier passed to the lanes as IOS_BUNDLE_ID
        type: string
        required: true
      ios-scheme:
        description: Xcode scheme passed to the lanes as IOS_SCHEME
        type: string
        required: true
      android-package:
        description: Application id passed to the lanes as ANDROID_PACKAGE. Required even on the iOS build - the consumer's Fastfile asserts all five contract variables in `before_all`, for every lane on both platforms
        type: string
        required: true
      ios-signing-enabled:
        description: >-
          Sign the build and export an .ipa. Off produces an unsigned archive
          instead, which still compiles, still runs the verify gate and needs no
          Apple account at all - the state a repository is in before its
          certificates exist. Off also produces no .ipa, so nothing can be
          uploaded to a store.
        type: boolean
        default: true
      verify:
        description: Run the `ios verify` lane after `ios build`
        type: boolean
        default: true
      build-info-artifact:
        description: Artifact produced by build-prepare that carries build-info.json and the store notes
        type: string
        default: 'build-info'
      ipa-artifact:
        description: Artifact name for the signed .ipa
        type: string
        default: 'ios-ipa'
      dsym-artifact:
        description: Artifact name for the dSYM bundle
        type: string
        default: 'ios-dsym'
      fastlane-directory:
        description: >-
          The directory holding the Fastfile and the store metadata, relative to
          working-directory. fastlane only finds a directory named fastlane or
          .fastlane, so it may move (mobile/fastlane) but not be renamed
        type: string
        default: 'fastlane'
      environment-variables:
        description: 'Flat JSON object of non-secret build environment variables published before prebuild, the lanes and the scripts (e.g. {"OTA_ENABLED":"true","EXPO_UPDATES_URL":"https://..."}). Keys must be UPPER_SNAKE and anything that reads as a credential is refused - this is a workflow input, so GitHub neither masks nor hides it'
        type: string
        default: '{}'
    secrets:
      consumer-token:
        description: PAT with read access to a private consumer repository; falls back to the caller's github.token (works for a public consumer)
        required: false
      MATCH_PASSWORD:
        description: Passphrase for the fastlane match certificate repository
        required: false
      MATCH_GIT_URL:
        description: Git URL of the fastlane match certificate repository
        required: false
      MATCH_GIT_BASIC_AUTHORIZATION:
        description: Base64 basic-auth token used to clone the match repository
        required: false
      ASC_KEY_ID:
        description: App Store Connect API key id
        required: false
      ASC_ISSUER_ID:
        description: App Store Connect API issuer id
        required: false
      ASC_KEY_P8_BASE64:
        description: Base64-encoded App Store Connect .p8 private key (decoded to a 0600 file by decode-secrets.sh)
        required: false
permissions:
  contents: read
jobs:
  build:
    name: Build
    runs-on: ${{ inputs.macos-runner }}
    timeout-minutes: 90
    environment: ${{ inputs.environment }}
    env:
      WORKING_DIRECTORY: ${{ inputs.working-directory }}
      WORKFLOWS_NATIVE_STACK_INPUT: ${{ inputs.native-stack }}
      WORKFLOWS_FASTLANE_DIRECTORY: ${{ inputs.fastlane-directory }}
      WORKFLOWS_XCODE: ${{ inputs.xcode-version }}
      WORKFLOWS_STAGE: ${{ inputs.stage }}
      APP_VERSION: ${{ inputs.version }}
      APP_BUILD_NUMBER: ${{ inputs.build-number }}
      IOS_BUNDLE_ID: ${{ inputs.ios-bundle-id }}
      IOS_SCHEME: ${{ inputs.ios-scheme }}
      # ANDROID_PACKAGE on the iOS build is not a copy/paste slip: the
      # consumer's Fastfile runs require_env! over all five variables in
      # before_all, for every lane on both platforms, and rejects empty ones.
      ANDROID_PACKAGE: ${{ inputs.android-package }}
      # The non-empty value sits in the `&&` slot on purpose: GitHub's `&&`
      # yields its first falsy operand, so `cond && '' || X` would return X on
      # both branches and pin every build to one Xcode.
      DEVELOPER_DIR: ${{ inputs.xcode-version && format('/Applications/Xcode_{0}.app/Contents/Developer', inputs.xcode-version) || '' }}
    steps:
      - name: Checkout consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
          # Nothing in this job talks to the consumer's remote again: the lanes
          # read and upload, match clones its own repository with
          # MATCH_GIT_BASIC_AUTHORIZATION, and the release assets come through
          # gh with GH_TOKEN. So the token is not left where git in this checkout
          # finds it, for the signing steps or anything they run to read.
          persist-credentials: false
      - name: Checkout shared-workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      # Before anything is installed or built. All five are `required: true`
      # inputs, and that is weaker than it reads: a caller passes them as
      # `${{ vars.X }}`, an unset repository variable is the empty string, and
      # an empty string satisfies `required`. The consumer's Fastfile rejects
      # empty values in before_all - but only if it has that before_all, and
      # only after prebuild and pod install have already been paid for.
      - name: Check the lane inputs
        run: bash ".workflows/scripts/release/require-inputs.sh"
      - name: Publish the release output directories
        run: bash ".workflows/scripts/release/env-publish.sh"
      # As soon as its path exists, before Setup: a wrong or missing
      # build-info-artifact fails here in seconds instead of after Setup,
      # prebuild and pod install have spent minutes of macOS time. Nothing in
      # between touches $WORKFLOWS_RELEASE_META_DIR, which lives under
      # $RUNNER_TEMP, outside the checkout.
      - name: Download build-info
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.build-info-artifact }}
          path: ${{ env.WORKFLOWS_RELEASE_META_DIR }}
      - name: Native cache keys
        id: keys
        uses: ./.workflows/.github/actions/native-key
        with:
          working-directory: ${{ inputs.working-directory }}
          native-cache-version: ${{ inputs.native-cache-version }}
          native-extra-globs: ${{ inputs.native-extra-globs }}
          xcode-version: ${{ inputs.xcode-version }}
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          # Ruby unconditionally here (unlike test-e2e.yml, which installs it only on
          # a cache miss): fastlane is the whole point of this job.
          ruby-enabled: 'true'
      - name: Decode secrets
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: bash "$WORKFLOWS_DIR/scripts/release/decode-secrets.sh"
      - name: Publish environment-variables
        env:
          WORKFLOWS_BUILD_ENV: ${{ inputs.environment-variables }}
        run: bash "$WORKFLOWS_DIR/scripts/release/build-env.sh"
      - name: Prebuild (ios)
        run: bash "$WORKFLOWS_DIR/scripts/native/prebuild.sh" ios
      - name: Cache CocoaPods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ inputs.working-directory }}/ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ steps.keys.outputs.pods-key }}
          restore-keys: |
            ${{ steps.keys.outputs.pods-restore-key }}
      # Pod install and the two lanes are the steps that hang (a pod resolve, an
      # Xcode archive, a lane stuck on match or a tool), so each has a bound of
      # its own: a hang fails at about twice that step's slowest normal run,
      # with the step's name in the log, instead of burning the job's 90 macOS
      # minutes. Measured over the template's 41 internal builds of 2026-09-24
      # to 2026-10-03. The three add up to 60, and everything else in the job
      # took 5 minutes at most there, so each bound can fire inside the 90.
      #
      # Pod install: 23-85s, median 41s, and the 85s was a run with no
      # CocoaPods cache at all. pods.sh retries three times 20s apart, so a cold
      # run that needs every attempt is about 5 minutes. Twice that is 10.
      - name: Pod install
        timeout-minutes: 10
        run: bash "$WORKFLOWS_DIR/scripts/native/pods.sh"
      # 7-18 minutes, median 11 (unsigned: the template builds without a store
      # account). Signing adds a match clone and the .ipa export, a minute or
      # two. Twice the slowest run is 37; 40.
      - name: Fastlane ios build
        timeout-minutes: 40
        env:
          BUILD_INFO_FILE: ${{ env.WORKFLOWS_RELEASE_META_DIR }}/build-info.json
          STORE_NOTES_FILE: ${{ env.WORKFLOWS_RELEASE_META_DIR }}/store-notes.txt
          STORE_NOTES_JSON: ${{ env.WORKFLOWS_RELEASE_META_DIR }}/store-notes.json
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          # The lanes read the base64 key directly (app_store_connect_api_key's
          # key_content + is_key_content_base64), so passing only the decoded
          # file path is not enough - the Fastfile's ENV.fetch would raise.
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          # Non-empty value in the `&&` slot: GitHub's `&&` yields its first
          # falsy operand, so `cond && '' || X` would be X on both branches.
          # fastlane.sh appends $LANE_ARGS to the lane arguments.
          LANE_ARGS: ${{ !inputs.ios-signing-enabled && 'skip_signing:true' || '' }}
        run: bash "$WORKFLOWS_DIR/scripts/release/fastlane.sh" ios build
      # Between build and verify, as in build-android.yml: the digest describes
      # the .ipa the lane just produced (an unsigned build packages none, which
      # is recorded as absent). The enriched copy travels with the .ipa as
      # build-info.ios.json, and publish-github-release.yml folds its
      # `artifacts` back into the release's build-info.json.
      - name: Record artifact hashes
        env:
          BUILD_INFO_FILE: ${{ env.WORKFLOWS_RELEASE_META_DIR }}/build-info.json
        run: bash "$WORKFLOWS_DIR/scripts/release/artifact-hashes.sh" ios
      # 4-12s unsigned; a signed .ipa adds an unzip and a codesign check, both
      # local. 10, the bound test-e2e.yml gives its short steps.
      - name: Fastlane ios verify
        if: ${{ inputs.verify }}
        timeout-minutes: 10
        env:
          BUILD_INFO_FILE: ${{ env.WORKFLOWS_RELEASE_META_DIR }}/build-info.json
          STORE_NOTES_FILE: ${{ env.WORKFLOWS_RELEASE_META_DIR }}/store-notes.txt
          STORE_NOTES_JSON: ${{ env.WORKFLOWS_RELEASE_META_DIR }}/store-notes.json
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          # Non-empty value in the `&&` slot: GitHub's `&&` yields its first
          # falsy operand, so `cond && '' || X` would be X on both branches.
          # fastlane.sh appends $LANE_ARGS to the lane arguments.
          LANE_ARGS: ${{ !inputs.ios-signing-enabled && 'skip_signing:true' || '' }}
        run: bash "$WORKFLOWS_DIR/scripts/release/fastlane.sh" ios verify
      - name: Upload ios-ipa
        # `!cancelled()`, like the Android apk and mapping uploads: a failed
        # `verify` is exactly when a human needs the .ipa to reproduce it, and
        # without this the artifact dies with the runner.
        #
        # Gated on ios-signing-enabled as well: an unsigned build packages no .ipa, and
        # this step's `if-no-files-found: error` would turn that into a red step
        # on a run that did exactly what it was asked to.
        if: ${{ !cancelled() && inputs.ios-signing-enabled }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.ipa-artifact }}
          # build-info.ios.json under its platform name for the reason the
          # Android aab upload gives: two artifacts carrying build-info.json
          # would make the release's record depend on download order.
          path: |
            ${{ env.WORKFLOWS_OUTPUT_DIR }}/*.ipa
            ${{ env.WORKFLOWS_OUTPUT_DIR }}/build-info.ios.json
          # An .ipa is already a zip; re-compressing it costs minutes and saves
          # nothing.
          compression-level: 0
          retention-days: 30
          overwrite: true
          if-no-files-found: error
      - name: Upload ios-dsym
        # `!cancelled()`: symbols are what makes a failed build's crash reports
        # readable, so they upload even when verify failed.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.dsym-artifact }}
          path: ${{ env.WORKFLOWS_OUTPUT_DIR }}/*.dSYM.zip
          retention-days: 30
          overwrite: true
          if-no-files-found: warn
