name: Checks
on:
  workflow_call:
    inputs:
      repository:
        description: Consumer repository to check out (defaults to the caller's repository)
        type: string
        default: ''
      ref:
        description: Consumer ref to check out (empty lets actions/checkout resolve the correct ref, including PR merge refs)
        type: string
        default: ''
      working-directory:
        description: Consumer directory relative to GITHUB_WORKSPACE
        type: string
        default: '.'
      linux-runner:
        description: Runner label for Linux jobs
        type: string
        default: 'ubuntu-latest'
      macos-runner:
        description: Runner label for macOS jobs (unused by this workflow; carried for input-set consistency across the family)
        type: string
        default: 'macos-26'
      native-cache-version:
        description: Native cache key prefix (unused by this workflow; carried for input-set consistency across the family)
        type: string
        default: 'v1'
      native-stack:
        description: >-
          The app's native stack, expo or bare (React Native with committed ios/
          and android/). Empty detects it: expo when package.json lists expo and
          git tracks no ios/, bare otherwise. Decides which contract rows apply
          and whether the expo-health gate runs
        type: string
        default: ''
      types:
        description: Run the consumer's check:types script (the type check)
        type: boolean
        default: true
      lint:
        description: Run the consumer's check:lint script
        type: boolean
        default: true
      format:
        description: Run the consumer's check:format script
        type: boolean
        default: true
      unused:
        description: Run the consumer's check:unused script (unused files, exports and dependencies)
        type: boolean
        default: true
      spell:
        description: Run the consumer's check:spell script
        type: boolean
        default: true
      docs:
        description: Run the consumer's check:docs script (docs freshness, the AGENTS.md command table, table widths, diagram parsing)
        type: boolean
        default: true
      generated:
        description: >-
          Run the consumer's check:generated script, or regenerate what its
          gen:i18n and gen:graphql scripts write and assert it produced no
          uncommitted changes
        type: boolean
        default: false
      i18n-paths:
        description: >-
          Space-separated pathspecs gen:i18n writes, for the generated gate's
          fallback (empty: src/i18n/locales)
        type: string
        default: ''
      graphql-paths:
        description: >-
          Space-separated pathspecs gen:graphql writes, for the generated gate's
          fallback (empty: src/graphql/generated)
        type: string
        default: ''
      expo-health:
        description: >-
          Run the consumer's check:expo-health script, or report Expo SDK drift
          as a warning and then run Expo's own health check. Expo stack only: on
          a bare app the step passes with a notice
        type: boolean
        default: true
      audit:
        description: Run the consumer's check:audit script, or pnpm audit --prod
        type: boolean
        default: true
      audit-level:
        description: Minimum severity that fails pnpm audit
        type: string
        default: 'high'
      audit-soft-on-pr:
        description: Let a failing audit be advisory on a pull_request (it stays blocking on push, release and dispatch)
        type: boolean
        default: true
      commits:
        description: Lint the PR title against Conventional Commits
        type: boolean
        default: true
      commits-all:
        description: Also lint every commit in the PR against Conventional Commits (needs commits)
        type: boolean
        default: false
      ci:
        description: >-
          Run the consumer's check:ci script, or lint its .github/workflows
          (actionlint) and its scripts/ (shellcheck) and audit its .github for
          workflow security (zizmor: injection, permissions, App tokens, triggers)
        type: boolean
        default: true
      secrets:
        description: Run the consumer's check:secrets script, or scan its full git history with gitleaks
        type: boolean
        default: true
      licenses:
        description: Run the consumer's check:licenses script (the dependency license policy)
        type: boolean
        default: true
      app-suites:
        description: >-
          Run the consumer's test:app script: the app suites @blinkbitcoin/app-tooling
          ships, which run this family's code against the app's own files (the
          fingerprint a release must not move, and more as they move upstream).
          Off by default until the template and the terminal app run them.
        type: boolean
        default: false
      prebuild:
        description: >-
          Run the consumer's check:prebuild script (prebuild both platforms into
          a temp dir and assert the config plugins produced what they should).
          Off by default: it is minutes, not seconds.
        type: boolean
        default: false
      release:
        description: Run the consumer's check:release script (Fastfile/Gemfile lint, release configuration validation); needs Ruby, so it is off by default
        type: boolean
        default: false
      contract:
        description: >-
          Report every unmet requirement of this family in one place, before the
          gates that would each die on their own. Off makes the step a no-op;
          the job still runs, because every other job needs it (see the job).
        type: boolean
        default: true
      contract-only:
        description: >-
          Run the contract check and nothing else. For a repository that is
          still being wired up: it answers "would these workflows work here?"
          in seconds, without spending runners on gates that cannot pass yet.
          A run under this flag gates nothing, so it says so - the job logs a
          warning and the summary names it. Not a setting to leave on.
        type: boolean
        default: false
      docs-only-detection:
        description: Classify the change (docs-only, and whether it can affect the unit and E2E suites) so callers can skip downstream jobs
        type: boolean
        default: true
      docs-patterns:
        description: Extra regular expression alternatives (POSIX ERE, '|'-joined) added to the built-in docs pattern for docs-only detection
        type: string
        default: ''
      unit-ignore-patterns:
        description: Extra regular expression alternatives (POSIX ERE, '|'-joined) for paths the unit suite never reads, added to the built-in list behind unit-changed
        type: string
        default: ''
      e2e-ignore-patterns:
        description: Extra regular expression alternatives (POSIX ERE, '|'-joined) for paths the native E2E suite never reads, added to the built-in list behind e2e-changed
        type: string
        default: ''
    secrets:
      consumer-token:
        description: PAT with read access to a private consumer repository; falls back to the caller's github.token (works for a public consumer)
        required: false
    outputs:
      docs-only:
        description: 'true when every changed file matched the docs patterns (empty when docs-only-detection is disabled)'
        value: ${{ jobs.changes.outputs.docs-only }}
      unit-changed:
        description: "'false' when no changed file can affect the unit suite (empty when docs-only-detection is disabled; gate on != 'false')"
        value: ${{ jobs.changes.outputs.unit-changed }}
      e2e-changed:
        description: "'false' when no changed file can affect the native E2E suite (empty when docs-only-detection is disabled; gate on != 'false')"
        value: ${{ jobs.changes.outputs.e2e-changed }}
permissions:
  contents: read
jobs:
  changes:
    name: Changes
    if: ${{ inputs.docs-only-detection }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
      unit-changed: ${{ steps.classify.outputs.unit-changed }}
      e2e-changed: ${{ steps.classify.outputs.e2e-changed }}
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
          # Every commit and tree, so any two shas diff, but no file content
          # beyond the checked-out tip: the classifier only lists paths
          # (`git diff --no-renames --name-only`), which the trees answer, so a
          # partial clone skips every older blob of the app's history.
          fetch-depth: 0
          filter: blob:none
      # No setup here: changed-class.sh is pure git and doesn't need node/pnpm,
      # so this job skips it and reaches the script via the plain checkout path
      # (there's no $WORKFLOWS_DIR yet -- that's exported by setup, which never runs).
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Classify changed files
        id: classify
        env:
          # One classifier for every event. `pull_request.base.sha` is empty on
          # a push, so the old unconditional form classified only PRs and every
          # merge to main ran the full matrix; `github.event.before` is the
          # push's previous tip (all-zero on a branch's first push, which the
          # script treats as "cannot classify" and fails open).
          # Both operands of `&&` are non-empty, so the family's `cond && '' ||`
          # pitfall (GitHub's `&&` yields its first falsy operand) cannot bite.
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          # _EXTRA, not DOCS_GLOBS: the input is additive, so it must not
          # replace the built-in ^docs/|\.md$|... pattern.
          DOCS_GLOBS_EXTRA: ${{ inputs.docs-patterns }}
          UNIT_IGNORE_GLOBS_EXTRA: ${{ inputs.unit-ignore-patterns }}
          E2E_IGNORE_GLOBS_EXTRA: ${{ inputs.e2e-ignore-patterns }}
        run: bash ".workflows/scripts/ci/changed-class.sh" "$BASE_SHA" "$HEAD_SHA"
  contract:
    name: Contract
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 5
    # No `if:` on the job, deliberately, even though `contract` can turn
    # this off. Every other job in this workflow `needs:` this one, and a job
    # whose dependency was *skipped* is skipped too - so an `if:` here would
    # make `contract: false` skip the entire Checks workflow, and a
    # skipped job counts as passing for a required check. The toggle gates the
    # step instead; what is left is two checkouts, which is seconds.
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      # No setup: this runs *before* the toolchain exists, which is the point.
      # A consumer with no mise config or no lockfile fails inside setup with
      # `missing command: pnpm`, several steps removed from the cause. The
      # checker is dependency-free node, so the runner image's own node runs it.
      - name: Check the consumer contract
        if: ${{ inputs.contract }}
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          WORKFLOWS_CONTRACT_ONLY: ${{ inputs.contract-only }}
          NATIVE_STACK: ${{ inputs.native-stack }}
        run: bash ".workflows/scripts/ci/check-contract.sh"
  code:
    name: Code
    needs: contract
    if: ${{ !inputs.contract-only }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
      - name: Types
        if: ${{ inputs.types }}
        env:
          SCRIPT_NAME: 'check:types'
        run: bash "$WORKFLOWS_DIR/scripts/checks/run-script.sh" "$SCRIPT_NAME"
      - name: Lint
        if: ${{ inputs.lint }}
        env:
          SCRIPT_NAME: 'check:lint'
        run: bash "$WORKFLOWS_DIR/scripts/checks/run-script.sh" "$SCRIPT_NAME"
      - name: Format
        if: ${{ inputs.format }}
        env:
          SCRIPT_NAME: 'check:format'
        run: bash "$WORKFLOWS_DIR/scripts/checks/run-script.sh" "$SCRIPT_NAME"
      - name: Unused
        if: ${{ inputs.unused }}
        env:
          SCRIPT_NAME: 'check:unused'
        run: bash "$WORKFLOWS_DIR/scripts/checks/run-script.sh" "$SCRIPT_NAME"
      - name: Spell
        if: ${{ inputs.spell }}
        env:
          SCRIPT_NAME: 'check:spell'
        run: bash "$WORKFLOWS_DIR/scripts/checks/run-script.sh" "$SCRIPT_NAME"
      # The consumer's docs gate. It is handed the event shape rather than
      # working it out: a docs-freshness heuristic needs a diff base, and on a
      # PR that base is the target branch, not HEAD~1. PR_AUTHOR is what lets
      # the consumer exempt a bot's dependency bump from "you changed
      # architecture without touching docs".
  generated:
    name: Generated
    needs: contract
    if: ${{ !inputs.contract-only && inputs.generated }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
      - name: Generated
        if: ${{ inputs.generated }}
        env:
          I18N_PATHS: ${{ inputs.i18n-paths }}
          GRAPHQL_PATHS: ${{ inputs.graphql-paths }}
        run: bash "$WORKFLOWS_DIR/scripts/checks/run-consumer-or.sh" 'check:generated' scripts/checks/generated.sh
      # The Expo health check, not expo-doctor alone: the template's script
      # reports SDK drift (`expo install --check`) as a warning and then runs
      # expo-doctor with its version check off. The fallback does the same, so a
      # same-day Expo patch the release cooldown refuses turns neither of them
      # red; the package ships it as checks/expo-health.sh, so one gate has one
      # implementation.
  docs:
    name: Docs
    needs: contract
    if: ${{ !inputs.contract-only }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
      - name: Docs
        if: ${{ inputs.docs }}
        env:
          SCRIPT_NAME: 'check:docs'
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: bash "$WORKFLOWS_DIR/scripts/checks/run-script.sh" "$SCRIPT_NAME"
      # The consumer's own script wins when it ships one; the script in this
      # repo is the fallback. See scripts/checks/run-consumer-or.sh for why -
      # in short, a gate the consumer defines and a gate CI runs must be the
      # same gate, and for these five they were not.
  dependencies:
    name: Dependencies
    needs: contract
    if: ${{ !inputs.contract-only }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
      # expo-only.sh resolves the stack first and passes with a notice on a bare
      # app, which has no Expo SDK to drift from: the input stays on by default
      # without turning a bare consumer's Dependencies job red.
      - name: Expo health
        if: ${{ inputs.expo-health }}
        env:
          NATIVE_STACK: ${{ inputs.native-stack }}
        run: bash "$WORKFLOWS_DIR/scripts/checks/expo-only.sh" 'check:expo-health' scripts/checks/expo-health.sh
      # The audit is one registry request (the advisories/bulk endpoint), and
      # that endpoint is the family's known staller: esign measured 5s-102s for
      # identical payloads on a healthy day. So the step gets a bound of its
      # own, and a fetch timeout that is *larger* than the bound, so a stall is
      # ended by `timeout-minutes` with a step name in the log rather than by a
      # network layer that reports `code undefined:`.
      #
      # The fetch timeouts are step-level on purpose, and that is the whole
      # point of them: esign aebdd28 has a workflow-level 60s
      # NPM_CONFIG_FETCH_TIMEOUT - set for an installer's cold path in a
      # *different* workflow, inherited here - silently overriding this step's
      # 5-minute budget and turning main red at 61s. A workflow-level value can
      # only ever be the smaller one, so this step re-states its own.
      #
      # PNPM_CONFIG_ is the variable that does the work: measured on pnpm
      # 11.27.0 and 12.3.4, neither reads `npm_config_*` from the environment
      # (`PNPM_CONFIG_REGISTRY` moves `pnpm config get registry`, `NPM_CONFIG_
      # REGISTRY` does not), and audit.sh runs `pnpm audit`. NPM_CONFIG_ is
      # kept beside it so an inherited workflow-level npm cap cannot reach an
      # npm/npx call made from this step either.
      - name: Audit
        if: ${{ inputs.audit }}
        timeout-minutes: 5
        # Advisory on a PR, blocking everywhere else: a dead advisory endpoint
        # must not hold up review, but it must still turn main red. Callers
        # that want the audit blocking on PRs too set audit-soft-on-pr: false.
        continue-on-error: ${{ inputs.audit-soft-on-pr && github.event_name == 'pull_request' }}
        env:
          AUDIT_LEVEL: ${{ inputs.audit-level }}
          PNPM_CONFIG_FETCH_TIMEOUT: '270000'
          NPM_CONFIG_FETCH_TIMEOUT: '270000'
        # check:audit, not audit.sh: the template's script also runs its lockfile
        # provenance check, which likewise ran in no CI job.
        run: bash "$WORKFLOWS_DIR/scripts/checks/run-consumer-or.sh" 'check:audit' scripts/checks/audit.sh
      # Cheap, and it ran in no CI job before this: `make check-dependencies` includes it
      # locally, so a green local gate implied a license check CI never made.
      - name: Licenses
        if: ${{ inputs.licenses }}
        env:
          SCRIPT_NAME: 'check:licenses'
        run: bash "$WORKFLOWS_DIR/scripts/checks/run-script.sh" "$SCRIPT_NAME"
  # The behavioural half of the contract job: the app suites run the shared
  # code against the app's own files. A job of its own, so a failing suite
  # reads as `App suites` in the checks list, and skipped outright when off.
  app-suites:
    name: App suites
    needs: contract
    if: ${{ !inputs.contract-only && inputs.app-suites }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
      # Also gated here, though the job is skipped while the input is off: the
      # step's own `if:` is what ties the script to its input in contract.json.
      - name: App suites
        if: ${{ inputs.app-suites }}
        env:
          SCRIPT_NAME: 'test:app'
        run: bash "$WORKFLOWS_DIR/scripts/checks/run-script.sh" "$SCRIPT_NAME"
      # The expensive gate, off by default. A prebuild of both platforms is
      # minutes, so it is opt-in for the consumers that decide the coverage is
      # worth the wall clock - on main, on a release, or behind a label - rather
      # than a cost every PR pays. (The bundle scan is check-security.yml's
      # `bundle` job: one workflow owns it.)
  prebuild:
    name: Prebuild
    needs: contract
    if: ${{ !inputs.contract-only && inputs.prebuild }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
      - name: Prebuild
        if: ${{ inputs.prebuild }}
        timeout-minutes: 20
        env:
          SCRIPT_NAME: 'check:prebuild'
        run: bash "$WORKFLOWS_DIR/scripts/checks/run-script.sh" "$SCRIPT_NAME"
      # Ruby is installed here rather than through the `setup` action's `ruby`
      # input so the checks above never pay for a bundle install they do not
      # use; `bundler-cache: true` makes the repeat cost near zero.
  release:
    name: Release
    needs: contract
    if: ${{ !inputs.contract-only && inputs.release }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
      - name: Read pinned Ruby version
        id: rb
        if: ${{ inputs.release }}
        run: bash "$WORKFLOWS_DIR/scripts/ci/ruby-version.sh"
      - name: Install Ruby
        if: ${{ inputs.release }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ steps.rb.outputs.version }}
          bundler-cache: true
          working-directory: ${{ inputs.working-directory }}
      - name: Release
        if: ${{ inputs.release }}
        env:
          SCRIPT_NAME: 'check:release'
        run: bash "$WORKFLOWS_DIR/scripts/checks/run-script.sh" "$SCRIPT_NAME"
  ci:
    name: CI
    needs: contract
    if: ${{ !inputs.contract-only }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
      - name: CI
        if: ${{ inputs.ci }}
        run: bash "$WORKFLOWS_DIR/scripts/checks/run-consumer-or.sh" 'check:ci' scripts/ci/check-ci.sh
  secrets:
    name: Secrets
    needs: contract
    if: ${{ !inputs.contract-only }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
          # The secret scan reads every commit, not the tip: a key deleted in a
          # later commit is still in the repository.
          fetch-depth: 0
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
      - name: Secrets
        if: ${{ inputs.secrets }}
        run: bash "$WORKFLOWS_DIR/scripts/checks/run-consumer-or.sh" 'check:secrets' scripts/checks/secrets.sh
  commits:
    name: Commits
    needs: contract
    if: ${{ !inputs.contract-only && ( inputs.commits && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' ) }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 5
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
          # fetch-depth: 0 so PR_COMMITS_RANGE below (base sha..head sha) can
          # resolve both endpoints when commits-all is enabled.
          fetch-depth: 0
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
      - name: Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_COMMITS_RANGE: ${{ inputs.commits-all && format('{0}..{1}', github.event.pull_request.base.sha, github.sha) || '' }}
        run: bash "$WORKFLOWS_DIR/scripts/checks/commits.sh"
