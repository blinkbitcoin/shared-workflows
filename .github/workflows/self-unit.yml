name: Self unit
# The test suites, split so a run says which one failed: the bats cases over
# the shell scripts and the workflow shapes, node:test over every package under
# packages/, and the Ruby lanes' own tests. Called from self-ci.yml, which turns these into
# `Unit / Tests`, `Unit / Package` and `Unit / Ruby`.
#
# Kept apart from self-checks.yml because they answer different questions - "is
# the code right" rather than "is the repository tidy" - and because this is
# where a coverage artifact will come from when this repository starts
# publishing its own badges.
on:
  workflow_call:
    # Set by self-ci.yml's `changes` job; true by default. Tests has no input:
    # the bats suite reads the whole tree and runs on every change.
    inputs:
      package:
        description: Run the suites of the packages under packages/
        type: boolean
        default: true
permissions: { contents: read }
jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      # GNU parallel lets `make test-unit` run one bats job per core, as it does
      # on a laptop, so a test that only passes alone fails here too.
      - run: sudo apt-get install -y --no-install-recommends parallel
      - run: make test-unit
  package:
    name: Package
    if: ${{ inputs.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      # Carries the 100% line, branch and function thresholds; see the comment
      # on the target in the Makefile for why they ratchet and never drop.
      - run: make test-package
      - run: make test-scripts
  # The Ruby lanes the package ships (packages/app-tooling/fastlane): their unit
  # tests, run under Bundler against the test Gemfile. A job of its own because
  # it needs Ruby and a gem install the other two do not, and because a run
  # should say "the lanes" failed rather than "the package".
  fastlane:
    name: Ruby
    if: ${{ inputs.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: make test-fastlane
