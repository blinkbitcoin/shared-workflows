name: Build web
on:
  workflow_call:
    inputs:
      repository:
        description: Consumer repository to check out (defaults to the caller's repository)
        type: string
        default: ''
      ref:
        description: Consumer ref to check out (empty lets actions/checkout resolve the correct ref, including PR merge refs)
        type: string
        default: ''
      working-directory:
        description: Consumer directory relative to GITHUB_WORKSPACE
        type: string
        default: '.'
      linux-runner:
        description: Runner label for every job in this workflow
        type: string
        default: 'ubuntu-latest'
      macos-runner:
        description: Runner label for macOS jobs (unused by this workflow; carried for input-set consistency across the family)
        type: string
        default: 'macos-26'
      native-cache-version:
        description: Native cache key prefix (unused by this workflow; carried for input-set consistency across the family)
        type: string
        default: 'v1'
      e2e:
        description: Run the web E2E suite (Playwright) against the exported web build
        type: boolean
        default: true
      deploy:
        description: Publish the export to GitHub Pages (caller typically passes github.ref_type == 'tag')
        type: boolean
        default: false
      base-url:
        description: Base URL to bake into the export via EXPO_PUBLIC_BASE_URL (e.g. a project Pages path)
        type: string
        default: ''
      build-script:
        description: Consumer package.json script that exports the web build
        type: string
        default: 'build:web'
      build-arguments:
        description: Extra space-separated flags appended to the export script's own args (e.g. '--dev')
        type: string
        default: ''
      output-directory:
        description: Consumer-relative directory the export script writes to
        type: string
        default: 'dist'
      e2e-script:
        description: Consumer package.json script that runs the Playwright suite
        type: string
        default: 'test:e2e:web'
      e2e-browsers:
        description: Space-separated browser names passed to `playwright install`
        type: string
        default: 'chromium'
      docs-patterns:
        description: Extra regular expression alternatives (POSIX ERE, '|'-joined) added to the built-in docs pattern, which the web class also never reads
        type: string
        default: ''
      web-ignore-patterns:
        description: Extra regular expression alternatives (POSIX ERE, '|'-joined) for paths the web build and its Playwright suite never read, added to the built-in list behind web-changed
        type: string
        default: ''
    secrets:
      consumer-token:
        description: PAT with read access to a private consumer repository; falls back to the caller's github.token (works for a public consumer)
        required: false
    outputs:
      page-url:
        description: 'URL of the deployed GitHub Pages site (empty unless deploy is true)'
        value: ${{ jobs.deploy.outputs.page-url }}
      web-changed:
        description: "'false' when no changed file can affect the web build, so neither the build nor its Playwright suite ran"
        value: ${{ jobs.changes.outputs.web-changed }}
permissions:
  contents: read
jobs:
  changes:
    name: Changes
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 5
    outputs:
      web-changed: ${{ steps.classify.outputs.web-changed }}
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
          fetch-depth: 0
      # No setup here, exactly as in check.yml: changed-class.sh is pure git,
      # so this job reaches it through the plain .workflows checkout ($WORKFLOWS_DIR is
      # published by the setup action, which never runs in this job).
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Classify changed files
        id: classify
        env:
          # Byte-identical to check.yml's expression on purpose: one rule for
          # what the diff is. A `release` event has neither operand, so the script
          # logs "no base sha" and fails open - a release always builds and
          # deploys.
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          DOCS_GLOBS_EXTRA: ${{ inputs.docs-patterns }}
          WEB_IGNORE_GLOBS_EXTRA: ${{ inputs.web-ignore-patterns }}
        run: bash ".workflows/scripts/ci/changed-class.sh" "$BASE_SHA" "$HEAD_SHA"
  build:
    # Job names say what a step is for, not which tool does it - they show in
    # a consumer's PR as "<caller job> / <this>", read by people who have never
    # heard of Playwright. "Deploy" is also deliberately not "Deploy to Pages":
    # Pages is the target implemented today, not the interface.
    name: Build
    needs: changes
    # != 'false', not == 'true': an output that never arrived runs the build.
    # `e2e` and `deploy` need this job, so a skip here skips them too.
    if: ${{ needs.changes.outputs.web-changed != 'false' }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          skip-tools: 'java ruby'
      - name: Export web build
        env:
          EXPORT_SCRIPT: ${{ inputs.build-script }}
          EXPORT_ARGS: ${{ inputs.build-arguments }}
          EXPO_PUBLIC_BASE_URL: ${{ inputs.base-url }}
          OUTPUT_DIR: ${{ inputs.output-directory }}
        run: bash "$WORKFLOWS_DIR/scripts/web/export.sh"
      - name: Upload web-dist
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: ${{ inputs.working-directory }}/${{ inputs.output-directory }}
          retention-days: 1
          overwrite: true
          # Every other upload in this family sets this explicitly. Failing here
          # beats the e2e job downloading an empty artifact and failing
          # on a missing index.html one job later.
          if-no-files-found: error
      - name: Upload Pages artifact
        if: ${{ inputs.deploy }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ inputs.working-directory }}/${{ inputs.output-directory }}
  e2e:
    name: E2E
    needs: build
    if: ${{ inputs.e2e }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          skip-tools: 'java ruby'
      - name: Download web-dist
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: ${{ inputs.working-directory }}/${{ inputs.output-directory }}
      - name: Resolve Playwright version
        id: pw
        run: bash "$WORKFLOWS_DIR/scripts/web/playwright-cache-key.sh"
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browsers
        env:
          PLAYWRIGHT_BROWSERS: ${{ inputs.e2e-browsers }}
        run: bash "$WORKFLOWS_DIR/scripts/web/playwright-install.sh"
      - name: E2E suite
        env:
          E2E_SCRIPT: ${{ inputs.e2e-script }}
          PLAYWRIGHT_SKIP_EXPORT: '1'
          # The suite tests the export the build job made, and that export has
          # `base-url` baked into every path. Without it the preview server
          # serves at `/` and the page shell renders with a bundle that 404s.
          EXPO_PUBLIC_BASE_URL: ${{ inputs.base-url }}
        run: bash "$WORKFLOWS_DIR/scripts/web/playwright.sh"
      - name: Upload forensics
        if: always()
        uses: ./.workflows/.github/actions/forensics
        with:
          name: playwright-report
          path: ${{ inputs.working-directory }}/playwright-report
  deploy:
    name: Deploy
    needs: [build, e2e]
    if: ${{ always() && inputs.deploy && needs.build.result == 'success' && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page-url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
