name: Check security
# The security scanners, one job each so a red run names the scanner, and one
# verdict that merges their SARIF and applies the threshold.
#
# Every scanner, the settings resolver and the merge live HERE: the runners
# under scripts/security/, the modules they call in packages/app-tooling/lib/.
# @blinkbitcoin/app-tooling ships the same files, and its `check-security`
# command runs them on a laptop, so a green laptop and a green pipeline are the
# same claim. A consumer ships no scanner code: it keeps its
# security-settings.json (optional; a missing file is the defaults) and the
# files that settings name (Semgrep rules, a .mobsf).
#
# A scanner runs where what it reads exists, so a caller turns on the stage it
# is: a pull request allows dependencies, code, policy and review; the release pull
# request adds bundle, review-codebase and review-full-range; the production dispatch
# allows binaries, mobile, bundle and sbom with release-tag set. The consumer's
# security-settings.json still decides which of those actually run.
on:
  workflow_call:
    inputs:
      repository:
        description: Consumer repository to check out (defaults to the caller's repository)
        type: string
        default: ''
      ref:
        description: Consumer ref to check out (empty lets actions/checkout resolve the correct ref, including PR merge refs)
        type: string
        default: ''
      working-directory:
        description: Consumer directory relative to GITHUB_WORKSPACE
        type: string
        default: '.'
      linux-runner:
        description: Runner label for every job in this workflow
        type: string
        default: 'ubuntu-latest'
      macos-runner:
        description: Runner label for macOS jobs (unused by this workflow; carried for input-set consistency across the family)
        type: string
        default: 'macos-26'
      native-cache-version:
        description: Native cache key prefix (unused by this workflow; carried for input-set consistency across the family)
        type: string
        default: 'v1'
      native-stack:
        description: >-
          The app's native stack, expo or bare (React Native with committed ios/
          and android/), for the bundle and mobile scanners. Empty detects it:
          expo when package.json lists expo and git tracks no ios/, bare otherwise
        type: string
        default: ''
      dependencies:
        description: >-
          Allow the dependency scanner (`check-security dependencies`).
          A switch, not a setting: whether it actually runs is this AND the
          consumer's security-settings.json, so a caller may narrow and never widen.
        type: boolean
        default: true
      code:
        description: Allow the source scanner (`check-security code`); the effective setting is this and security-settings.json together
        type: boolean
        default: true
      policy:
        description: Allow the install-policy scanner (`check-security policy`); the effective setting is this and security-settings.json together
        type: boolean
        default: true
      sbom:
        description: >-
          Allow the bill of materials (`check-security sbom`, a
          CycloneDX SBOM from the lockfile, kept as the security-sbom artifact).
          Off by default: it belongs to the production stage.
        type: boolean
        default: false
      bundle:
        description: >-
          Allow the bundle scanner (`check-security bundle`: exports
          the JavaScript bundle - expo export, or react-native bundle on the bare
          stack - and reads what it gives away). Minutes, so off by
          default; the release pull request and the production dispatch turn it on.
        type: boolean
        default: false
      mobile:
        description: >-
          Allow the native project scanner (`check-security mobile`:
          mobsfscan over a fresh prebuild, or over the committed ios/ and android/
          on the bare stack). Off by default: production stage.
        type: boolean
        default: false
      binaries:
        description: >-
          Allow the MASTG checks over the release's built binaries (`check-security
          binaries`). Needs release-tag. Off by default: binaries
          only exist once a release is built.
        type: boolean
        default: false
      review:
        description: >-
          Allow the LLM security review of the change (`check-security
          review`). The default settings keep it off until a
          provider and a key are configured; with no key it reports skipped.
        type: boolean
        default: false
      review-codebase:
        description: >-
          Allow the LLM security review of the whole codebase, with OpenAnt
          (`check-security review-codebase`). Minutes and tokens, so the release pull
          request is the stage that turns it on.
        type: boolean
        default: false
      review-full-range:
        description: >-
          Review everything since the last release tag rather than the pull
          request's own diff - what the release pull request asks for. A switch,
          like the job inputs: the tag itself is found by the review runner.
        type: boolean
        default: false
      release-tag:
        description: >-
          The release whose .apk, .aab and .ipa assets the binaries job checks
          (e.g. v1.2.3). Required when binaries is on; ignored otherwise.
        type: string
        default: ''
      environment-variables:
        description: >-
          Non-secret environment for every job, as a flat JSON object:
          SECURITY_LLM_PROVIDER, SECURITY_LLM_MODEL, SECURITY_LLM_EFFORT,
          SECURITY_LLM_EXTRA_PARAMS, OPENAI_BASE_URL, and any SECURITY_* twin of a
          security-settings.json setting. Keys only are logged.
        type: string
        default: '{}'
      sarif-upload-enabled:
        description: >-
          Upload the SARIF to code scanning, from the default branch only (a
          pull request is judged by the Verdict job and its annotations). Off
          makes the run say so in the summary rather than go quiet; the verdict
          still applies the threshold either way.
        type: boolean
        default: true
      artifact-prefix:
        description: >-
          Name for this call's artifacts, for a caller that calls this workflow
          more than once in one run: my-app makes them my-app-security-sarif-<job>
          and my-app-security-sbom, and the verdict and the code scanning category
          read this call's own only. Lowercase letters, digits and hyphens, not
          containing security-sarif. Empty keeps the plain names.
        type: string
        default: ''
    secrets:
      consumer-token:
        description: PAT with read access to a private consumer repository; falls back to the caller's github.token (works for a public consumer)
        required: false
      OPENAI_API_KEY:
        description: Key for an OpenAI or OpenAI-compatible provider (OPENAI_BASE_URL). Reaches the review and review-codebase scan steps only
        required: false
      ANTHROPIC_API_KEY:
        description: Key for Anthropic. Reaches the review and review-codebase scan steps only
        required: false
    outputs:
      verdict:
        description: >-
          The security verdict as one line of JSON, {"verdict","highest","canBlock"}, for a badge.
          {"verdict":"disabled"} when security-settings.json switches the gate off, {"verdict":"fail"} when a
          scanner crashed, the Verdict job failed before its verdict, or the settings job failed (it
          writes every output or none, so an empty enabled means it failed)
        value: >-
          ${{ jobs.verdict.outputs.verdict
          || (jobs.settings.outputs.enabled == 'false' && '{"verdict":"disabled"}')
          || (jobs.settings.outputs.enabled == '' && '{"verdict":"fail"}')
          || '' }}
permissions:
  contents: read
jobs:
  # A job-level `if:` cannot read a file, and security-settings.json is a file in
  # the consumer. So the settings are resolved once, here, by the same resolver
  # every runner uses (security-settings.mjs) - not by a second implementation
  # of the same resolution order - and published as outputs the other jobs'
  # `if:` expressions can read.
  settings:
    name: Settings
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 10
    outputs:
      enabled: ${{ steps.resolve.outputs.enabled }}
      dependencies: ${{ steps.resolve.outputs.dependencies }}
      code: ${{ steps.resolve.outputs.code }}
      policy: ${{ steps.resolve.outputs.policy }}
      sbom: ${{ steps.resolve.outputs.sbom }}
      bundle: ${{ steps.resolve.outputs.bundle }}
      mobile: ${{ steps.resolve.outputs.mobile }}
      binaries: ${{ steps.resolve.outputs.binaries }}
      review: ${{ steps.resolve.outputs.review }}
      review-codebase: ${{ steps.resolve.outputs.review-codebase }}
      severity: ${{ steps.resolve.outputs.severity }}
      fail-on: ${{ steps.resolve.outputs.fail-on }}
      artifact-prefix: ${{ steps.artifact-prefix.outputs.artifact-prefix }}
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      # Before the settings, so a bad prefix fails here with no output written
      # and every scanner job skipped: nothing is uploaded under a name that
      # could make two calls in one run read each other's SARIF.
      - name: Check the artifact prefix
        id: artifact-prefix
        env:
          ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
        run: bash ".workflows/scripts/security/artifact-prefix.sh" "$ARTIFACT_PREFIX"
      # Before Setup and before any consumer script, in every job: a SECURITY_*
      # twin in environment-variables changes what the resolver returns, what a runner does
      # and what the verdict applies, so all of them have to see the same values.
      - name: Publish environment-variables
        env:
          WORKFLOWS_BUILD_ENV: ${{ inputs.environment-variables }}
        run: bash ".workflows/scripts/release/build-env.sh"
      # Setup here, unlike check.yml's contract job, which deliberately runs
      # on the runner image's own node: the consumer's .mise.toml pin is the
      # node every job in this workflow runs the resolver with, so all of them
      # resolve the same settings.
      #
      # install: 'true' in every job, one shape for all of them: the bundle
      # and mobile runners call the consumer's expo out of node_modules, and
      # the install is the setup action's own, from the frozen lockfile. The
      # runners and modules themselves come from the .workflows checkout and
      # import nothing from it. Quoted, because the composite action's inputs
      # are strings.
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          install: 'true'
      - name: Resolve the security settings
        id: resolve
        run: bash "$WORKFLOWS_DIR/scripts/security/settings.sh"
  dependencies:
    name: Dependencies
    needs: settings
    # The AND of the caller's stage and the consumer's settings. A skipped job is
    # green, so a repository that has turned the gate off never holds up a
    # required check.
    if: ${{ inputs.dependencies && needs.settings.outputs.enabled == 'true' && needs.settings.outputs.dependencies == 'true' }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      # Before Setup and before any consumer script, in every job: a SECURITY_*
      # twin in environment-variables changes what the resolver returns, what a runner does
      # and what the verdict applies, so all of them have to see the same values.
      - name: Publish environment-variables
        env:
          WORKFLOWS_BUILD_ENV: ${{ inputs.environment-variables }}
        run: bash ".workflows/scripts/release/build-env.sh"
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          install: 'true'
      - name: Scan dependencies
        id: scan
        env:
          SECURITY_JOB: dependencies
        run: bash "$WORKFLOWS_DIR/scripts/security/run-job.sh" "$SECURITY_JOB"
      # Same guard as test-e2e.yml's platform uploads: a failed scan has no
      # SARIF, and if-no-files-found: error would stack a second red step on top
      # of the real one. if-no-files-found stays `error` because a *successful*
      # scan with no SARIF is the silence run-job.sh already refuses.
      #
      # Every upload in this workflow is named after artifact-prefix (empty by
      # default) and overwrites: a re-run of a failed job replaces the artifact
      # its first attempt left, where without overwrite the upload fails on the
      # name. A second call in the same run passes its own prefix.
      - name: Upload SARIF
        if: ${{ !cancelled() && steps.scan.conclusion != 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.settings.outputs.artifact-prefix }}security-sarif-dependencies
          path: ${{ inputs.working-directory }}/.security/dependencies.sarif
          if-no-files-found: error
          retention-days: 7
          overwrite: true
  code:
    name: Code
    needs: settings
    if: ${{ inputs.code && needs.settings.outputs.enabled == 'true' && needs.settings.outputs.code == 'true' }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 25
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      # Before Setup and before any consumer script, in every job: a SECURITY_*
      # twin in environment-variables changes what the resolver returns, what a runner does
      # and what the verdict applies, so all of them have to see the same values.
      - name: Publish environment-variables
        env:
          WORKFLOWS_BUILD_ENV: ${{ inputs.environment-variables }}
        run: bash ".workflows/scripts/release/build-env.sh"
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          install: 'true'
      # The longest of the three: code.sh fetches its Semgrep registry
      # packs on every invocation, so this step can hang on the Semgrep registry
      # rather than on anything in the repository. A bound of its own, so the
      # log names the step instead of the job.
      - name: Scan source
        id: scan
        timeout-minutes: 20
        env:
          SECURITY_JOB: code
        run: bash "$WORKFLOWS_DIR/scripts/security/run-job.sh" "$SECURITY_JOB"
      - name: Upload SARIF
        if: ${{ !cancelled() && steps.scan.conclusion != 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.settings.outputs.artifact-prefix }}security-sarif-code
          path: ${{ inputs.working-directory }}/.security/code.sarif
          if-no-files-found: error
          retention-days: 7
          overwrite: true
  policy:
    name: Policy
    needs: settings
    if: ${{ inputs.policy && needs.settings.outputs.enabled == 'true' && needs.settings.outputs.policy == 'true' }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      # Before Setup and before any consumer script, in every job: a SECURITY_*
      # twin in environment-variables changes what the resolver returns, what a runner does
      # and what the verdict applies, so all of them have to see the same values.
      - name: Publish environment-variables
        env:
          WORKFLOWS_BUILD_ENV: ${{ inputs.environment-variables }}
        run: bash ".workflows/scripts/release/build-env.sh"
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          install: 'true'
      - name: Scan the install policy
        id: scan
        env:
          SECURITY_JOB: policy
        run: bash "$WORKFLOWS_DIR/scripts/security/run-job.sh" "$SECURITY_JOB"
      - name: Upload SARIF
        if: ${{ !cancelled() && steps.scan.conclusion != 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.settings.outputs.artifact-prefix }}security-sarif-policy
          path: ${{ inputs.working-directory }}/.security/policy.sarif
          if-no-files-found: error
          retention-days: 7
          overwrite: true
  # A record rather than a scan: what the release pins, kept long enough to
  # answer "did we ship the vulnerable version?" when an advisory lands later.
  sbom:
    name: Bill of Materials
    needs: settings
    if: ${{ inputs.sbom && needs.settings.outputs.enabled == 'true' && needs.settings.outputs.sbom == 'true' }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Publish environment-variables
        env:
          WORKFLOWS_BUILD_ENV: ${{ inputs.environment-variables }}
        run: bash ".workflows/scripts/release/build-env.sh"
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          install: 'true'
      - name: Write the bill of materials
        id: scan
        timeout-minutes: 10
        env:
          SECURITY_JOB: sbom
        run: bash "$WORKFLOWS_DIR/scripts/security/run-job.sh" "$SECURITY_JOB"
      - name: Upload SARIF
        if: ${{ !cancelled() && steps.scan.conclusion != 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.settings.outputs.artifact-prefix }}security-sarif-sbom
          path: ${{ inputs.working-directory }}/.security/sbom.sarif
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Upload the bill of materials
        if: ${{ !cancelled() && steps.scan.conclusion != 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.settings.outputs.artifact-prefix }}security-sbom
          path: ${{ inputs.working-directory }}/.security/sbom.cdx.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
  # Every job here installs (see the settings job); these two are the reason:
  # expo export and expo prebuild, or react-native bundle on the bare stack,
  # run from the consumer's node_modules. Both take native-stack, which decides
  # which (scripts/security/lib/runner.sh: sec_native_stack).
  bundle:
    name: Bundle
    needs: settings
    if: ${{ inputs.bundle && needs.settings.outputs.enabled == 'true' && needs.settings.outputs.bundle == 'true' }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Publish environment-variables
        env:
          WORKFLOWS_BUILD_ENV: ${{ inputs.environment-variables }}
        run: bash ".workflows/scripts/release/build-env.sh"
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          install: 'true'
      - name: Scan the exported bundle
        id: scan
        timeout-minutes: 25
        env:
          SECURITY_JOB: bundle
          NATIVE_STACK: ${{ inputs.native-stack }}
        run: bash "$WORKFLOWS_DIR/scripts/security/run-job.sh" "$SECURITY_JOB"
      - name: Upload SARIF
        if: ${{ !cancelled() && steps.scan.conclusion != 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.settings.outputs.artifact-prefix }}security-sarif-bundle
          path: ${{ inputs.working-directory }}/.security/bundle.sarif
          if-no-files-found: error
          retention-days: 7
          overwrite: true
  mobile:
    name: Mobile
    needs: settings
    if: ${{ inputs.mobile && needs.settings.outputs.enabled == 'true' && needs.settings.outputs.mobile == 'true' }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 40
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Publish environment-variables
        env:
          WORKFLOWS_BUILD_ENV: ${{ inputs.environment-variables }}
        run: bash ".workflows/scripts/release/build-env.sh"
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          install: 'true'
      - name: Scan the native projects
        id: scan
        timeout-minutes: 35
        env:
          SECURITY_JOB: mobile
          NATIVE_STACK: ${{ inputs.native-stack }}
        run: bash "$WORKFLOWS_DIR/scripts/security/run-job.sh" "$SECURITY_JOB"
      - name: Upload SARIF
        if: ${{ !cancelled() && steps.scan.conclusion != 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.settings.outputs.artifact-prefix }}security-sarif-mobile
          path: ${{ inputs.working-directory }}/.security/mobile.sarif
          if-no-files-found: error
          retention-days: 7
          overwrite: true
  # The release's own assets, not a rebuild: what the stores receive is what is
  # checked. binaries-fetch.sh puts them in a directory and hands its path to
  # the binaries runner through SECURITY_BINARIES_DIR.
  binaries:
    name: Binaries
    needs: settings
    if: ${{ inputs.binaries && needs.settings.outputs.enabled == 'true' && needs.settings.outputs.binaries == 'true' }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Publish environment-variables
        env:
          WORKFLOWS_BUILD_ENV: ${{ inputs.environment-variables }}
        run: bash ".workflows/scripts/release/build-env.sh"
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          install: 'true'
      - name: Download the release binaries
        env:
          GH_TOKEN: ${{ secrets.consumer-token || github.token }}
          GH_REPO: ${{ inputs.repository || github.repository }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          BINARIES_DIR: ${{ runner.temp }}/security-binaries
        run: bash "$WORKFLOWS_DIR/scripts/security/binaries-fetch.sh" "$RELEASE_TAG" "$BINARIES_DIR"
      - name: Check the release binaries
        id: scan
        timeout-minutes: 15
        env:
          SECURITY_JOB: binaries
        run: bash "$WORKFLOWS_DIR/scripts/security/run-job.sh" "$SECURITY_JOB"
      - name: Upload SARIF
        if: ${{ !cancelled() && steps.scan.conclusion != 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.settings.outputs.artifact-prefix }}security-sarif-binaries
          path: ${{ inputs.working-directory }}/.security/binaries.sarif
          if-no-files-found: error
          retention-days: 7
          overwrite: true
  # History and tags, not a shallow clone: the review diffs against the pull
  # request's base, or against the last release tag on the release pull request.
  review:
    name: Review
    needs: settings
    if: ${{ inputs.review && needs.settings.outputs.enabled == 'true' && needs.settings.outputs.review == 'true' }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 25
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
          fetch-depth: 0
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Publish environment-variables
        env:
          WORKFLOWS_BUILD_ENV: ${{ inputs.environment-variables }}
        run: bash ".workflows/scripts/release/build-env.sh"
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          install: 'true'
      - name: Review the change
        id: scan
        timeout-minutes: 20
        env:
          SECURITY_JOB: review
          # Empty outside a pull request; the reviewer then falls back to
          # the last release tag (review-full-range) or the merge base with main.
          SECURITY_REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
          SECURITY_REVIEW_FULL_RANGE: ${{ inputs.review-full-range }}
          # The keys reach this one step and nothing else in the job: the
          # runner is the only reader, and a fork's run has neither.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash "$WORKFLOWS_DIR/scripts/security/run-job.sh" "$SECURITY_JOB"
      - name: Upload SARIF
        if: ${{ !cancelled() && steps.scan.conclusion != 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.settings.outputs.artifact-prefix }}security-sarif-review
          path: ${{ inputs.working-directory }}/.security/review.sarif
          if-no-files-found: error
          retention-days: 7
          overwrite: true
  # OpenAnt is built from the commit review-codebase.sh pins, into a
  # cache keyed on that file, so moving the pin is what rebuilds it.
  review-codebase:
    name: Review codebase
    needs: settings
    if: ${{ inputs.review-codebase && needs.settings.outputs.enabled == 'true' && needs.settings.outputs.review-codebase == 'true' }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Publish environment-variables
        env:
          WORKFLOWS_BUILD_ENV: ${{ inputs.environment-variables }}
        run: bash ".workflows/scripts/release/build-env.sh"
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          install: 'true'
      - name: Cache the OpenAnt build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/openant
            ~/.openant/venv
          key: openant-${{ runner.os }}-${{ hashFiles('.workflows/scripts/security/review-codebase.sh') }}
      - name: Scan with OpenAnt
        id: scan
        timeout-minutes: 50
        env:
          SECURITY_JOB: review-codebase
          # The keys reach this one step and nothing else in the job: the
          # runner is the only reader, and a fork's run has neither.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash "$WORKFLOWS_DIR/scripts/security/run-job.sh" "$SECURITY_JOB"
      - name: Upload SARIF
        if: ${{ !cancelled() && steps.scan.conclusion != 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.settings.outputs.artifact-prefix }}security-sarif-review-codebase
          path: ${{ inputs.working-directory }}/.security/review-codebase.sarif
          if-no-files-found: error
          retention-days: 7
          overwrite: true
  verdict:
    name: Verdict
    needs: [settings, dependencies, code, policy, sbom, bundle, mobile, binaries, review, review-codebase]
    # !cancelled(), not success(): a scanner that was switched off is skipped and
    # a scanner that crashed is failed, and both still have to reach the verdict -
    # "one scanner died" and "nothing was found" must never read the same. A
    # crashed scanner keeps the run red on its own job; this one adds the summary.
    if: ${{ !cancelled() && needs.settings.result == 'success' && needs.settings.outputs.enabled == 'true' }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 15
    # The only escalation in this workflow, and the reason a caller has to grant
    # anything at all. Naming `permissions:` resets the unnamed scopes to none,
    # so contents: read is re-declared or the checkouts below lose it.
    permissions:
      contents: read
      actions: read # workflow metadata for the SARIF upload
      security-events: write # upload the merged SARIF to code scanning
    outputs:
      verdict: ${{ steps.output.outputs.verdict }}
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      # Before Setup and before any consumer script, in every job: a SECURITY_*
      # twin in environment-variables changes what the resolver returns, what a runner does
      # and what the verdict applies, so all of them have to see the same values.
      - name: Publish environment-variables
        env:
          WORKFLOWS_BUILD_ENV: ${{ inputs.environment-variables }}
        run: bash ".workflows/scripts/release/build-env.sh"
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          install: 'true'
      # merge-multiple is safe here only because each artifact carries a file
      # named after its own job - dependencies.sarif, code.sarif, and so on. Two
      # artifacts carrying one filename would make the merge a coin toss, which
      # is what the release's per-platform build-info.json exists to avoid.
      #
      # Guarded on at least one scanner having succeeded: download-artifact fails
      # when its pattern matches nothing, and "every scanner was switched off" is
      # a case verdict.sh reports properly on its own.
      - name: Download scanner SARIF
        if: >-
          ${{ needs.dependencies.result == 'success' || needs.code.result == 'success'
          || needs.policy.result == 'success' || needs.sbom.result == 'success'
          || needs.bundle.result == 'success' || needs.mobile.result == 'success'
          || needs.binaries.result == 'success' || needs.review.result == 'success'
          || needs.review-codebase.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          # security-sarif-*, not security-*: the bill of materials is an
          # artifact for people, and the verdict reads SARIF only. The prefix
          # leads the pattern, and the pattern matches the whole name, so a
          # second call in the same run (another prefix, or none) is never
          # merged in; artifact-prefix.sh refuses the prefixes that could be.
          pattern: ${{ needs.settings.outputs.artifact-prefix }}security-sarif-*
          merge-multiple: true
          path: ${{ inputs.working-directory }}/.security
      - name: Verdict
        id: verdict
        run: bash "$WORKFLOWS_DIR/scripts/security/verdict.sh"
      # From the default branch only. Every SARIF upload makes code scanning add
      # a check of its own under GitHub's fixed "Code scanning results" heading,
      # one per tool, and that heading cannot be renamed. On a pull request those
      # checks only repeated the Security / * jobs above them, so a change is
      # judged by the Verdict job and its annotations, and the Security tab is
      # fed from the default branch, where the alerts are tracked anyway. A fork
      # pull request, whose token is read-only, falls under the same rule.
      #
      # !cancelled(), so a verdict that failed on findings still gets those
      # findings into the Security tab - that run is exactly the one where they
      # matter. hashFiles guards the case where nothing was produced at all;
      # upload-sarif dies on an empty directory. A schedule event carries no
      # repository in its payload, hence the fallback to main.
      - name: Label the SARIF by job
        if: >-
          ${{ !cancelled() && inputs.sarif-upload-enabled
          && github.event_name != 'pull_request'
          && github.ref_name == (github.event.repository.default_branch || 'main')
          && hashFiles(format('{0}/.security/*.sarif', inputs.working-directory)) != '' }}
        run: bash "$WORKFLOWS_DIR/scripts/security/label-sarif.sh"
      - name: Upload to code scanning
        if: >-
          ${{ !cancelled() && inputs.sarif-upload-enabled
          && github.event_name != 'pull_request'
          && github.ref_name == (github.event.repository.default_branch || 'main')
          && hashFiles(format('{0}/.security/*.sarif', inputs.working-directory)) != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ inputs.working-directory }}/.security
          # Per call, like the artifacts: two uploads under one category for one
          # commit replace each other's alerts. Empty prefix, the old `security`.
          category: ${{ needs.settings.outputs.artifact-prefix }}security
      # Not a warning: leaving the upload to the default branch is the design,
      # and an annotation on every pull request would be noise of its own. The
      # summary says where the findings went instead.
      - name: Note the branch upload
        if: >-
          ${{ !cancelled() && inputs.sarif-upload-enabled
          && (github.event_name == 'pull_request'
              || github.ref_name != (github.event.repository.default_branch || 'main')) }}
        env:
          REASON: code scanning takes findings from the default branch only
        run: bash "$WORKFLOWS_DIR/scripts/security/sarif-upload-skipped.sh" --summary-only "$REASON"
      - name: Report the disabled upload
        if: ${{ !cancelled() && !inputs.sarif-upload-enabled }}
        env:
          REASON: the caller passed sarif-upload-enabled false
        run: bash "$WORKFLOWS_DIR/scripts/security/sarif-upload-skipped.sh" "$REASON"
      # The badge's input. Its own step, so the output exists even when the
      # Verdict step failed on findings - that run is exactly the one the badge
      # must show - and last, so it does not split the steps above.
      # contains(needs.*.result, 'failure') catches a scanner that crashed and
      # so reported nothing to the merge.
      - name: Verdict output
        id: output
        if: ${{ !cancelled() }}
        env:
          SCANNER_FAILED: ${{ contains(needs.*.result, 'failure') }}
          VERDICT_OUTCOME: ${{ steps.verdict.outcome }}
        # .workflows/, not $WORKFLOWS_DIR: Setup exports that, and this step
        # must still report fail when Setup is what failed.
        run: bash ".workflows/scripts/security/verdict-output.sh"
