name: Security
# The consumer's security scanners, one job each so a red run names the scanner,
# and one verdict that merges their SARIF and applies the threshold.
#
# Every scanner, the settings resolver and the merge live in the CONSUMER, under
# scripts/security/. `make check-security` runs the same files, so a green
# laptop and a green pipeline are the same claim. This workflow owns only what
# exists in CI: the job graph, the permissions, the artifact passing, the upload
# to code scanning and the step summary. It carries no fallback runner - a job
# that is switched on but whose runner is missing fails loudly, by name.
#
# A scanner runs where what it reads exists, so a caller turns on the tier it
# is: a pull request allows deps, code, policy and review; the release pull
# request adds bundle, openant and review-full-range; the production dispatch
# allows binaries, mobile, bundle and sbom with release-tag set. The consumer's
# security-policy.json still decides which of those actually run.
on:
  workflow_call:
    inputs:
      repository:
        description: Consumer repository to check out (defaults to the caller's repository)
        type: string
        default: ''
      ref:
        description: Consumer ref to check out (empty lets actions/checkout resolve the correct ref, including PR merge refs)
        type: string
        default: ''
      working-directory:
        description: Consumer directory relative to GITHUB_WORKSPACE
        type: string
        default: '.'
      linux-runner:
        description: Runner label for every job in this workflow
        type: string
        default: 'ubuntu-latest'
      macos-runner:
        description: Runner label for macOS jobs (unused by this workflow; carried for input-set consistency across the family)
        type: string
        default: 'macos-26'
      native-cache-version:
        description: Native cache key prefix (unused by this workflow; carried for input-set consistency across the family)
        type: string
        default: 'v1'
      deps:
        description: >-
          Allow the dependency scanner (the consumer's `check-security-deps`).
          A switch, not a setting: whether it actually runs is this AND the
          consumer's security-policy.json, so a caller may narrow and never widen.
        type: boolean
        default: true
      code:
        description: Allow the source scanner (the consumer's `check-security-code`); the effective setting is this and security-policy.json together
        type: boolean
        default: true
      policy:
        description: Allow the install-policy scanner (the consumer's `check-security-policy`); the effective setting is this and security-policy.json together
        type: boolean
        default: true
      sbom:
        description: >-
          Allow the bill of materials (the consumer's `check-security-sbom`, a
          CycloneDX SBOM from the lockfile, kept as the security-sbom artifact).
          Off by default: it belongs to the production tier.
        type: boolean
        default: false
      bundle:
        description: >-
          Allow the bundle scanner (the consumer's `check-security-bundle`: exports
          the JavaScript bundle and reads what it gives away). Minutes, so off by
          default; the release pull request and the production dispatch turn it on.
        type: boolean
        default: false
      mobile:
        description: >-
          Allow the native project scanner (the consumer's `check-security-mobile`:
          mobsfscan over a fresh prebuild). Off by default: production tier.
        type: boolean
        default: false
      binaries:
        description: >-
          Allow the MASTG checks over the release's built binaries (the consumer's
          `check-security-binaries`). Needs release-tag. Off by default: binaries
          only exist once a release is built.
        type: boolean
        default: false
      review:
        description: >-
          Allow the LLM security review of the change (the consumer's
          `check-security-review`). The consumer's policy keeps it off until a
          provider and a key are configured; with no key it reports skipped.
        type: boolean
        default: false
      openant:
        description: >-
          Allow the OpenAnt LLM scan of the codebase (the consumer's
          `check-security-review-codebase`). Minutes and tokens, so the release pull
          request is the tier that turns it on.
        type: boolean
        default: false
      review-full-range:
        description: >-
          Review everything since the last release tag rather than the pull
          request's own diff - what the release pull request asks for. A switch,
          like the job inputs: the tag itself is found by the consumer's script.
        type: boolean
        default: false
      release-tag:
        description: >-
          The release whose .apk, .aab and .ipa assets the binaries job checks
          (e.g. v1.2.3). Required when binaries is on; ignored otherwise.
        type: string
        default: ''
      build-env:
        description: >-
          Non-secret environment for every job, as a flat JSON object:
          SECURITY_LLM_PROVIDER, SECURITY_LLM_MODEL, SECURITY_LLM_EFFORT,
          SECURITY_LLM_EXTRA_PARAMS, OPENAI_BASE_URL, and any SECURITY_* twin of a
          security-policy.json setting. Keys only are logged.
        type: string
        default: '{}'
      sarif-upload:
        description: >-
          Upload the SARIF to code scanning, from the default branch only (a
          pull request is judged by the Verdict job and its annotations). Off
          makes the run say so in the summary rather than go quiet; the verdict
          still applies the threshold either way.
        type: boolean
        default: true
    secrets:
      consumer-token:
        description: PAT with read access to a private consumer repository; falls back to the caller's github.token (works for a public consumer)
        required: false
      OPENAI_API_KEY:
        description: Key for an OpenAI or OpenAI-compatible provider (OPENAI_BASE_URL). Reaches the review and openant scan steps only
        required: false
      ANTHROPIC_API_KEY:
        description: Key for Anthropic. Reaches the review and openant scan steps only
        required: false
permissions:
  contents: read
jobs:
  # A job-level `if:` cannot read a file, and security-policy.json is a file in
  # the consumer. So the policy is resolved once, here, by the consumer's own
  # config.mjs - not by a second implementation of the same resolution order -
  # and published as outputs the other jobs' `if:` expressions can read.
  config:
    name: Config
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 10
    outputs:
      enabled: ${{ steps.resolve.outputs.enabled }}
      deps: ${{ steps.resolve.outputs.deps }}
      code: ${{ steps.resolve.outputs.code }}
      policy: ${{ steps.resolve.outputs.policy }}
      sbom: ${{ steps.resolve.outputs.sbom }}
      bundle: ${{ steps.resolve.outputs.bundle }}
      mobile: ${{ steps.resolve.outputs.mobile }}
      binaries: ${{ steps.resolve.outputs.binaries }}
      review: ${{ steps.resolve.outputs.review }}
      openant: ${{ steps.resolve.outputs.openant }}
      severity: ${{ steps.resolve.outputs.severity }}
      fail-on: ${{ steps.resolve.outputs.fail-on }}
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      # Before Setup and before any consumer script, in every job: a SECURITY_*
      # twin in build-env changes what config.mjs resolves, what a runner does
      # and what the verdict applies, so all of them have to see the same values.
      - name: Publish build-env
        env:
          WORKFLOWS_BUILD_ENV: ${{ inputs.build-env }}
        run: bash ".workflows/scripts/release/build-env.sh"
      # Setup here, unlike check-code.yml's contract job, which deliberately runs
      # on the runner image's own node. config.mjs guards its command-line entry
      # with `import.meta.main`, which is undefined before Node 24: an older node
      # would run the file, print nothing and exit 0, and empty output read as
      # "nothing enabled" would switch the whole gate off in silence. The
      # consumer's .mise.toml pin is what makes that impossible.
      #
      # install: 'false' - no job in this workflow reads node_modules. The
      # scanners read source, pnpm-lock.yaml and pnpm-workspace.yaml, and the
      # consumer's scripts/security/*.mjs are zero-dependency node. Quoted,
      # because the composite action's inputs are strings.
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          install: 'false'
      - name: Resolve the security policy
        id: resolve
        run: bash "$WORKFLOWS_DIR/scripts/security/settings.sh"
  deps:
    name: Dependencies
    needs: config
    # The AND of the caller's tier and the consumer's policy. A skipped job is
    # green, so a repository that has turned the gate off never holds up a
    # required check.
    if: ${{ inputs.deps && needs.config.outputs.enabled == 'true' && needs.config.outputs.deps == 'true' }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      # Before Setup and before any consumer script, in every job: a SECURITY_*
      # twin in build-env changes what config.mjs resolves, what a runner does
      # and what the verdict applies, so all of them have to see the same values.
      - name: Publish build-env
        env:
          WORKFLOWS_BUILD_ENV: ${{ inputs.build-env }}
        run: bash ".workflows/scripts/release/build-env.sh"
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          install: 'false'
      - name: Scan dependencies
        id: scan
        env:
          SECURITY_JOB: deps
        run: bash "$WORKFLOWS_DIR/scripts/security/run-job.sh" "$SECURITY_JOB"
      # Same guard as check-e2e.yml's platform uploads: a failed scan has no
      # SARIF, and if-no-files-found: error would stack a second red step on top
      # of the real one. if-no-files-found stays `error` because a *successful*
      # scan with no SARIF is the silence run-job.sh already refuses.
      - name: Upload SARIF
        if: ${{ !cancelled() && steps.scan.conclusion != 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: security-sarif-deps
          path: ${{ inputs.working-directory }}/.security/deps.sarif
          if-no-files-found: error
          retention-days: 7
  code:
    name: Code
    needs: config
    if: ${{ inputs.code && needs.config.outputs.enabled == 'true' && needs.config.outputs.code == 'true' }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 25
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      # Before Setup and before any consumer script, in every job: a SECURITY_*
      # twin in build-env changes what config.mjs resolves, what a runner does
      # and what the verdict applies, so all of them have to see the same values.
      - name: Publish build-env
        env:
          WORKFLOWS_BUILD_ENV: ${{ inputs.build-env }}
        run: bash ".workflows/scripts/release/build-env.sh"
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          install: 'false'
      # The longest of the three: the consumer's code.sh fetches its registry
      # packs on every invocation, so this step can hang on the Semgrep registry
      # rather than on anything in the repository. A bound of its own, so the
      # log names the step instead of the job.
      - name: Scan source
        id: scan
        timeout-minutes: 20
        env:
          SECURITY_JOB: code
        run: bash "$WORKFLOWS_DIR/scripts/security/run-job.sh" "$SECURITY_JOB"
      - name: Upload SARIF
        if: ${{ !cancelled() && steps.scan.conclusion != 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: security-sarif-code
          path: ${{ inputs.working-directory }}/.security/code.sarif
          if-no-files-found: error
          retention-days: 7
  policy:
    name: Policy
    needs: config
    if: ${{ inputs.policy && needs.config.outputs.enabled == 'true' && needs.config.outputs.policy == 'true' }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      # Before Setup and before any consumer script, in every job: a SECURITY_*
      # twin in build-env changes what config.mjs resolves, what a runner does
      # and what the verdict applies, so all of them have to see the same values.
      - name: Publish build-env
        env:
          WORKFLOWS_BUILD_ENV: ${{ inputs.build-env }}
        run: bash ".workflows/scripts/release/build-env.sh"
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          install: 'false'
      - name: Scan the install policy
        id: scan
        env:
          SECURITY_JOB: policy
        run: bash "$WORKFLOWS_DIR/scripts/security/run-job.sh" "$SECURITY_JOB"
      - name: Upload SARIF
        if: ${{ !cancelled() && steps.scan.conclusion != 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: security-sarif-policy
          path: ${{ inputs.working-directory }}/.security/policy.sarif
          if-no-files-found: error
          retention-days: 7
  # A record rather than a scan: what the release pins, kept long enough to
  # answer "did we ship the vulnerable version?" when an advisory lands later.
  sbom:
    name: Bill of Materials
    needs: config
    if: ${{ inputs.sbom && needs.config.outputs.enabled == 'true' && needs.config.outputs.sbom == 'true' }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Publish build-env
        env:
          WORKFLOWS_BUILD_ENV: ${{ inputs.build-env }}
        run: bash ".workflows/scripts/release/build-env.sh"
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          install: 'false'
      - name: Write the bill of materials
        id: scan
        timeout-minutes: 10
        env:
          SECURITY_JOB: sbom
        run: bash "$WORKFLOWS_DIR/scripts/security/run-job.sh" "$SECURITY_JOB"
      - name: Upload SARIF
        if: ${{ !cancelled() && steps.scan.conclusion != 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: security-sarif-sbom
          path: ${{ inputs.working-directory }}/.security/sbom.sarif
          if-no-files-found: error
          retention-days: 7
      - name: Upload the bill of materials
        if: ${{ !cancelled() && steps.scan.conclusion != 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: security-sbom
          path: ${{ inputs.working-directory }}/.security/sbom.cdx.json
          if-no-files-found: error
          retention-days: 90
  # The two jobs here that install: expo export and expo prebuild both need
  # node_modules. Every other job reads files and skips the install.
  bundle:
    name: Bundle
    needs: config
    if: ${{ inputs.bundle && needs.config.outputs.enabled == 'true' && needs.config.outputs.bundle == 'true' }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Publish build-env
        env:
          WORKFLOWS_BUILD_ENV: ${{ inputs.build-env }}
        run: bash ".workflows/scripts/release/build-env.sh"
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          install: 'true'
      - name: Scan the exported bundle
        id: scan
        timeout-minutes: 25
        env:
          SECURITY_JOB: bundle
        run: bash "$WORKFLOWS_DIR/scripts/security/run-job.sh" "$SECURITY_JOB"
      - name: Upload SARIF
        if: ${{ !cancelled() && steps.scan.conclusion != 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: security-sarif-bundle
          path: ${{ inputs.working-directory }}/.security/bundle.sarif
          if-no-files-found: error
          retention-days: 7
  mobile:
    name: Mobile
    needs: config
    if: ${{ inputs.mobile && needs.config.outputs.enabled == 'true' && needs.config.outputs.mobile == 'true' }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 40
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Publish build-env
        env:
          WORKFLOWS_BUILD_ENV: ${{ inputs.build-env }}
        run: bash ".workflows/scripts/release/build-env.sh"
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          install: 'true'
      - name: Scan a fresh prebuild
        id: scan
        timeout-minutes: 35
        env:
          SECURITY_JOB: mobile
        run: bash "$WORKFLOWS_DIR/scripts/security/run-job.sh" "$SECURITY_JOB"
      - name: Upload SARIF
        if: ${{ !cancelled() && steps.scan.conclusion != 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: security-sarif-mobile
          path: ${{ inputs.working-directory }}/.security/mobile.sarif
          if-no-files-found: error
          retention-days: 7
  # The release's own assets, not a rebuild: what the stores receive is what is
  # checked. binaries-fetch.sh puts them in a directory and hands its path to
  # the consumer's runner through SECURITY_BINARIES_DIR.
  binaries:
    name: Binaries
    needs: config
    if: ${{ inputs.binaries && needs.config.outputs.enabled == 'true' && needs.config.outputs.binaries == 'true' }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Publish build-env
        env:
          WORKFLOWS_BUILD_ENV: ${{ inputs.build-env }}
        run: bash ".workflows/scripts/release/build-env.sh"
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          install: 'false'
      - name: Download the release binaries
        env:
          GH_TOKEN: ${{ secrets.consumer-token || github.token }}
          GH_REPO: ${{ inputs.repository || github.repository }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          BINARIES_DIR: ${{ runner.temp }}/security-binaries
        run: bash "$WORKFLOWS_DIR/scripts/security/binaries-fetch.sh" "$RELEASE_TAG" "$BINARIES_DIR"
      - name: Check the release binaries
        id: scan
        timeout-minutes: 15
        env:
          SECURITY_JOB: binaries
        run: bash "$WORKFLOWS_DIR/scripts/security/run-job.sh" "$SECURITY_JOB"
      - name: Upload SARIF
        if: ${{ !cancelled() && steps.scan.conclusion != 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: security-sarif-binaries
          path: ${{ inputs.working-directory }}/.security/binaries.sarif
          if-no-files-found: error
          retention-days: 7
  # History and tags, not a shallow clone: the review diffs against the pull
  # request's base, or against the last release tag on the release pull request.
  review:
    name: Review
    needs: config
    if: ${{ inputs.review && needs.config.outputs.enabled == 'true' && needs.config.outputs.review == 'true' }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 25
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
          fetch-depth: 0
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Publish build-env
        env:
          WORKFLOWS_BUILD_ENV: ${{ inputs.build-env }}
        run: bash ".workflows/scripts/release/build-env.sh"
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          install: 'false'
      - name: Review the change
        id: scan
        timeout-minutes: 20
        env:
          SECURITY_JOB: review
          # Empty outside a pull request; the consumer's script then falls back to
          # the last release tag (review-full-range) or the merge base with main.
          SECURITY_REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
          SECURITY_REVIEW_FULL_RANGE: ${{ inputs.review-full-range }}
          # The keys reach this one step and nothing else in the job: a
          # consumer script is the only reader, and a fork's run has neither.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash "$WORKFLOWS_DIR/scripts/security/run-job.sh" "$SECURITY_JOB"
      - name: Upload SARIF
        if: ${{ !cancelled() && steps.scan.conclusion != 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: security-sarif-review
          path: ${{ inputs.working-directory }}/.security/review.sarif
          if-no-files-found: error
          retention-days: 7
  # OpenAnt is built from the commit the consumer's openant.sh pins, into a
  # cache keyed on that file, so moving the pin is what rebuilds it.
  openant:
    name: OpenAnt
    needs: config
    if: ${{ inputs.openant && needs.config.outputs.enabled == 'true' && needs.config.outputs.openant == 'true' }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Publish build-env
        env:
          WORKFLOWS_BUILD_ENV: ${{ inputs.build-env }}
        run: bash ".workflows/scripts/release/build-env.sh"
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          install: 'false'
      - name: Cache the OpenAnt build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/openant
            ~/.openant/venv
          key: openant-${{ runner.os }}-${{ hashFiles(format('{0}/scripts/security/openant.sh', inputs.working-directory)) }}
      - name: Scan with OpenAnt
        id: scan
        timeout-minutes: 50
        env:
          SECURITY_JOB: openant
          # The keys reach this one step and nothing else in the job: a
          # consumer script is the only reader, and a fork's run has neither.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash "$WORKFLOWS_DIR/scripts/security/run-job.sh" "$SECURITY_JOB"
      - name: Upload SARIF
        if: ${{ !cancelled() && steps.scan.conclusion != 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: security-sarif-openant
          path: ${{ inputs.working-directory }}/.security/openant.sarif
          if-no-files-found: error
          retention-days: 7
  verdict:
    name: Verdict
    needs: [config, deps, code, policy, sbom, bundle, mobile, binaries, review, openant]
    # !cancelled(), not success(): a scanner that was switched off is skipped and
    # a scanner that crashed is failed, and both still have to reach the verdict -
    # "one scanner died" and "nothing was found" must never read the same. A
    # crashed scanner keeps the run red on its own job; this one adds the summary.
    if: ${{ !cancelled() && needs.config.result == 'success' && needs.config.outputs.enabled == 'true' }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 15
    # The only escalation in this workflow, and the reason a caller has to grant
    # anything at all. Naming `permissions:` resets the unnamed scopes to none,
    # so contents: read is re-declared or the checkouts below lose it.
    permissions:
      contents: read
      actions: read # workflow metadata for the SARIF upload
      security-events: write # upload the merged SARIF to code scanning
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      # Before Setup and before any consumer script, in every job: a SECURITY_*
      # twin in build-env changes what config.mjs resolves, what a runner does
      # and what the verdict applies, so all of them have to see the same values.
      - name: Publish build-env
        env:
          WORKFLOWS_BUILD_ENV: ${{ inputs.build-env }}
        run: bash ".workflows/scripts/release/build-env.sh"
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          install: 'false'
      # merge-multiple is safe here only because each artifact carries a file
      # named after its own job - deps.sarif, code.sarif, and so on. Two
      # artifacts carrying one filename would make the merge a coin toss, which
      # is what the release's per-platform build-info.json exists to avoid.
      #
      # Guarded on at least one scanner having succeeded: download-artifact fails
      # when its pattern matches nothing, and "every scanner was switched off" is
      # a case verdict.sh reports properly on its own.
      - name: Download scanner SARIF
        if: >-
          ${{ needs.deps.result == 'success' || needs.code.result == 'success'
          || needs.policy.result == 'success' || needs.sbom.result == 'success'
          || needs.bundle.result == 'success' || needs.mobile.result == 'success'
          || needs.binaries.result == 'success' || needs.review.result == 'success'
          || needs.openant.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          # security-sarif-*, not security-*: the bill of materials is an
          # artifact for people, and the verdict reads SARIF only.
          pattern: security-sarif-*
          merge-multiple: true
          path: ${{ inputs.working-directory }}/.security
      - name: Verdict
        id: verdict
        run: bash "$WORKFLOWS_DIR/scripts/security/verdict.sh"
      # From the default branch only. Every SARIF upload makes code scanning add
      # a check of its own under GitHub's fixed "Code scanning results" heading,
      # one per tool, and that heading cannot be renamed. On a pull request those
      # checks only repeated the Security / * jobs above them, so a change is
      # judged by the Verdict job and its annotations, and the Security tab is
      # fed from the default branch, where the alerts are tracked anyway. A fork
      # pull request, whose token is read-only, falls under the same rule.
      #
      # !cancelled(), so a verdict that failed on findings still gets those
      # findings into the Security tab - that run is exactly the one where they
      # matter. hashFiles guards the case where nothing was produced at all;
      # upload-sarif dies on an empty directory. A schedule event carries no
      # repository in its payload, hence the fallback to main.
      - name: Label the SARIF by job
        if: >-
          ${{ !cancelled() && inputs.sarif-upload
          && github.event_name != 'pull_request'
          && github.ref_name == (github.event.repository.default_branch || 'main')
          && hashFiles(format('{0}/.security/*.sarif', inputs.working-directory)) != '' }}
        run: bash "$WORKFLOWS_DIR/scripts/security/label-sarif.sh"
      - name: Upload to code scanning
        if: >-
          ${{ !cancelled() && inputs.sarif-upload
          && github.event_name != 'pull_request'
          && github.ref_name == (github.event.repository.default_branch || 'main')
          && hashFiles(format('{0}/.security/*.sarif', inputs.working-directory)) != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ inputs.working-directory }}/.security
          category: security
      # Not a warning: leaving the upload to the default branch is the design,
      # and an annotation on every pull request would be noise of its own. The
      # summary says where the findings went instead.
      - name: Note the branch upload
        if: >-
          ${{ !cancelled() && inputs.sarif-upload
          && (github.event_name == 'pull_request'
              || github.ref_name != (github.event.repository.default_branch || 'main')) }}
        env:
          REASON: code scanning takes findings from the default branch only
        run: bash "$WORKFLOWS_DIR/scripts/security/sarif-upload-skipped.sh" --summary-only "$REASON"
      - name: Report the disabled upload
        if: ${{ !cancelled() && !inputs.sarif-upload }}
        env:
          REASON: the caller passed sarif-upload false
        run: bash "$WORKFLOWS_DIR/scripts/security/sarif-upload-skipped.sh" "$REASON"
