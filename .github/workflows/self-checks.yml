name: Self checks
# The gates `make check` runs, one job each, so a run graph says which gate
# failed without anyone opening a log. Called from self-ci.yml, which is what
# turns these names into `Checks / CI`, `Checks / Secrets` and so on.
#
# `make check` itself is unchanged and stays the local gate (the pre-push hook
# runs it). The two lists are held together by a case in
# test/self-workflows.bats: every target `check:` depends on has to be run by a
# job here or in self-unit.yml, or the suite fails. Without it a new gate would
# be enforced on laptops and in no CI job at all - the exact failure this split
# would otherwise introduce.
#
# Every job that runs make times it (see the Makefile's TIMED): TIMING_RUN
# names the job's run under .timing/, and its last two steps print where the
# time went - into the job summary - and upload .timing/ as timing-<job>
# (.timing/latest is only a link to the run beside it). Both run after a
# failure too, when the numbers matter most, and the report never fails a job
# of its own: timing is advice, not a gate.
on:
  workflow_call:
    # Set by self-ci.yml's `changes` job. True by default, so a caller that
    # passes nothing runs every gate.
    inputs:
      ci:
        description: Run check-ci (shellcheck, actionlint and zizmor)
        type: boolean
        default: true
      versions:
        description: Run the version checks
        type: boolean
        default: true
# A called workflow's permissions block replaces the caller's grant rather than
# narrowing it, so read is stated here as well as in self-ci.yml.
permissions: { contents: read }
jobs:
  ci:
    name: CI
    if: ${{ inputs.ci }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env: { TIMING_RUN: "${{ github.run_id }}-${{ github.job }}" }
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: make check-ci
      - name: Timing report
        if: always()
        continue-on-error: true
        run: node scripts/self/timing-report.mjs
      - name: Upload timing
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: timing-${{ github.job }}
          path: |
            .timing/
            !.timing/latest
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env: { TIMING_RUN: "${{ github.run_id }}-${{ github.job }}" }
    steps:
      # fetch-depth: 0, because `make check-secrets` scans the whole history with
      # gitleaks and refuses a shallow clone. The other jobs here take the
      # default single commit.
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: jdx/mise-action@v5
      - run: make check-secrets
      - name: Timing report
        if: always()
        continue-on-error: true
        run: node scripts/self/timing-report.mjs
      - name: Upload timing
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: timing-${{ github.job }}
          path: |
            .timing/
            !.timing/latest
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true
  versions:
    name: Versions
    if: ${{ inputs.versions }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env: { TIMING_RUN: "${{ github.run_id }}-${{ github.job }}" }
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: make check-version-pins check-tool-versions
      - name: Timing report
        if: always()
        continue-on-error: true
        run: node scripts/self/timing-report.mjs
      - name: Upload timing
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: timing-${{ github.job }}
          path: |
            .timing/
            !.timing/latest
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true
  spell:
    name: Spell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env: { TIMING_RUN: "${{ github.run_id }}-${{ github.job }}" }
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: make check-spell
      - name: Timing report
        if: always()
        continue-on-error: true
        run: node scripts/self/timing-report.mjs
      - name: Upload timing
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: timing-${{ github.job }}
          path: |
            .timing/
            !.timing/latest
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true
  commits:
    name: Commits
    # A called workflow sees the caller's event, so this is the PR check it
    # looks like. self-ci.yml is also started by name on the release PR's
    # branch (workflow_dispatch), where there is no PR title to lint and this
    # job is skipped.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - env: { PR_TITLE: "${{ github.event.pull_request.title }}" }
        run: bash scripts/checks/commits.sh
