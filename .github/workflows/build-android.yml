name: Build Android
on:
  workflow_call:
    inputs:
      repository:
        description: Consumer repository to check out (defaults to the caller's repository)
        type: string
        default: ''
      ref:
        description: Consumer ref to check out (empty lets actions/checkout resolve the correct ref, including PR merge refs)
        type: string
        default: ''
      working-directory:
        description: Consumer directory relative to GITHUB_WORKSPACE
        type: string
        default: '.'
      linux-runner:
        description: Runner label for the build job
        type: string
        default: 'ubuntu-latest'
      macos-runner:
        description: Runner label for macOS jobs (unused by this workflow; carried for input-set consistency across the family)
        type: string
        default: 'macos-26'
      default-branch:
        description: >-
          Fully qualified ref of the branch allowed to WRITE the Gradle cache
          (every other ref reads it). Only the default branch should write, or
          concurrent branches would evict each other's entries.
        type: string
        default: 'refs/heads/main'
      native-cache-version:
        description: Native cache key prefix (unused by this workflow; carried for input-set consistency across the family)
        type: string
        default: 'v1'
      native-stack:
        description: >-
          The app's native stack: expo (ios/ and android/ are expo prebuild
          output) or bare (ios/ and android/ are committed source). Empty, the
          default, detects it: expo when package.json depends on expo and git
          does not track ios/, bare otherwise
        type: string
        default: ''
      environment:
        description: GitHub Environment whose secrets/approvals gate this build (empty means no environment)
        type: string
        default: ''
      version:
        description: App version to stamp into the build (wire it to build-prepare's `version` output)
        type: string
        required: true
      build-number:
        description: Build number to stamp into the build (wire it to build-prepare's `build-number` output)
        type: string
        required: true
      stage:
        description: Release stage the lanes build for (internal/beta/production)
        type: string
        default: 'internal'
      android-package:
        description: Application id passed to the lanes as ANDROID_PACKAGE
        type: string
        required: true
      ios-bundle-id:
        description: Bundle identifier passed to the lanes as IOS_BUNDLE_ID. Required even on the Android build - the consumer's Fastfile asserts all five contract variables in `before_all`, for every lane on both platforms
        type: string
        required: true
      ios-scheme:
        description: Xcode scheme passed to the lanes as IOS_SCHEME. Required for the same reason as `ios-bundle-id`
        type: string
        required: true
      android-signing-enabled:
        description: >-
          Sign with the upload keystore. Off lets the release build fall back to
          the debug keystore (the consumer's signing config plugin does this and
          warns that it did), which still produces an .aab, a universal .apk and
          a mapping file and needs no Play credentials. Both artifacts carry the
          project debug certificate, so they install for a smoke test and no
          store will take them. The consumer's build lane must name that
          keystore to bundletool: given no --ks it falls back to
          ~/.android/debug.keystore, which a developer machine has and a runner
          does not, and then emits an unsigned APK without saying so.
        type: boolean
        default: true
      verify:
        description: Run the `android verify` lane after `android build`
        type: boolean
        default: true
      build-info-artifact:
        description: Artifact produced by build-prepare that carries build-info.json and the store notes
        type: string
        default: 'build-info'
      aab-artifact:
        description: Artifact name for the signed .aab
        type: string
        default: 'android-aab'
      apk-artifact:
        description: Artifact name for the signed .apk
        type: string
        default: 'android-apk'
      mapping-artifact:
        description: Artifact name for the R8/ProGuard mapping file
        type: string
        default: 'android-mapping'
      mapping-path:
        description: Consumer-relative glob for the R8/ProGuard mapping file; override it when the consumer uses a non-default variant output directory, or its Play crash reports stay unreadable
        type: string
        default: 'android/app/build/outputs/mapping/**/mapping.txt'
      bundletool-version:
        description: bundletool release the `android build` lane derives the universal APK with (kept equal to scripts/lib/versions.sh BUNDLETOOL_VERSION; enforced by scripts/self/check-version-pins.sh)
        type: string
        default: '1.17.2'
      bundletool-sha256:
        description: Expected sha256 of the bundletool jar; empty skips verification (Google publishes no checksum file, so this is opt-in)
        type: string
        default: ''
      fastlane-directory:
        description: >-
          The directory holding the Fastfile and the store metadata, relative to
          working-directory. fastlane only finds a directory named fastlane or
          .fastlane, so it may move (mobile/fastlane) but not be renamed
        type: string
        default: 'fastlane'
      environment-variables:
        description: 'Flat JSON object of non-secret build environment variables published before prebuild, the lanes and the scripts (e.g. {"OTA_ENABLED":"true","EXPO_UPDATES_URL":"https://..."}). Keys must be UPPER_SNAKE and anything that reads as a credential is refused - this is a workflow input, so GitHub neither masks nor hides it'
        type: string
        default: '{}'
    secrets:
      consumer-token:
        description: PAT with read access to a private consumer repository; falls back to the caller's github.token (works for a public consumer)
        required: false
      ANDROID_UPLOAD_KEYSTORE_BASE64:
        description: Base64-encoded upload keystore (decoded to a 0600 file by decode-secrets.sh)
        required: false
      ANDROID_UPLOAD_KEYSTORE_PASSWORD:
        description: Password of the upload keystore
        required: false
      ANDROID_UPLOAD_KEY_ALIAS:
        description: Alias of the signing key inside the upload keystore
        required: false
      ANDROID_UPLOAD_KEY_PASSWORD:
        description: Password of the signing key inside the upload keystore
        required: false
      PLAY_SERVICE_ACCOUNT_JSON:
        description: Google Play service account JSON (raw); decode-secrets.sh also writes it to a file and exports PLAY_SERVICE_ACCOUNT_JSON_PATH
        required: false
permissions:
  contents: read
jobs:
  build:
    name: Build
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      WORKING_DIRECTORY: ${{ inputs.working-directory }}
      WORKFLOWS_NATIVE_STACK_INPUT: ${{ inputs.native-stack }}
      WORKFLOWS_FASTLANE_DIRECTORY: ${{ inputs.fastlane-directory }}
      WORKFLOWS_STAGE: ${{ inputs.stage }}
      APP_VERSION: ${{ inputs.version }}
      APP_BUILD_NUMBER: ${{ inputs.build-number }}
      ANDROID_PACKAGE: ${{ inputs.android-package }}
      # The iOS ids on the Android build are not a copy/paste slip: the
      # consumer's Fastfile runs require_env! over all five variables in
      # before_all, for every lane on both platforms, and rejects empty ones.
      IOS_BUNDLE_ID: ${{ inputs.ios-bundle-id }}
      IOS_SCHEME: ${{ inputs.ios-scheme }}
    steps:
      - name: Checkout consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
          # Nothing in this job talks to the consumer's remote again: the lanes
          # read and upload, match clones its own repository with
          # MATCH_GIT_BASIC_AUTHORIZATION, and the release assets come through
          # gh with GH_TOKEN. So the token is not left where git in this checkout
          # finds it, for the signing steps or anything they run to read.
          persist-credentials: false
      - name: Checkout shared-workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Free disk space
        uses: ./.workflows/.github/actions/free-disk
      # Before anything is installed or built. All five are `required: true`
      # inputs, and that is weaker than it reads: a caller passes them as
      # `${{ vars.X }}`, an unset repository variable is the empty string, and
      # an empty string satisfies `required`. The consumer's Fastfile rejects
      # empty values in before_all - but only if it has that before_all, and
      # only after prebuild and pod install have already been paid for.
      - name: Check the lane inputs
        run: bash ".workflows/scripts/release/require-inputs.sh"
      - name: Publish the release output directories
        run: bash ".workflows/scripts/release/env-publish.sh"
      # As soon as its path exists, before Setup: a wrong or missing
      # build-info-artifact fails here in seconds instead of after Setup,
      # Gradle and prebuild. Nothing in between touches
      # $WORKFLOWS_RELEASE_META_DIR, which lives under $RUNNER_TEMP, outside
      # the checkout.
      - name: Download build-info
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.build-info-artifact }}
          path: ${{ env.WORKFLOWS_RELEASE_META_DIR }}
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          # fastlane's android lanes are Ruby, same as the iOS ones.
          ruby-enabled: 'true'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Compared against the input, not a literal: a consumer whose default
          # branch is `master` never wrote the cache at all and paid a cold
          # Gradle on every run, including on its own default branch.
          cache-read-only: ${{ github.ref != inputs.default-branch }}
          # The transforms entry holds the app's own compiled config next to the
          # libraries', so setup-gradle saved all of it again (600 MB) on every
          # push, an identical commit included, and that pushed the iOS app out
          # of a full 10 GB repository cache. Rebuilt each build instead: about
          # two minutes of Linux time (docs/cache-keys.md, "Gradle").
          gradle-home-cache-excludes: |
            caches/transforms-4
            caches/*/transforms
      - name: Decode secrets
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: bash "$WORKFLOWS_DIR/scripts/release/decode-secrets.sh"
      - name: Publish environment-variables
        env:
          WORKFLOWS_BUILD_ENV: ${{ inputs.environment-variables }}
        run: bash "$WORKFLOWS_DIR/scripts/release/build-env.sh"
      # Before the lane, not inside it: the `android build` lane needs
      # bundletool to derive the universal APK from the .aab, and no runner
      # image ships it. Failing here costs seconds; failing inside the lane
      # costs the whole Gradle build first. Before prebuild too, which it does
      # not need: a wrong bundletool-version or bundletool-sha256 then fails
      # before prebuild is paid for. Not before Setup: the java it checks the
      # jar with may be one the consumer's mise pins.
      - name: Install bundletool
        env:
          BUNDLETOOL_VERSION: ${{ inputs.bundletool-version }}
          BUNDLETOOL_SHA256: ${{ inputs.bundletool-sha256 }}
        run: bash "$WORKFLOWS_DIR/scripts/ci/bundletool-install.sh"
      - name: Prebuild (android)
        run: bash "$WORKFLOWS_DIR/scripts/native/prebuild.sh" android
      # The two lanes carry bounds of their own, as build-ios.yml's do: a Gradle
      # build stalled on a dependency download or a wedged daemon fails with
      # the step's name in the log, at about twice its slowest normal run,
      # instead of as a job cancelled at 60. Measured over the template's 41
      # internal builds of 2026-09-24 to 2026-10-03: the build took 9-18
      # minutes, median 13, and twice the slowest is 36, so 40. Everything else
      # in the job took at most 7 minutes, so both bounds (50 together) can
      # fire inside the 60.
      - name: Fastlane android build
        timeout-minutes: 40
        env:
          BUILD_INFO_FILE: ${{ env.WORKFLOWS_RELEASE_META_DIR }}/build-info.json
          STORE_NOTES_FILE: ${{ env.WORKFLOWS_RELEASE_META_DIR }}/store-notes.txt
          STORE_NOTES_JSON: ${{ env.WORKFLOWS_RELEASE_META_DIR }}/store-notes.json
          # Passed alongside the decoded file (ANDROID_UPLOAD_KEYSTORE_PATH):
          # a lane may read either form, and a lane that reads the base64 with
          # ENV.fetch would raise on a missing key.
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          # Non-empty value in the `&&` slot: GitHub's `&&` yields its first
          # falsy operand, so `cond && '' || X` would be X on both branches.
          # fastlane.sh appends $LANE_ARGS to the lane arguments.
          LANE_ARGS: ${{ !inputs.android-signing-enabled && 'skip_signing:true' || '' }}
        run: bash "$WORKFLOWS_DIR/scripts/release/fastlane.sh" android build
      # Between build and verify: the digests describe what the lane just
      # produced, and verify is the step that checks the apk it is about to
      # publish against them. The enriched copy lives beside the binaries and is
      # uploaded with them, so the release's build-info.json names the exact
      # bytes attached to it.
      - name: Record artifact hashes
        env:
          BUILD_INFO_FILE: ${{ env.WORKFLOWS_RELEASE_META_DIR }}/build-info.json
        run: bash "$WORKFLOWS_DIR/scripts/release/artifact-hashes.sh"
      # ANDROID_UPLOAD_CERT_SHA256 comes from environment-variables; the lane forwards it to
      # the package's verify-android.sh as --cert-sha256, which is what turns
      # "the aab is signed" into "the aab is signed by the expected key".
      # 3-11s there (unsigned); the signature checks are local. 10, the bound
      # test-e2e.yml gives its short steps.
      - name: Fastlane android verify
        if: ${{ inputs.verify }}
        timeout-minutes: 10
        env:
          # The enriched copy, not build-info's: it carries
          # artifacts.apkSha256, which is what the verify-android your lane runs
          # compares the universal apk against.
          BUILD_INFO_FILE: ${{ env.WORKFLOWS_OUTPUT_DIR }}/build-info.json
          STORE_NOTES_FILE: ${{ env.WORKFLOWS_RELEASE_META_DIR }}/store-notes.txt
          STORE_NOTES_JSON: ${{ env.WORKFLOWS_RELEASE_META_DIR }}/store-notes.json
          # Published by environment-variables; forwarded explicitly so the contract is
          # visible at the step that depends on it. Empty means "signature
          # present" only; set it to assert the signing key's fingerprint.
          ANDROID_UPLOAD_CERT_SHA256: ${{ env.ANDROID_UPLOAD_CERT_SHA256 }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          # Non-empty value in the `&&` slot: GitHub's `&&` yields its first
          # falsy operand, so `cond && '' || X` would be X on both branches.
          # fastlane.sh appends $LANE_ARGS to the lane arguments.
          LANE_ARGS: ${{ !inputs.android-signing-enabled && 'skip_signing:true' || '' }}
        run: bash "$WORKFLOWS_DIR/scripts/release/fastlane.sh" android verify
      - name: Upload android-aab
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.aab-artifact }}
          # The build-info copy travels with the binaries it describes, under a
          # platform-specific name on purpose: a release job merges several
          # artifacts into one directory with `merge-multiple: true`, whose
          # order is undefined, so two artifacts both carrying `build-info.json`
          # would make the release's record a coin toss. publish-github-release.yml
          # folds this one back in explicitly, with merge-build-info.sh.
          path: |
            ${{ env.WORKFLOWS_OUTPUT_DIR }}/*.aab
            ${{ env.WORKFLOWS_OUTPUT_DIR }}/build-info.android.json
          # An .aab is already compressed.
          compression-level: 0
          retention-days: 30
          overwrite: true
          if-no-files-found: error
      - name: Upload android-apk
        # The apk is the artifact a human installs to reproduce a store bug, so
        # it uploads even when verify failed.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.apk-artifact }}
          path: ${{ env.WORKFLOWS_OUTPUT_DIR }}/*.apk
          compression-level: 0
          retention-days: 30
          overwrite: true
          if-no-files-found: warn
      - name: Upload android-mapping
        # Without the mapping file every Play crash report for this build is
        # permanently unreadable, so this is never conditional on success.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.mapping-artifact }}
          path: ${{ inputs.working-directory }}/${{ inputs.mapping-path }}
          retention-days: 30
          overwrite: true
          if-no-files-found: warn
