name: Self release
on:
  push:
    branches: [main]
concurrency:
  group: self-release-${{ github.ref }}
  cancel-in-progress: false
# Read-only at the top: each job asks for what it writes, so a job added later
# starts with nothing rather than inheriting release rights.
permissions:
  contents: read
jobs:
  # The same reusable workflow a consumer calls, from this commit: release-please,
  # as the RELEASE_TAGGER App when its secrets are set (a release PR opened by an
  # App triggers CI like any other), then self-ci.yml started on each release PR
  # by name, because one opened with GITHUB_TOKEN gets a pull_request run that
  # never gets a job. Nothing is dispatched at the tag: the jobs below chain off
  # its outputs instead.
  release-pr:
    name: Release PR
    uses: ./.github/workflows/pr-release.yml
    permissions:
      contents: write
      pull-requests: write
      # The CI dispatch writes to the Actions API.
      actions: write
    with:
      ci-workflow: self-ci.yml
    secrets:
      RELEASE_TAGGER_APP_ID: ${{ secrets.RELEASE_TAGGER_APP_ID }}
      RELEASE_TAGGER_APP_PRIVATE_KEY: ${{ secrets.RELEASE_TAGGER_APP_PRIVATE_KEY }}
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
  # pr-store-notes.yml, run for real against the template from this release
  # commit before `v0` moves to it: `v0` is the one thing that puts a release
  # in front of every consumer at once, and no other gate here executes a
  # reusable workflow. Same called workflow as self-ci.yml.
  store-notes:
    name: Store notes
    needs: release-pr
    if: ${{ needs.release-pr.outputs.release-created == 'true' }}
    uses: ./.github/workflows/self-store-notes.yml
    permissions:
      contents: read
      pull-requests: write
  major-tag:
    name: Major tag
    # The dry run is a need, not a parallel job: a failed or skipped
    # dry run skips this job, and the tags stay on the last release.
    needs: [release-pr, store-notes]
    # Job outputs are strings and every non-empty string is truthy in a GitHub
    # expression, so a bare `outputs.release-created` also fires on the literal
    # "false" a no-release push produces - which would run tag-major.sh with an
    # empty TAG and leave main permanently red.
    if: ${{ needs.release-pr.outputs.release-created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Move the moving major/minor tags to this release
        env:
          TAG: ${{ needs.release-pr.outputs.release-tag }}
        run: bash scripts/self/tag-major.sh

  publish-app-tooling:
    name: Publish app-tooling
    needs: release-pr
    # paths-released names every package this push released; the root package
    # is `.`, the npm package its directory. The workflow also prints it to the
    # job summary, so a path spelled wrong here shows up there.
    if: ${{ contains(fromJSON(needs.release-pr.outputs.paths-released || '[]'), 'packages/app-tooling') }}
    runs-on: ubuntu-latest
    # The package's suites take about a minute on a warm runner; the rest is
    # headroom for mise installing the toolchain cold, as self-unit.yml allows.
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # publish @blinkbitcoin/app-tooling to GitHub Packages
      id-token: write # sign the tarball's build provenance attestation (Sigstore)
      attestations: write # store that attestation on this repository
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The release PR's CI already ran these, but a merge that skipped or
      # bypassed it would otherwise publish code no test has seen. The same
      # toolchain and targets as self-unit.yml's Package and Ruby jobs: the
      # node:test suites at 100% coverage (package.test.mjs also holds every
      # export to the `files` list), then the fastlane lanes the package ships.
      - name: Set up the toolchain
        uses: jdx/mise-action@v4

      - name: Test the package
        run: make test-package

      - name: Test the fastlane lanes the package ships
        run: make test-fastlane

      # registry-url + scope write the .npmrc that routes @blinkbitcoin to
      # GitHub Packages, which is where the org's other @blinkbitcoin packages
      # live - so this needs github.token and no separate npm credential.
      - name: Set up Node and the @blinkbitcoin registry
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@blinkbitcoin'

      # `npm publish --provenance` signs only for registry.npmjs.org, so the
      # provenance is a GitHub artifact attestation instead: pack once, attest
      # that tarball, publish that tarball. What installs is byte for byte what
      # was attested (`gh attestation verify`, packages/app-tooling/README.md).
      - name: Pack @blinkbitcoin/app-tooling
        id: pack
        run: bash scripts/self/pack-app-tooling.sh packages/app-tooling "$RUNNER_TEMP/app-tooling"

      - name: Attest the app-tooling tarball
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

      - name: Publish @blinkbitcoin/app-tooling
        working-directory: packages/app-tooling
        run: npm publish "$TARBALL"
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
