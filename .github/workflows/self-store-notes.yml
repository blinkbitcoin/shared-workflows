name: Self store notes
# pr-store-notes.yml, executed for real against the template, in a dry run.
# Called from self-ci.yml on every change, which turns these into
# `Store notes / Dry run / Draft` and `Store notes / Validate`, and
# from self-release.yml, whose major-tag job waits on it: `v0` never moves to a
# commit whose dry run failed.
#
# Every other reusable workflow runs only inside a consumer (or under act, on
# a laptop), so a mistake in one ships with every gate here green. This one
# can run from a pull request, because `dry-run` with `body-file` needs no
# release PR and edits nothing. The body is this repository's own
# release-please-shaped fixture, read from the `.workflows` checkout of the
# ref under review, so the template needs no copy of it.
#
# The generator is the store-notes program from that same checkout, so what
# the dry run executes is this ref's code. The template contributes its
# checkout, its store metadata locales and its store-notes.prompt.md; the
# trade, taken on purpose, is that a broken setup on its main turns this
# repository's CI red until the template is fixed. That is the consumer every
# release here is first executed by, so it is also the failure a release here
# would otherwise ship into.
#
# Local path, not @v0, for the same reason as self-ci.yml: this has to run the
# ref under review. No secrets are passed: the generator drafts without an LLM
# when no key is set, and a fork's pull request has none.
on:
  workflow_call:
permissions: { contents: read }
jobs:
  dry-run:
    name: Dry run
    uses: ./.github/workflows/pr-store-notes.yml
    # What the called job declares, so the dry run fails exactly where an
    # under-granting consumer caller would. A dry run from a body file writes
    # nothing with it; on a fork's pull request the token is read-only anyway.
    permissions:
      contents: read
      pull-requests: write
    with:
      repository: blinkbitcoin/react-native-mobile-template
      ref: main
      dry-run: true
      body-file: .workflows/packages/app-tooling/fixtures/store-notes/release-body.md
  validate:
    name: Validate
    needs: dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - env:
          SECTION: ${{ needs.dry-run.outputs.section }}
        run: bash scripts/self/check-store-notes-section.sh
