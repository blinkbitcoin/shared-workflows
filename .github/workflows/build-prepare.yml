name: Prepare
on:
  workflow_call:
    inputs:
      repository:
        description: Consumer repository to check out (defaults to the caller's repository)
        type: string
        default: ''
      ref:
        description: Consumer ref to check out (empty lets actions/checkout resolve the correct ref, including PR merge refs)
        type: string
        default: ''
      working-directory:
        description: Consumer directory relative to GITHUB_WORKSPACE
        type: string
        default: '.'
      linux-runner:
        description: Runner label for every job in this workflow
        type: string
        default: 'ubuntu-latest'
      macos-runner:
        description: Runner label for macOS jobs (unused by this workflow; carried for input-set consistency across the family)
        type: string
        default: 'macos-26'
      native-cache-version:
        description: Native cache key prefix (unused by this workflow; carried for input-set consistency across the family)
        type: string
        default: 'v1'
      build-number-offset:
        description: Added to the first-parent commit count to form the build number; raise it, never lower it (stores reject a build number that goes backwards)
        type: number
        default: 1000
      notes-locales:
        description: "Locales the consumer's scripts/release/notes.mjs should emit store notes for. These are store metadata locale names, not language codes: App Store Connect and Play both key their listings on the full form (en-US, de-DE, pt-BR), and a bare 'en' matches no listing"
        type: string
        default: 'en-US'
      stage:
        description: Release stage recorded in build-info.json (internal/beta/production)
        type: string
        default: 'internal'
      release-body-file:
        description: Consumer-relative file holding a release body; when set, notes are generated from it instead of from commits (`release-tag` takes precedence)
        type: string
        default: ''
      release-tag:
        description: Existing release tag whose body becomes the source of the store notes; fetched with `gh release view` and passed to the consumer's notes.mjs as `--from-body --body-section`. Empty falls back to `release-body-file`, then to the commit subjects
        type: string
        default: ''
      require-green-workflow:
        description: Workflow file name (e.g. cd-internal.yml) that must have concluded successfully for this sha before preparing; empty disables the gate
        type: string
        default: ''
      reserve-tag:
        description: 'Create the `v<version>-build.<n>` tag at the target sha in Prepare, before the green gate, while the commit is still the default branch tip; the release is later created on the existing tag. GitHub refuses GITHUB_TOKEN a new tag on a commit whose workflow files differ from the tip. Needs `contents: write` on the calling job'
        type: boolean
        default: false
      require-green-dispatch:
        description: 'When the gated workflow has no run for the target sha, or its run was cancelled or failed, dispatch it once at `release-tag` and wait for that run instead of failing. Needs `release-tag` and `actions: write` on the calling job'
        type: boolean
        default: false
      release-meta-artifact:
        description: Artifact name carrying build-info.json, store-notes.json, notes-store.txt and notes.md to the later jobs
        type: string
        default: 'release-meta'
      build-env:
        description: 'Flat JSON object of non-secret build environment variables published before prebuild, the lanes and the scripts (e.g. {"OTA_ENABLED":"true","EXPO_UPDATES_URL":"https://..."}). Keys must be UPPER_SNAKE and anything that reads as a credential is refused - this is a workflow input, so GitHub neither masks nor hides it'
        type: string
        default: '{}'
    secrets:
      consumer-token:
        description: PAT with read access to a private consumer repository; falls back to the caller's github.token (works for a public consumer)
        required: false
      ANTHROPIC_API_KEY:
        description: API key for the consumer's notes.mjs when it drafts store notes with Claude; unset simply means no LLM pass
        required: false
      OPENAI_API_KEY:
        description: API key for the consumer's notes.mjs when it drafts store notes with an OpenAI-compatible endpoint
        required: false
    outputs:
      version:
        description: 'Resolved app version (X.Y.Z)'
        value: ${{ jobs.prepare.outputs.version }}
      build-number:
        description: 'Resolved build number (first-parent commit count + build-number-offset)'
        value: ${{ jobs.prepare.outputs.build-number }}
      fp-ios:
        description: '@expo/fingerprint hash of the iOS native layer'
        value: ${{ jobs.prepare.outputs.fp-ios }}
      fp-android:
        description: '@expo/fingerprint hash of the Android native layer'
        value: ${{ jobs.prepare.outputs.fp-android }}
      sha:
        description: 'Commit the release was prepared from (the release-tag commit when release-tag is set, else github.sha)'
        value: ${{ jobs.prepare.outputs.sha }}
# No top-level `permissions:` on purpose - this is the one workflow in the
# family without it. A `permissions` block anywhere in a called workflow
# replaces the caller's grant with its own (it can only narrow, never widen),
# and a top-level block applies to every job that has none of its own. With
# `contents: read` here, the prepare job's token was `Contents: read,
# Metadata: read` whatever the caller granted (react-native-mobile-template
# run 35429556846, attempt 2): the caller's `contents: write` for reserve-tag
# and `actions: read` for the green gate never arrived, and the tag creation
# got 403. With no block at all the job inherits exactly what the caller
# granted, which is the contract docs/consumer-guide.md documents.
jobs:
  prepare:
    name: Prepare
    runs-on: ${{ inputs.linux-runner }}
    # Long enough for the green gate to dispatch the gated workflow and wait
    # for it (require-green-dispatch): two gate budgets plus the rest.
    timeout-minutes: 120
    # No job-level `permissions:` on purpose - this job inherits the caller's.
    # The green gate needs `actions: read` (`gh run list`), and `actions:
    # write` when `require-green-dispatch` is on (`gh workflow run`). A static
    # block cannot express "read, or write when asked", and a called job may
    # never request more than the caller granted, so a static `write` would
    # reject every caller that grants `read`. Inheriting lets each caller
    # grant exactly what it uses; a caller that grants too little fails in the
    # gate step with a message naming the missing scope. docs/consumer-guide.md
    # says so next to this workflow's inputs.
    env:
      WORKING_DIRECTORY: ${{ inputs.working-directory }}
      WORKFLOWS_STAGE: ${{ inputs.stage }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      build-number: ${{ steps.version.outputs.build-number }}
      fp-ios: ${{ steps.fingerprint.outputs.fp-ios }}
      fp-android: ${{ steps.fingerprint.outputs.fp-android }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          # release-tag wins over ref: preparing a release means preparing *that
          # tag's commit*, and github.sha on a `release: published` event is the
          # default-branch tip, which may already be ahead of it.
          ref: ${{ inputs.release-tag || inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
          # fetch-depth: 0 is load-bearing here: resolve-version.sh reads the
          # v* tags and counts first-parent commits, and both are empty on the
          # default shallow clone.
          fetch-depth: 0
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Publish WORKFLOWS_DIR environment
        run: bash ".workflows/scripts/release/env-publish.sh"
      - name: Resolve target sha
        id: sha
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: bash ".workflows/scripts/release/target-sha.sh" "$RELEASE_TAG"
      # build-env and the version come before the green gate and before Setup:
      # both need only git and gh, and the build tag below must be reserved
      # seconds after the push, not after a 35-minute wait for CI. Literal
      # `.workflows/` paths, like every step above: $WORKFLOWS_DIR is published
      # by Setup and is empty here (v0.6.0 used it and exited 127 on every
      # consumer's next push).
      - name: Publish build-env
        env:
          WORKFLOWS_BUILD_ENV: ${{ inputs.build-env }}
        run: bash ".workflows/scripts/release/build-env.sh"
      - name: Resolve version
        id: version
        env:
          BUILD_NUMBER_OFFSET: ${{ inputs.build-number-offset }}
          RELEASE_PR_TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ github.token }}
        run: bash ".workflows/scripts/release/resolve-version.sh"
      # See reserve-tag.sh for the GitHub rule this sidesteps. Before the gate
      # on purpose: the gate can wait most of an hour, and every minute is a
      # chance for a later merge to touch a workflow file.
      - name: Reserve build tag
        id: reserve
        if: ${{ inputs.reserve-tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ inputs.repository || github.repository }}
          TAG: v${{ steps.version.outputs.version }}-build.${{ steps.version.outputs.build-number }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: bash ".workflows/scripts/release/reserve-tag.sh" "$TAG" "$SHA"
      - name: Require a green upstream run
        if: ${{ inputs.require-green-workflow != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ inputs.repository || github.repository }}
          REQUIRE_GREEN_WORKFLOW: ${{ inputs.require-green-workflow }}
          # The resolved target sha, not github.sha - see target-sha.sh.
          REQUIRE_GREEN_SHA: ${{ steps.sha.outputs.sha }}
          # The ref to dispatch the gated workflow at when its run is missing or
          # red: the release tag, so the dispatched run builds exactly the gated
          # commit. Empty keeps the gate fail-only. The non-empty value sits in
          # the `&&` slot on purpose (GitHub's `&&` yields its first falsy operand).
          REQUIRE_GREEN_DISPATCH_REF: ${{ inputs.require-green-dispatch && inputs.release-tag || '' }}
        run: bash ".workflows/scripts/release/require-green-run.sh" "$REQUIRE_GREEN_WORKFLOW" "$REQUIRE_GREEN_SHA"
      # A tag this run reserved and cannot fill (red gate, or anything else
      # failing below) would name a commit with no release. Only the tag this
      # run created; a re-run that found its tag in place leaves it alone.
      - name: Release the reserved tag
        if: ${{ failure() && steps.reserve.outputs.reserved == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ inputs.repository || github.repository }}
          TAG: v${{ steps.version.outputs.version }}-build.${{ steps.version.outputs.build-number }}
        run: bash ".workflows/scripts/release/unreserve-tag.sh" "$TAG"
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
      - name: Fingerprint
        id: fingerprint
        run: bash "$WORKFLOWS_DIR/scripts/release/fingerprint.sh"
      # APP_VERSION / APP_BUILD_NUMBER are passed explicitly from the Resolve
      # version step's outputs rather than picked up from $GITHUB_ENV. The script
      # that resolves them has no business also publishing them into the job's
      # environment - the consumer ships a contract-identical copy that runs on a
      # laptop under `make version`, where $GITHUB_ENV does not exist, so a write
      # here was drift between the two copies that no test could see. Both
      # scripts below fail loudly when either value is missing.
      - name: Build info
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          APP_BUILD_NUMBER: ${{ steps.version.outputs.build-number }}
        run: bash "$WORKFLOWS_DIR/scripts/release/build-info.sh"
      # Before the notes step, and only when asked: it publishes RELEASE_BODY_FILE
      # into $GITHUB_ENV, which the notes step below picks up in preference to
      # its own release-body-file input.
      - name: Fetch release body
        if: ${{ inputs.release-tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ inputs.repository || github.repository }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: bash "$WORKFLOWS_DIR/scripts/release/release-body.sh" "$RELEASE_TAG"
      - name: Release notes
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          APP_BUILD_NUMBER: ${{ steps.version.outputs.build-number }}
          NOTES_LOCALES: ${{ inputs.notes-locales }}
          # The consumer's notes.mjs may draft store notes with an LLM; the
          # provider/model live in build-env, only the keys are secrets.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # env.RELEASE_BODY_FILE is set by the step above when release-tag was
          # given; the input is the fallback. A step env key always wins over
          # the job env, so the `||` is what makes the input the fallback rather
          # than the override.
          RELEASE_BODY_FILE: ${{ env.RELEASE_BODY_FILE || inputs.release-body-file }}
        run: bash "$WORKFLOWS_DIR/scripts/release/notes.sh"
      - name: Upload release-meta
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.release-meta-artifact }}
          path: ${{ env.WORKFLOWS_RELEASE_META_DIR }}
          retention-days: 30
          overwrite: true
          if-no-files-found: error
