name: PR Closed
on:
  workflow_call: {}
  # The caller triggers this on `pull_request: [closed]` and grants
  # `permissions: actions: write` so the cancel step below can cancel runs, plus
  # `contents: write` so the badges-cleanup job can push the gh-pages branch.
permissions:
  contents: read
jobs:
  cancel:
    name: Cancel runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      # No consumer checkout: cancel-runs.sh only calls the GitHub API with
      # data from the github context, so there is nothing to check the
      # consumer out for. The shared-workflows checkout below is still
      # required by the shape rule that every job with a `run:` step checks
      # out .workflows. Setup never runs here (no $WORKFLOWS_DIR), so the script is reached
      # through the plain .workflows/ checkout path, the same way check-code.yml's
      # `changes` job reaches changed-class.sh.
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Cancel in-flight runs for this PR's head sha
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash ".workflows/scripts/ci/cancel-runs.sh"
  badges-cleanup:
    name: Clean badges
    # A fork PR's run has no token that can push to the base repository, and it
    # never published a badge directory in the first place (publish-badges.yml skips
    # fork PRs for the same reason), so there is nothing here to clean up.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Unlike the cancel job this one does need the consumer checkout: it is
      # that checkout's `origin` (and its persisted credentials) that the
      # gh-pages push goes through. Setup never runs here either - the script is
      # plain git - so it is reached through the .workflows/ path, not $WORKFLOWS_DIR.
      #
      # `ref` is pinned, and pinned to the *base* branch specifically. Left to
      # itself, actions/checkout resolves `github.ref` on a pull_request event,
      # which is `refs/pull/N/merge` - a ref GitHub drops when the PR closes,
      # and this job triggers on exactly that. The checkout would then fail with
      # "couldn't find remote ref", turning the run red and leaving the badge
      # directory behind. The job wants no file from the PR at all, only an
      # `origin` with credentials, so the base branch (which always exists, and
      # is what the PR was closed against) is the cheapest ref that works.
      # fetch-depth: 1 because nothing here reads history.
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 1
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Drop this branch's badges from gh-pages
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: bash ".workflows/scripts/ci/badges-cleanup.sh"
