name: E2E
on:
  workflow_call:
    inputs:
      repository:
        description: Consumer repository to check out (defaults to the caller's repository)
        type: string
        default: ''
      ref:
        description: Consumer ref to check out (empty lets actions/checkout resolve the correct ref, including PR merge refs)
        type: string
        default: ''
      working-directory:
        description: Consumer directory relative to GITHUB_WORKSPACE
        type: string
        default: '.'
      linux-runner:
        description: Runner label for the Android jobs
        type: string
        default: 'ubuntu-latest'
      macos-runner:
        description: Runner label for the iOS jobs
        type: string
        default: 'macos-26'
      default-branch:
        description: >-
          Fully qualified ref of the branch allowed to WRITE the Gradle cache
          (every other ref reads it). Only the default branch should write, or
          concurrent branches would evict each other's entries.
        type: string
        default: 'refs/heads/main'
      native-cache-version:
        description: Native cache key prefix; bump to invalidate every native cache at once
        type: string
        default: 'v1'
      native-extra-globs:
        description: Extra space-separated consumer-relative shell globs whose file contents are folded into the native dependency hash
        type: string
        default: ''
      ios:
        description: Run the iOS build and simulator suite (off by default; macOS runners bill at 10x)
        type: boolean
        default: false
      android:
        description: Run the Android build and emulator suite
        type: boolean
        default: true
      xcode:
        description: Xcode version to select before building (empty uses the runner default); also folded into the iOS cache key
        type: string
        default: ''
      android-api-level:
        description: Android API level for the emulator and system image (kept equal to scripts/lib/versions.sh ANDROID_API_LEVEL)
        type: number
        default: 34
      maestro-version:
        description: Maestro CLI version (kept equal to scripts/lib/versions.sh MAESTRO_VERSION; enforced by scripts/self/check-versions.sh)
        type: string
        default: '2.10.0'
      maestro-flows:
        description: Flows directory, consumer-relative
        type: string
        default: '.maestro'
      maestro-include-tags:
        description: Passed to maestro as --include-tags when non-empty
        type: string
        default: ''
      maestro-exclude-tags:
        description: Passed to maestro as --exclude-tags when non-empty
        type: string
        default: ''
      suite-timeout-minutes:
        description: Per-attempt bound for the Maestro suite; the step timeout is this plus 5
        type: number
        default: 10
      dev-client:
        description: Launch through the expo-development-client deep link and start Metro with --dev-client
        type: boolean
        default: true
      ios-configuration:
        description: >-
          Xcode configuration for the iOS E2E app. Debug loads its JS from Metro
          through the expo-development-client deep link. Release embeds the
          bundle and leaves the dev launcher out of the build, so the app runs
          on `simctl launch` alone - no Metro, no deep link, and no iOS
          "Open in <app>?" prompt to answer. Release forces dev-client off for
          the iOS jobs whatever `dev-client` says; Android is unaffected.
        type: string
        default: Debug
      build-env:
        description: >-
          Flat JSON object of non-secret build environment variables published
          before the iOS prebuild, so the bundle embeds them. A Release build
          resolves .env.production at build time; an exported variable wins over
          the dotenv file, which is how an E2E build is pointed at a mock API.
          Folded into the iOS cache key. Keys must be UPPER_SNAKE and anything
          that reads as a credential is refused - this is a workflow input, so
          GitHub neither masks nor hides it.
        type: string
        default: '{}'
      e2e-setup-script:
        description: Consumer-relative script run before the suite (empty skips it); a missing file is fatal
        type: string
        default: ''
      e2e-teardown-script:
        description: Consumer-relative script run after the suite, pass or fail (empty skips it)
        type: string
        default: ''
      ios-artifact-name:
        description: Artifact name carrying the packed iOS .app tar between build-ios and ios
        type: string
        default: 'ios-app'
      android-artifact-name:
        description: Artifact name carrying the debug APK between build-android and android
        type: string
        default: 'android-apk'
    secrets:
      consumer-token:
        description: PAT with read access to a private consumer repository; falls back to the caller's github.token (works for a public consumer)
        required: false
    outputs:
      ios-result:
        description: 'Result of the iOS suite job (success/failure/cancelled/skipped)'
        value: ${{ jobs.ios.result }}
      android-result:
        description: 'Result of the Android suite job (success/failure/cancelled/skipped)'
        value: ${{ jobs.android.result }}
permissions:
  contents: read
jobs:
  build-ios:
    name: Build iOS
    if: ${{ inputs.ios }}
    runs-on: ${{ inputs.macos-runner }}
    timeout-minutes: 60
    env:
      WORKING_DIRECTORY: ${{ inputs.working-directory }}
      WORKFLOWS_XCODE: ${{ inputs.xcode }}
      WORKFLOWS_IOS_CONFIGURATION: ${{ inputs.ios-configuration }}
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      # $WORKFLOWS_DIR first, and unconditionally: every later `run:` in this job
      # is `bash "$WORKFLOWS_DIR/..."`, and the Setup action that also publishes
      # it is skipped on a cache hit - which left the pack step running
      # `bash "/scripts/native/ios-pack.sh"` and dying with exit 127.
      - name: Publish WORKFLOWS_DIR
        run: bash ".workflows/scripts/ci/workflows-env.sh"
      # Puts WORKFLOWS_OUT in $GITHUB_ENV up front so the upload step's `path:` below
      # resolves even when an earlier step failed before any other script ran.
      - name: Publish WORKFLOWS_OUT environment
        run: bash ".workflows/scripts/e2e/env-publish.sh"
      - name: Native cache keys
        id: keys
        uses: ./.workflows/.github/actions/native-key
        with:
          working-directory: ${{ inputs.working-directory }}
          native-cache-version: ${{ inputs.native-cache-version }}
          native-extra-globs: ${{ inputs.native-extra-globs }}
          xcode: ${{ inputs.xcode }}
          build-env: ${{ inputs.build-env }}
      # The built .app plus the generated workspace: ios-pack.sh resolves the
      # scheme from ios/*.xcworkspace, and on a cache hit no prebuild has run.
      - name: Restore iOS app cache
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ inputs.working-directory }}/ios/build/Build/Products/${{ inputs.ios-configuration }}-iphonesimulator
            ${{ inputs.working-directory }}/ios/*.xcworkspace
          key: ${{ steps.keys.outputs.ios-key }}-${{ inputs.ios-configuration }}
          lookup-only: false
      # Miss only. On a hit the remaining steps pack a tar and upload it:
      # ios-pack.sh takes the scheme from the workspace filename, and its
      # cross-check against the Expo config is best-effort precisely so a warm
      # run does not install a dependency tree to produce a warning. That was
      # ~80s of every warm build. $WORKFLOWS_DIR is published by the dedicated
      # step above, so nothing on the hit path depends on this one.
      - name: Setup
        if: ${{ steps.restore.outputs.cache-hit != 'true' }}
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          ruby: 'true'
      # Before the prebuild, because EXPO_PUBLIC_* is inlined when the bundle is
      # written - anything published later never reaches the .app. Miss only:
      # on a hit there is no bundle to write, and the variables are already
      # baked into the .app being restored (which is why they are in its key).
      - name: Publish build-env
        if: ${{ steps.restore.outputs.cache-hit != 'true' }}
        env:
          WORKFLOWS_BUILD_ENV: ${{ inputs.build-env }}
        run: bash "$WORKFLOWS_DIR/scripts/release/build-env.sh"
      - name: Prebuild (ios)
        if: ${{ steps.restore.outputs.cache-hit != 'true' }}
        run: bash "$WORKFLOWS_DIR/scripts/native/prebuild.sh" ios
      - name: Cache CocoaPods
        if: ${{ steps.restore.outputs.cache-hit != 'true' }}
        uses: actions/cache@v6
        with:
          path: |
            ${{ inputs.working-directory }}/ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ steps.keys.outputs.pods-key }}
          restore-keys: |
            pods-${{ runner.os }}-
      - name: Pod install
        if: ${{ steps.restore.outputs.cache-hit != 'true' }}
        timeout-minutes: 20
        run: bash "$WORKFLOWS_DIR/scripts/native/pods.sh"
      - name: Build iOS app
        id: build
        if: ${{ steps.restore.outputs.cache-hit != 'true' }}
        timeout-minutes: 45
        run: bash "$WORKFLOWS_DIR/scripts/native/ios-build.sh"
      - name: Save iOS app cache
        if: ${{ steps.restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ inputs.working-directory }}/ios/build/Build/Products/${{ inputs.ios-configuration }}-iphonesimulator
            ${{ inputs.working-directory }}/ios/*.xcworkspace
          key: ${{ steps.keys.outputs.ios-key }}-${{ inputs.ios-configuration }}
      # Not `always()`: when the build itself failed there is no .app and no
      # workspace, so ios-pack.sh dies and the upload's `if-no-files-found:
      # error` dies after it - two misleading red steps stacked on the real
      # error. A cache hit leaves `conclusion` as `skipped`, which still packs.
      - name: Pack iOS app
        if: ${{ !cancelled() && steps.build.conclusion != 'failure' }}
        run: bash "$WORKFLOWS_DIR/scripts/native/ios-pack.sh"
      - name: Upload iOS app
        if: ${{ !cancelled() && steps.build.conclusion != 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.ios-artifact-name }}
          path: ${{ env.WORKFLOWS_OUT }}/*.app.tar
          retention-days: 1
          overwrite: true
          if-no-files-found: error
  ios:
    name: iOS
    needs: build-ios
    if: ${{ inputs.ios }}
    runs-on: ${{ inputs.macos-runner }}
    timeout-minutes: 60
    env:
      WORKING_DIRECTORY: ${{ inputs.working-directory }}
      WORKFLOWS_IOS_CONFIGURATION: ${{ inputs.ios-configuration }}
      # A Release build has no dev launcher to deep-link into, so it launches
      # directly whatever `dev-client` says. The non-empty value MUST sit in the
      # `&&` slot: GitHub's `&&` yields the first falsy operand, so putting the
      # inherited value there would return it on both branches.
      WORKFLOWS_DEV_CLIENT: ${{ inputs.ios-configuration == 'Release' && 'false' || inputs.dev-client }}
      WORKFLOWS_MAESTRO_FLOWS: ${{ inputs.maestro-flows }}
      WORKFLOWS_MAESTRO_INCLUDE_TAGS: ${{ inputs.maestro-include-tags }}
      WORKFLOWS_MAESTRO_EXCLUDE_TAGS: ${{ inputs.maestro-exclude-tags }}
      WORKFLOWS_SUITE_TIMEOUT_MINUTES: ${{ inputs.suite-timeout-minutes }}
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      # Before setup there is no $WORKFLOWS_DIR yet, so these two reach the scripts through
      # the plain checkout path. env-publish puts WORKFLOWS_OUT in $GITHUB_ENV so the
      # download-artifact and forensics `with:` blocks below can interpolate it.
      - name: Publish WORKFLOWS_DIR environment
        run: bash ".workflows/scripts/e2e/env-publish.sh"
      - name: Compute suite step timeout
        id: timeout
        run: bash ".workflows/scripts/e2e/step-timeout.sh"
      - name: Pick simulator
        run: bash ".workflows/scripts/e2e/ios-simulator.sh" pick
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
      - name: Install Maestro
        timeout-minutes: 10
        uses: ./.workflows/.github/actions/maestro
        with:
          version: ${{ inputs.maestro-version }}
      # A Release build embeds its bundle and never asks Metro for one, so
      # starting it - and prewarming a bundle nothing reads - is pure wall clock.
      # The setup hook stays unconditional: the mock API it starts is a runtime
      # dependency of the suite, not a build-time one.
      - name: Start Metro
        if: ${{ inputs.ios-configuration != 'Release' }}
        run: bash "$WORKFLOWS_DIR/scripts/e2e/metro-start.sh"
      - name: E2E setup script
        if: ${{ inputs.e2e-setup-script != '' }}
        env:
          HOOK: ${{ inputs.e2e-setup-script }}
        run: bash "$WORKFLOWS_DIR/scripts/e2e/run-hook.sh"
      - name: Wait for simulator
        run: bash "$WORKFLOWS_DIR/scripts/e2e/ios-simulator.sh" wait
      - name: Download iOS app
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.ios-artifact-name }}
          path: ${{ env.WORKFLOWS_OUT }}
      - name: Install app
        run: bash "$WORKFLOWS_DIR/scripts/e2e/ios-simulator.sh" install "$WORKFLOWS_OUT"/*.app.tar
      - name: Wait for Metro
        if: ${{ inputs.ios-configuration != 'Release' }}
        timeout-minutes: 10
        run: bash "$WORKFLOWS_DIR/scripts/e2e/metro-wait.sh" ios
      - name: Start screen recording
        run: bash "$WORKFLOWS_DIR/scripts/e2e/ios-simulator.sh" record start
      - name: Launch app
        run: bash "$WORKFLOWS_DIR/scripts/e2e/app-launch.sh" ios
      # Strictly below suite-timeout-minutes (ios-maestro.sh refuses otherwise):
      # a driver that fails to launch must fail fast and be retried, not sit
      # until the bound's exit 124, which is never retried. 600000 was equal to
      # the bound and cost run 35259139324 ten minutes for zero flows.
      - name: Maestro suite (iOS)
        timeout-minutes: ${{ fromJSON(steps.timeout.outputs.minutes) }}
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
        run: bash "$WORKFLOWS_DIR/scripts/e2e/ios-maestro.sh"
      - name: Stop screen recording
        if: always()
        run: bash "$WORKFLOWS_DIR/scripts/e2e/ios-simulator.sh" record stop
      - name: E2E teardown script
        if: ${{ always() && inputs.e2e-teardown-script != '' }}
        env:
          HOOK: ${{ inputs.e2e-teardown-script }}
        run: bash "$WORKFLOWS_DIR/scripts/e2e/run-hook.sh"
      - name: Collect forensics
        if: always()
        run: bash "$WORKFLOWS_DIR/scripts/e2e/collect-forensics.sh" ios
      - name: Upload forensics
        if: always()
        uses: ./.workflows/.github/actions/forensics
        with:
          name: forensics-ios
          junit: ${{ env.WORKFLOWS_OUT }}/maestro/junit.xml
  build-android:
    name: Build Android
    if: ${{ inputs.android }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 40
    env:
      WORKING_DIRECTORY: ${{ inputs.working-directory }}
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Native cache keys
        id: keys
        uses: ./.workflows/.github/actions/native-key
        with:
          working-directory: ${{ inputs.working-directory }}
          native-cache-version: ${{ inputs.native-cache-version }}
          native-extra-globs: ${{ inputs.native-extra-globs }}
      - name: Restore APK cache
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ inputs.working-directory }}/android/app/build/outputs/apk/debug/app-debug.apk
          key: ${{ steps.keys.outputs.android-key }}
          lookup-only: false
      - name: Setup
        if: ${{ steps.restore.outputs.cache-hit != 'true' }}
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
      - name: Setup Gradle
        if: ${{ steps.restore.outputs.cache-hit != 'true' }}
        uses: gradle/actions/setup-gradle@v6
        with:
          # Compared against the input, not a literal: a consumer whose default
          # branch is `master` never wrote the cache at all and paid a cold
          # Gradle on every run, including on its own default branch.
          cache-read-only: ${{ github.ref != inputs.default-branch }}
      - name: Prebuild (android)
        if: ${{ steps.restore.outputs.cache-hit != 'true' }}
        run: bash "$WORKFLOWS_DIR/scripts/native/prebuild.sh" android
      - name: Build APK
        id: build
        if: ${{ steps.restore.outputs.cache-hit != 'true' }}
        run: bash "$WORKFLOWS_DIR/scripts/native/android-build.sh"
      - name: Save APK cache
        if: ${{ steps.restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ inputs.working-directory }}/android/app/build/outputs/apk/debug/app-debug.apk
          key: ${{ steps.keys.outputs.android-key }}
      # Not `always()`, matching the iOS twin above: when the build itself failed
      # there is no APK, so `if-no-files-found: error` fails a second step and
      # stacks a misleading red on top of the real error. A cache hit leaves
      # `conclusion` as `skipped`, which still uploads the restored APK.
      - name: Upload APK
        if: ${{ !cancelled() && steps.build.conclusion != 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.android-artifact-name }}
          path: ${{ inputs.working-directory }}/android/app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
          retention-days: 1
          overwrite: true
          if-no-files-found: error
  android:
    name: Android
    needs: build-android
    if: ${{ inputs.android }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 60
    env:
      WORKING_DIRECTORY: ${{ inputs.working-directory }}
      WORKFLOWS_DEV_CLIENT: ${{ inputs.dev-client }}
      WORKFLOWS_MAESTRO_FLOWS: ${{ inputs.maestro-flows }}
      WORKFLOWS_MAESTRO_INCLUDE_TAGS: ${{ inputs.maestro-include-tags }}
      WORKFLOWS_MAESTRO_EXCLUDE_TAGS: ${{ inputs.maestro-exclude-tags }}
      WORKFLOWS_SUITE_TIMEOUT_MINUTES: ${{ inputs.suite-timeout-minutes }}
    steps:
      # free-disk is a local composite action, so the .workflows checkout has to come
      # first; it still runs before every disk-heavy step (SDK, emulator, build).
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.consumer-token || github.token }}
      - name: Checkout shared-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false
      - name: Free disk space
        uses: ./.workflows/.github/actions/free-disk
      - name: Publish WORKFLOWS_DIR environment
        run: bash ".workflows/scripts/e2e/env-publish.sh"
      - name: Compute suite step timeout
        id: timeout
        run: bash ".workflows/scripts/e2e/step-timeout.sh"
      - name: Setup
        uses: ./.workflows/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
      - name: Install Maestro
        timeout-minutes: 10
        uses: ./.workflows/.github/actions/maestro
        with:
          version: ${{ inputs.maestro-version }}
      - name: Enable KVM
        run: bash "$WORKFLOWS_DIR/scripts/ci/enable-kvm.sh"
      - name: Start Metro
        run: bash "$WORKFLOWS_DIR/scripts/e2e/metro-start.sh"
      - name: E2E setup script
        if: ${{ inputs.e2e-setup-script != '' }}
        env:
          HOOK: ${{ inputs.e2e-setup-script }}
        run: bash "$WORKFLOWS_DIR/scripts/e2e/run-hook.sh"
      # Downloaded into the consumer's gradle output path so android-maestro.sh
      # finds it at its default location ($consumer/$WORKFLOWS_ANDROID_APK).
      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.android-artifact-name }}
          path: ${{ inputs.working-directory }}/android/app/build/outputs/apk/debug
      # android-emulator-runner installs the `emulator` package itself and has
      # no retry, so a download that lands corrupt kills the job before Maestro
      # runs. Installing it here first buys two retries with a purge in
      # between; the action then finds the package current and skips it - the
      # same no-op property the system-image cache below relies on.
      - name: Install Android emulator package
        timeout-minutes: 15
        run: bash "$WORKFLOWS_DIR/scripts/ci/android-sdk-install.sh" emulator
      - name: Cache Android system image
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_SDK_DIR || env.ANDROID_SDK_ROOT || env.ANDROID_HOME }}/system-images/android-${{ inputs.android-api-level }}
          # The version comes from the input, not a literal: the input's own
          # description, build-ios.yml's, and docs/cache-keys.md all promise
          # that bumping native-cache-version invalidates *every* native cache.
          # With `v1` baked in, someone chasing a stale-AVD failure bumped it,
          # these two caches stayed warm, and the failure survived the fix.
          key: sysimg-${{ inputs.native-cache-version }}-${{ inputs.android-api-level }}-default-x86_64
      - name: Cache AVD
        id: avd
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ inputs.native-cache-version }}-${{ inputs.android-api-level }}-x86_64-default-hidedialogs
      - name: Bake AVD snapshot
        if: ${{ steps.avd.outputs.cache-hit != 'true' }}
        timeout-minutes: 20
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.android-api-level }}
          target: default
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: bash "$WORKFLOWS_DIR/scripts/e2e/android-emulator.sh" snapshot-bake
      - name: Wait for Metro
        timeout-minutes: 10
        run: bash "$WORKFLOWS_DIR/scripts/e2e/metro-wait.sh" android
      - name: Maestro suite (Android)
        timeout-minutes: ${{ fromJSON(steps.timeout.outputs.minutes) }}
        uses: ReactiveCircus/android-emulator-runner@v2
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
        with:
          api-level: ${{ inputs.android-api-level }}
          target: default
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash "$WORKFLOWS_DIR/scripts/e2e/android-maestro.sh"
      - name: E2E teardown script
        if: ${{ always() && inputs.e2e-teardown-script != '' }}
        env:
          HOOK: ${{ inputs.e2e-teardown-script }}
        run: bash "$WORKFLOWS_DIR/scripts/e2e/run-hook.sh"
      - name: Upload forensics
        if: always()
        uses: ./.workflows/.github/actions/forensics
        with:
          name: forensics-android
          junit: ${{ env.WORKFLOWS_OUT }}/maestro/junit.xml
