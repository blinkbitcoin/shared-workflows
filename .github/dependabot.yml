version: 2
updates:
  - package-ecosystem: github-actions
    # `/` alone reads .github/workflows/ and a root action.yml, never the
    # composite actions under .github/actions/, whose pins (ruby/setup-ruby,
    # actions/cache, mise-action) every consumer job runs. Both are listed. setup
    # and native-key also run in the jobs that decode the signing keys, so their
    # actions are pinned by commit SHA, and a SHA nothing moves is a pin that
    # silently ages. Dependabot rewrites a SHA pin together with its `# vX.Y.Z`
    # comment.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    # A release has a week to be yanked before it is proposed here. Security
    # updates are exempt from the cooldown and still arrive at once.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(dependencies)"
