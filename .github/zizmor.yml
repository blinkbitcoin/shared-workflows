# zizmor policy for this repository, and the fallback policy scripts/ci/check-ci.sh
# hands to a consumer that ships no zizmor config of its own. `make check-ci` and
# the lefthook hook pass this file with --config rather than relying on zizmor's
# discovery, which from a worktree nested in another checkout finds that
# checkout's policy instead (see the Makefile).
#
# The gate runs at --min-severity medium (Makefile, check-ci.sh). Low findings
# (artipacked, self-repository) are real hardening but not yet a merge blocker.
rules:
  # Tags, not commit SHAs, across the family: consumers call these workflows at
  # the moving `@v0` tag by design, and first- and third-party actions are held
  # to the same rule so there is one policy to reason about. Dependabot moves
  # the tags. Decided 2026-09-22; revisit by switching this off, not by
  # ignoring findings one at a time.
  #
  # The one exception is where the signing keys are: build-ios.yml,
  # build-android.yml, publish-store.yml and the composite actions they call
  # (setup, native-key) pin every third-party action to a commit SHA with its
  # `# vX.Y.Z`. That is not enforced here: this rule's policies key on the
  # action, not on the file, `ignore` would have to name every other file (and
  # every composite action is an `action.yml`), and this file is also the
  # policy a consumer without its own gets. `test/workflow-shape.bats` holds it.
  unpinned-uses:
    disable: true
