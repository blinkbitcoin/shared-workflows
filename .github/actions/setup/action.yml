name: setup
description: Install mise-managed tools, optionally Ruby, and pnpm dependencies for the consumer checkout
inputs:
  working-directory:
    description: Consumer directory relative to GITHUB_WORKSPACE
    default: '.'
  install:
    description: Run `pnpm install --frozen-lockfile` in the consumer directory
    default: 'true'
  ruby-enabled:
    description: Install Ruby via ruby/setup-ruby (needed for fastlane/CocoaPods lanes); mise then skips its own Ruby
    default: 'false'
  skip-tools:
    description: Space-separated tools from the consumer's .mise.toml that this job does not use, such as `java ruby`; mise leaves them out, and its cache key says so
    default: ''
runs:
  using: composite
  steps:
    # Before mise-action, not after: with no config to read it installs nothing
    # and succeeds, so the first sign of trouble is `missing command: pnpm` two
    # steps later - a true sentence naming neither the missing file nor the
    # repository it is missing from.
    - name: Check the consumer toolchain
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: bash "${{ github.action_path }}/../../../scripts/ci/toolchain-preflight.sh"
    # Most jobs run only node and pnpm, so Java and Ruby were a download on
    # every cache miss (a Ruby compile on macOS) and dead weight in every
    # restore; and where ruby-enabled is on, setup-ruby's Ruby is the one on
    # PATH. MISE_DISABLE_TOOLS goes into the job's environment, so mise-action
    # and every later `mise x` leave the same tools out.
    - name: Choose the mise tools to skip
      id: skip
      shell: bash
      env:
        SKIP_TOOLS: ${{ inputs.skip-tools }}
        RUBY_ENABLED: ${{ inputs.ruby-enabled }}
      run: bash "${{ github.action_path }}/../../../scripts/ci/mise-skip-tools.sh"
    - name: Install mise-managed tools
      uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      with:
        working_directory: ${{ inputs.working-directory }}
        cache: true
        # The default key does not read MISE_DISABLE_TOOLS, so without the
        # suffix a narrowed job and a full one would share an entry, holding
        # whichever saved first. Nothing skipped is an empty suffix: the key
        # is exactly the default.
        cache_key: '{{default}}${{ steps.skip.outputs.cache-key-suffix }}'
    - name: Read pinned Ruby version
      id: rb
      if: inputs.ruby-enabled == 'true'
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: bash "${{ github.action_path }}/../../../scripts/ci/ruby-version.sh"
    - name: Install Ruby
      if: inputs.ruby-enabled == 'true'
      uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
      with:
        ruby-version: ${{ steps.rb.outputs.version }}
        bundler-cache: true
        working-directory: ${{ inputs.working-directory }}
    # The store is cached only for a job that installs: one that does not
    # would restore the store and then save it, untouched, under the current
    # lockfile's key - after a lockfile change, a stale store under the exact
    # key every later job then hits. Keyed on the consumer's own lockfile only,
    # not a glob that also matches .workflows/'s test fixtures.
    - name: Resolve pnpm store path
      id: store
      if: inputs.install == 'true'
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: bash "${{ github.action_path }}/../../../scripts/ci/pnpm-store-path.sh"
    - name: Cache pnpm store
      if: inputs.install == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ steps.store.outputs.lock-hash }}
        restore-keys: |
          pnpm-${{ runner.os }}-
    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: bash "${{ github.action_path }}/../../../scripts/ci/pnpm-install.sh"
    - name: Export WORKFLOWS_DIR environment
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: bash "${{ github.action_path }}/../../../scripts/ci/workflows-env.sh"
