[files]
extend-exclude = ["test/fixtures/**", "plugins/*/skills/*/tests/fixtures/**", "CHANGELOG.md", ".git/**"]

[default]
extend-ignore-re = [
  # The configuration-model contract in docs/consumer-guide.md, and the
  # security verdict's tests, illustrate an invalid setting by dropping a letter
  # from it, so the misspelling is the point of the example. Scoped to the
  # quoted or assigned value itself: a bare `deterministc` written by accident
  # anywhere else still fails the gate.
  "(?:`|'|\"|SECURITY_FAIL_ON=)deterministc",
]

[default.extend-words]
# Real project/technology names and Apple API field names that trip the dictionary.
maestro = "maestro"
udid = "udid"
UDID = "UDID"
# Ruby's File::WRONLY (write only), in the lanes the package ships.
WRONLY = "WRONLY"

[default.extend-identifiers]
# typos splits this on the case change (PN + Gs) and flags "PN"; treat the
# whole identifier as one unit instead of trying to teach it "PN" is fine.
PNGs = "PNGs"
