<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="shared-workflows: app repos carry a short ci.yml that calls the reusable GitHub Actions workflows here at the pinned tag v0 — Checks, Unit and E2E on every pull request; Prepare, Build and sign, and Release on the way to a store — while any repo can install the dev-config npm package for hooks, linters and pinned tools. Every app gets green checks, device E2E, signed builds and store releases.">
  <defs>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#fd800b"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9aa5b1"/>
    </marker>
    <linearGradient id="blinkRamp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fc5805"/>
      <stop offset="1" stop-color="#ffad0d"/>
    </linearGradient>
  </defs>

  <!-- canvas -->
  <rect x="0.5" y="0.5" width="959" height="339" rx="16" fill="#fffdf6" stroke="#efe2c4"/>

  <!-- ===== Column headers ===== -->
  <text x="130" y="38" text-anchor="middle" font-size="13" font-weight="700" fill="#393939" letter-spacing="1">APP REPOS</text>
  <text x="480" y="38" text-anchor="middle" font-size="13" font-weight="700" fill="#393939" letter-spacing="1">ONE PINNED TAG &#183; @v0</text>
  <text x="830" y="38" text-anchor="middle" font-size="13" font-weight="700" fill="#393939" letter-spacing="1">EVERY APP GETS</text>

  <!-- ===== Column 1: callers ===== -->
  <g>
    <rect x="50" y="62" width="160" height="52" rx="8" fill="#ffffff" stroke="#cfd9e2"/>
    <g transform="translate(64 74)">
      <path d="M0 3 a3 3 0 0 1 3 -3 h11 l7 7 v18 a3 3 0 0 1 -3 3 h-15 a3 3 0 0 1 -3 -3 z" fill="#fff9e5" stroke="#fd800b" stroke-width="1.2"/>
      <rect x="4" y="12" width="12" height="2.5" rx="1.25" fill="#fd800b"/>
      <rect x="4" y="17" width="9" height="2.5" rx="1.25" fill="#ffbe0b"/>
      <rect x="4" y="22" width="11" height="2.5" rx="1.25" fill="#ffbe0b"/>
    </g>
    <text x="96" y="85" font-size="12" font-weight="600" fill="#1d1d1d">mobile-template</text>
    <text x="96" y="101" font-size="10.5" fill="#6b7280">ci.yml &#183; forty lines</text>

    <rect x="50" y="126" width="160" height="52" rx="8" fill="#ffffff" stroke="#cfd9e2"/>
    <g transform="translate(64 138)">
      <path d="M0 3 a3 3 0 0 1 3 -3 h11 l7 7 v18 a3 3 0 0 1 -3 3 h-15 a3 3 0 0 1 -3 -3 z" fill="#fff9e5" stroke="#fd800b" stroke-width="1.2"/>
      <rect x="4" y="12" width="12" height="2.5" rx="1.25" fill="#fd800b"/>
      <rect x="4" y="17" width="9" height="2.5" rx="1.25" fill="#ffbe0b"/>
      <rect x="4" y="22" width="11" height="2.5" rx="1.25" fill="#ffbe0b"/>
    </g>
    <text x="96" y="149" font-size="12" font-weight="600" fill="#1d1d1d">your next app</text>
    <text x="96" y="165" font-size="10.5" fill="#6b7280">uses: check-code.yml@v0</text>

    <rect x="50" y="200" width="160" height="52" rx="8" fill="#ffffff" stroke="#cfd9e2" stroke-dasharray="4 3"/>
    <g transform="translate(64 212)">
      <rect x="0" y="4" width="21" height="21" rx="4" fill="#f6f8fa" stroke="#9aa5b1" stroke-width="1.2"/>
      <path d="M5 11 l4 3.5 l-4 3.5 M11 19 h6" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="96" y="223" font-size="12" font-weight="600" fill="#1d1d1d">any repo at all</text>
    <text x="96" y="239" font-size="10.5" fill="#6b7280">tooling only &#183; any stack</text>
  </g>

  <!-- caller arrows -->
  <line x1="218" y1="88"  x2="292" y2="128" stroke="#fd800b" stroke-width="1.6" marker-end="url(#arrowOrange)"/>
  <line x1="218" y1="152" x2="292" y2="160" stroke="#fd800b" stroke-width="1.6" marker-end="url(#arrowOrange)"/>
  <line x1="218" y1="226" x2="292" y2="238" stroke="#9aa5b1" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrowGrey)"/>

  <!-- ===== Column 2: this repo ===== -->
  <g>
    <rect x="300" y="56" width="360" height="212" rx="12" fill="#ffffff" stroke="#fd800b" stroke-width="1.5"/>
    <path d="M300 68 a12 12 0 0 1 12 -12 h336 a12 12 0 0 1 12 12 v26 h-360 z" fill="url(#blinkRamp)"/>
    <text x="480" y="81" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Reusable GitHub Actions workflows</text>

    <!-- lane 1 -->
    <text x="322" y="112" font-size="10.5" fill="#6b7280">on every pull request</text>
    <rect x="322" y="118" width="88" height="30" rx="8" fill="#f6f8fa" stroke="#e6ebef"/>
    <text x="366" y="137" text-anchor="middle" font-size="12" font-weight="600" fill="#1d1d1d">Checks</text>
    <line x1="413" y1="133" x2="433" y2="133" stroke="#fd800b" stroke-width="1.6" marker-end="url(#arrowOrange)"/>
    <rect x="436" y="118" width="88" height="30" rx="8" fill="#f6f8fa" stroke="#e6ebef"/>
    <text x="480" y="137" text-anchor="middle" font-size="12" font-weight="600" fill="#1d1d1d">Unit</text>
    <line x1="527" y1="133" x2="547" y2="133" stroke="#fd800b" stroke-width="1.6" marker-end="url(#arrowOrange)"/>
    <rect x="550" y="118" width="88" height="30" rx="8" fill="#f6f8fa" stroke="#e6ebef"/>
    <text x="594" y="137" text-anchor="middle" font-size="12" font-weight="600" fill="#1d1d1d">E2E</text>

    <!-- lane 2 -->
    <text x="322" y="170" font-size="10.5" fill="#6b7280">on the way to a store</text>
    <rect x="322" y="176" width="88" height="30" rx="8" fill="#f6f8fa" stroke="#e6ebef"/>
    <text x="366" y="195" text-anchor="middle" font-size="12" font-weight="600" fill="#1d1d1d">Prepare</text>
    <line x1="413" y1="191" x2="433" y2="191" stroke="#fd800b" stroke-width="1.6" marker-end="url(#arrowOrange)"/>
    <rect x="436" y="176" width="88" height="30" rx="8" fill="#f6f8fa" stroke="#e6ebef"/>
    <text x="480" y="195" text-anchor="middle" font-size="12" font-weight="600" fill="#1d1d1d">Build + sign</text>
    <line x1="527" y1="191" x2="547" y2="191" stroke="#fd800b" stroke-width="1.6" marker-end="url(#arrowOrange)"/>
    <rect x="550" y="176" width="88" height="30" rx="8" fill="#f6f8fa" stroke="#e6ebef"/>
    <text x="594" y="195" text-anchor="middle" font-size="12" font-weight="600" fill="#1d1d1d">Release</text>

    <!-- dev-config -->
    <rect x="322" y="218" width="316" height="40" rx="8" fill="#fff9e5" stroke="#ffbe0b"/>
    <text x="480" y="235" text-anchor="middle" font-size="12" font-weight="600" fill="#1d1d1d">@blinkbitcoin/dev-config</text>
    <text x="480" y="250" text-anchor="middle" font-size="10.5" fill="#6b7280">git hooks &#183; linters &#183; pinned tool versions &#183; one npm package</text>
  </g>

  <!-- outcome arrows -->
  <line x1="668" y1="122" x2="742" y2="80"  stroke="#fd800b" stroke-width="1.6" marker-end="url(#arrowOrange)"/>
  <line x1="668" y1="146" x2="742" y2="134" stroke="#fd800b" stroke-width="1.6" marker-end="url(#arrowOrange)"/>
  <line x1="668" y1="180" x2="742" y2="188" stroke="#fd800b" stroke-width="1.6" marker-end="url(#arrowOrange)"/>
  <line x1="668" y1="204" x2="742" y2="240" stroke="#fd800b" stroke-width="1.6" marker-end="url(#arrowOrange)"/>

  <!-- ===== Column 3: outcomes ===== -->
  <g>
    <rect x="750" y="59" width="160" height="42" rx="8" fill="#ffffff" stroke="#cfd9e2"/>
    <text x="830" y="77" text-anchor="middle" font-size="12" font-weight="600" fill="#1d1d1d">Green gates</text>
    <text x="830" y="92" text-anchor="middle" font-size="10.5" fill="#6b7280">types &#183; lint &#183; deps &#183; secrets</text>

    <rect x="750" y="113" width="160" height="42" rx="8" fill="#ffffff" stroke="#cfd9e2"/>
    <text x="830" y="131" text-anchor="middle" font-size="12" font-weight="600" fill="#1d1d1d">Device E2E</text>
    <text x="830" y="146" text-anchor="middle" font-size="10.5" fill="#6b7280">iOS + Android &#183; Maestro</text>

    <rect x="750" y="167" width="160" height="42" rx="8" fill="#ffffff" stroke="#cfd9e2"/>
    <text x="830" y="185" text-anchor="middle" font-size="12" font-weight="600" fill="#1d1d1d">Signed builds</text>
    <text x="830" y="200" text-anchor="middle" font-size="10.5" fill="#6b7280">fastlane &#183; verified artifact</text>

    <rect x="750" y="221" width="160" height="42" rx="8" fill="#ffffff" stroke="#fd800b"/>
    <text x="830" y="239" text-anchor="middle" font-size="12" font-weight="600" fill="#1d1d1d">Store releases</text>
    <text x="830" y="254" text-anchor="middle" font-size="10.5" fill="#fc5805">TestFlight &#183; Play &#183; OTA</text>
  </g>

  <!-- footer caption -->
  <text x="480" y="308" text-anchor="middle" font-size="11.5" fill="#6b7280">The shared engineering baseline &#8212; fix the emulator boot once, and every app in the family gets it.</text>
</svg>
