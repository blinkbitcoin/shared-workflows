rules:
  - id: rn-secret-in-plain-storage
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      A token, secret, password or credential is being written to unencrypted
      key-value storage: AsyncStorage or expo-sqlite/kv-store. Both are
      unencrypted on both platforms. Use the keychain/keystore
      (expo-secure-store) instead. A wrapper an app puts in front of them is
      the app's own rule to write. Covers "token"/"secret"/"password"/
      "credential" as a whole identifier segment anywhere (auth_token,
      authToken, sessionToken, userPassword, refreshSecret) plus "key" when
      qualified by api/access/private/secret/signing/encryption/auth/session/
      refresh (apiKey, privateKey). Deliberately does not cover an
      unqualified "key" (keyExtractor, sortKey, keyboardHeight): the bare
      word is genuinely ambiguous in this ecosystem - a list key, a sort key,
      a translation key - so it is out of scope by design, not a miss.
    metadata:
      category: security
      references:
        - https://docs.expo.dev/versions/latest/sdk/securestore/
    patterns:
      - pattern-either:
          - pattern: AsyncStorage.setItem($KEY, $VALUE)
          # expo-sqlite/kv-store under whatever name it is imported as, through
          # any of its three writers (setItem is an alias of setItemAsync).
          - patterns:
              - pattern-inside: |
                  import $S from 'expo-sqlite/kv-store';
                  ...
              - pattern: $S.$SET($KEY, $VALUE)
              - metavariable-regex:
                  metavariable: $SET
                  regex: ^setItem(Sync|Async)?$
      - metavariable-regex:
          metavariable: $KEY
          # Three alternatives, each wrapped in leading/trailing .* because
          # Semgrep's metavariable-regex requires a full-string match:
          #   1. token/secret/password/credential as a snake_case or
          #      standalone segment, case-insensitive, bounded by a
          #      non-letter or string edge (auth_token, TOKEN).
          #   2. the same four words as a capitalized camelCase segment,
          #      matched case-sensitively and only when the character right
          #      before it is lowercase - a real camelCase transition, not
          #      merely "preceded by some lowercase letter" (authToken,
          #      sessionToken, userPassword).
          #   3. key qualified by one of nine prefixes immediately before it
          #      (apiKey, access_key, privateKey) - bare "key" alone never
          #      matches through this branch.
          regex: '.*(?i:(^|[^a-zA-Z])(token|secret|password|credential)([^a-zA-Z]|$|(?=[A-Z]))).*|.*(?<=[a-z])(Token|Secret|Password|Credential)([^a-zA-Z]|$|(?=[A-Z])).*|.*(?i:(^|[^a-zA-Z])(api|access|private|secret|signing|encryption|auth|session|refresh)[-_]?key([^a-zA-Z]|$|(?=[A-Z]))).*'

  - id: rn-cleartext-fetch
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      An http:// network endpoint (fetch/axios/XMLHttpRequest/WebSocket/
      baseURL), whether a literal or a constant reused at the call site.
      Cleartext traffic is blocked by App Transport Security and the Android
      network security config, and leaks in transit. Not matched: non-network
      strings such as an xmlns namespace or schema URI.
    mode: taint
    # A plain metavariable-regex on the call-site pattern's argument only
    # catches an inline literal (see fix round 1); it does not resolve a
    # variable back to its assignment. Taint mode does: any http:// literal
    # (source) that reaches one of these call positions (sink) is reported,
    # whether it is passed directly or through a `const BASE_URL = '...'`
    # a few lines above.
    pattern-sources:
      - pattern-regex: (?i)["']http://(?!localhost|127\.0\.0\.1)[^"']+["']
    pattern-sinks:
      - pattern: fetch($URL, ...)
      - pattern: axios.$METHOD($URL, ...)
      - pattern: axios($URL, ...)
      - pattern: 'axios({ url: $URL, ... })'
      - pattern: $XHR.open($METHOD, $URL, ...)
      - pattern: new WebSocket($URL, ...)
      - pattern: '{ baseURL: $URL, ... }'
      - pattern: '{ url: $URL, ... }'
      - pattern: '{ uri: $URL, ... }'

  - id: rn-webview-injected-javascript
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      injectedJavaScript(BeforeContentLoaded) runs with the page's privileges.
      Interpolating a value into it is an injection; pass data through
      postMessage instead.
    patterns:
      - pattern-either:
          - pattern: <$TAG ... injectedJavaScript={`...${$X}...`} ... />
          - pattern: <$TAG ... injectedJavaScriptBeforeContentLoaded={`...${$X}...`} ... />
